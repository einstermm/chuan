<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>设置</title>
  <link rel="stylesheet" href="./css/common.css">
  <link rel="stylesheet" href="./css/settings.css">
</head>
<body>
  <aside class="sidebar">
    <div class="brand">量化交易系统</div>
    <nav class="nav" id="nav"></nav>
    <button class="collapse-btn" type="button">收起</button>
  </aside>

  <main class="workspace">
    <header class="topbar">
      <div>
        <h1>设置</h1>
        <p class="subtitle">配置系统环境、交易所连接、默认执行参数、通知告警与日志存储策略</p>
      </div>
      <div class="top-actions">
        <button class="btn" type="button">重置更改</button>
        <button class="btn" type="button">测试连接</button>
        <button class="btn primary" type="button">保存设置</button>
      </div>
    </header>

    <section class="summary-grid" id="summaryGrid"></section>

    <section class="panel">
      <div class="tabs" id="settingTabs"></div>
      <div id="settingContent"></div>
    </section>

    <section class="panel">
      <h2>最近配置变更</h2>
      <table>
        <thead>
          <tr>
            <th>时间</th>
            <th>配置项</th>
            <th>变更前</th>
            <th>变更后</th>
            <th>操作人</th>
            <th>状态</th>
          </tr>
        </thead>
        <tbody id="changeRows"></tbody>
      </table>
    </section>
  </main>

  <script src="./js/common.js"></script>
  <script src="./js/settings.js"></script>
</body>
</html>
