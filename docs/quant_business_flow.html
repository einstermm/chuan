<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>量化交易系统业务闭环</title>
  <style>
    :root{--bg:#f6f7f8;--panel:#fff;--line:#d9dde3;--text:#1f2933;--muted:#697386;--primary:#1f6feb;--ok:#137333;--warn:#8a5a00;--danger:#c53030}
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,"Microsoft YaHei",sans-serif;font-size:14px;line-height:1.5}
    header{padding:18px 24px;border-bottom:1px solid var(--line);background:var(--panel)}
    h1,h2,h3{margin:0;font-weight:600}
    h1{font-size:22px}
    h2{font-size:17px;margin-bottom:12px}
    h3{font-size:15px;margin-bottom:8px}
    main{max-width:1560px;margin:0 auto;padding:18px}
    a{color:var(--primary);text-decoration:none;font-weight:600}
    a:hover{text-decoration:underline}
    button{min-height:34px;padding:7px 12px;border:1px solid #b6c2d1;border-radius:4px;background:#fff;color:var(--text);cursor:pointer;font:inherit}
    button.primary{border-color:var(--primary);background:var(--primary);color:#fff}
    input,select{width:100%;min-height:34px;padding:7px 9px;border:1px solid #c9d1dc;border-radius:4px;background:#fff;color:var(--text);font:inherit}
    table{width:100%;border-collapse:collapse;background:#fff}
    th,td{padding:9px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
    th{background:#f8fafc;color:#344054;font-size:13px;font-weight:600}
    .panel{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:14px;margin-bottom:14px}
    .layout{display:grid;grid-template-columns:280px minmax(0,1fr);gap:14px}
    .stage-list{display:grid;gap:8px}
    .stage-card{width:100%;padding:10px;border:1px solid var(--line);border-radius:6px;background:#fff;text-align:left}
    .stage-card.active{border-color:var(--primary);box-shadow:inset 3px 0 0 var(--primary)}
    .stage-name{font-weight:600}
    .stage-layer{margin-top:4px;color:var(--muted);font-size:12px}
    .object-chain{display:flex;flex-wrap:wrap;gap:8px}
    .object{display:inline-flex;align-items:center;min-height:30px;padding:5px 8px;border:1px solid var(--line);border-radius:999px;background:#fbfcfd;color:#344054;font-size:12px}
    .two-col{display:grid;grid-template-columns:1fr 1fr;gap:14px}
    .field-table td:first-child{width:110px;color:var(--muted)}
    .detail-copy{margin:0 0 12px;color:#344054}
    .flow-line{margin-bottom:12px;color:#344054;overflow:auto}
    .flow-table th,.flow-table td{white-space:normal}
    .flow-table td:nth-child(1){width:150px}
    .detail-subtitle{margin:14px 0 8px;font-size:14px;font-weight:600}
    .task-chips{display:flex;flex-wrap:wrap;gap:6px}
    .task-chip{display:inline-block;padding:4px 8px;border:1px solid var(--line);border-radius:999px;background:#fbfcfd;color:var(--primary);font-size:12px;font-weight:600}
    .status-ok{color:var(--ok)}
    .status-warn{color:var(--warn)}
    .muted{color:var(--muted)}
    @media(max-width:1100px){.layout,.two-col{grid-template-columns:1fr}main{padding:12px}}
  </style>
</head>
<body>

          <div class="detail-subtitle">解耦边界</div>

      {seq:2,name:"数据质检",display:"数据质检 DataQualityCheck",upstream:"历史数据、实时行情数据",downstream:"特征生成",trace:"缺失、重复、异常价格、时间戳错位、数据延迟"},
      {seq:3,name:"特征生成",display:"特征生成 FeatureGeneration",upstream:"数据质检后的数据",downstream:"信号研究、回测验证、模拟交易、实盘信号",trace:"特征版本、计算逻辑、窗口参数、依赖数据"},
      {seq:4,name:"实时行情数据",display:"实时行情数据 LiveMarketData",upstream:"交易所实时行情、盘口、成交、K线",downstream:"实盘信号、执行中风控监控、风险计算",trace:"实时价格、盘口深度、延迟、行情质量"},
      {seq:5,name:"信号研究",display:"信号研究 SignalResearch",upstream:"特征生成、历史数据、研究假设",downstream:"策略参数",trace:"信号逻辑、因子逻辑、研究结论"},
      {seq:6,name:"策略参数",display:"策略参数 StrategyParameterSet",upstream:"信号研究、参数迭代",downstream:"回测验证、模拟交易、上线审批、上线配置",trace:"参数版本、阈值、周期、仓位规则"},
      {seq:7,name:"回测验证",display:"回测验证 BacktestRun",upstream:"策略参数、历史数据、特征",downstream:"模拟交易、上线审批",trace:"回测区间、收益、回撤、夏普、换手、费用假设"},
      {seq:8,name:"模拟交易",display:"模拟交易 PaperTradingRun",upstream:"策略参数、实时或仿真实时行情、回测结果",downstream:"上线审批",trace:"实时环境下的策略稳定性、延迟、滑点"},
      {seq:9,name:"上线审批",display:"上线审批 DeploymentApproval",upstream:"回测验证、模拟交易、风险评估、人工审批",downstream:"上线配置",trace:"谁审批、审批时间、审批依据、上线范围"},
      {seq:10,name:"上线配置",display:"上线配置 DeploymentConfig",upstream:"上线审批、策略参数、账户配置、风控规则",downstream:"实盘信号、交易前风控检查、执行中风控监控",trace:"部署版本、账户、品种、限额、开关状态"},
      {seq:11,name:"实盘信号",display:"实盘信号 LiveSignal",upstream:"上线配置、实时行情数据、特征生成",downstream:"组合决策",trace:"信号方向、强度、置信度、策略版本"},
      {seq:12,name:"组合决策",display:"组合决策 PortfolioDecision",upstream:"实盘信号、当前持仓、现金、风险状态",downstream:"目标组合",trace:"多信号合成、仓位约束、风险预算"},
      {seq:13,name:"目标组合",display:"目标组合 PortfolioTarget",upstream:"组合决策",downstream:"调仓计划",trace:"目标资产、目标权重、目标数量"},
      {seq:14,name:"调仓计划",display:"调仓计划 RebalancePlan",upstream:"目标组合、当前持仓、现金账本",downstream:"订单意图",trace:"当前组合与目标组合之间的差额"},
      {seq:15,name:"订单意图",display:"订单意图 OrderIntent",upstream:"调仓计划",downstream:"交易前风控检查",trace:"买卖方向、数量、价格约束、账户、交易标的"},
      {seq:16,name:"交易前风控检查",display:"交易前风控检查 PreTradeRiskCheck",upstream:"订单意图、上线配置、风险计算、持仓账本、现金账本",downstream:"执行计划",trace:"是否允许交易、是否超限、是否拒单或调整"},
      {seq:17,name:"执行计划",display:"执行计划 ExecutionPlan",upstream:"交易前风控检查通过的订单意图",downstream:"Hummingbot 适配器",trace:"执行方式、拆单规则、限价/市价、时间策略"},
      {seq:18,name:"Hummingbot 适配器",display:"Hummingbot 适配器 HummingbotAdapter",upstream:"执行计划",downstream:"Hummingbot 执行任务",trace:"系统内部订单到 Hummingbot 指令的转换"},
      {seq:19,name:"Hummingbot 执行任务",display:"Hummingbot 执行任务 HummingbotTask",upstream:"Hummingbot 适配器",downstream:"执行中风控监控、交易所订单",trace:"任务状态、执行进度、任务参数"},
      {seq:20,name:"执行中风控监控",display:"执行中风控监控 InTradeRiskMonitor",upstream:"Hummingbot 执行任务、交易所订单、实时行情、风控配置",downstream:"交易所订单、撤单/暂停/调整动作",trace:"执行过程中的风险、滑点、异常波动"},
      {seq:21,name:"交易所订单",display:"交易所订单 ExchangeOrder",upstream:"Hummingbot 执行任务、执行中风控监控",downstream:"订单事件流",trace:"交易所订单号、客户订单号、订单状态"},
      {seq:22,name:"订单事件流",display:"订单事件流 OrderEventStream",upstream:"交易所订单、交易所回报",downstream:"成交事件流",trace:"提交、确认、部分成交、完全成交、撤单、拒单"},
      {seq:23,name:"成交事件流",display:"成交事件流 FillEventStream",upstream:"订单事件流",downstream:"成交幂等处理",trace:"成交编号、成交价格、成交数量、成交时间"},
      {seq:24,name:"成交幂等处理",display:"成交幂等处理 FillIdempotencyProcessor",upstream:"成交事件流",downstream:"持仓账本、现金账本、费用账本",trace:"防止重复成交、乱序事件、重复记账"},
      {seq:25,name:"持仓账本",display:"持仓账本 PositionLedger",upstream:"成交幂等处理",downstream:"盈亏计算、风险计算、调仓计划、交易前风控检查",trace:"持仓数量、成本、持仓变化"},
      {seq:26,name:"现金账本",display:"现金账本 CashLedger",upstream:"成交幂等处理",downstream:"盈亏计算、风险计算、调仓计划、交易前风控检查",trace:"可用现金、冻结现金、资金变化"},
      {seq:27,name:"费用账本",display:"费用账本 FeeLedger",upstream:"成交幂等处理",downstream:"盈亏计算、业绩归因",trace:"手续费、资金费率、交易成本"},
      {seq:28,name:"盈亏计算",display:"盈亏计算 PnLEngine",upstream:"持仓账本、现金账本、费用账本、实时行情",downstream:"风险计算、业绩归因、策略复盘",trace:"已实现盈亏、未实现盈亏、净值曲线"},
      {seq:29,name:"风险计算",display:"风险计算 RiskEngine",upstream:"持仓账本、现金账本、盈亏计算、实时行情",downstream:"交易前风控检查、执行中风控监控、组合决策、策略复盘",trace:"敞口、杠杆、回撤、VaR、集中度"},
      {seq:30,name:"交易所对账",display:"交易所对账 Reconciliation",upstream:"交易所订单、成交事件、内部账本、交易所账户数据",downstream:"策略复盘、账本修正、异常处理",trace:"内外部持仓、现金、成交、费用是否一致"},
      {seq:31,name:"业绩归因",display:"业绩归因 Attribution",upstream:"盈亏计算、费用账本、持仓账本、交易记录",downstream:"策略复盘",trace:"收益来源、亏损来源、费用影响、滑点影响"},
      {seq:32,name:"策略复盘",display:"策略复盘 StrategyReview",upstream:"业绩归因、风险计算、交易所对账、执行质量",downstream:"参数迭代",trace:"策略是否继续、暂停、调参、下线"},
      {seq:33,name:"参数迭代",display:"参数迭代 ParameterIteration",upstream:"策略复盘",downstream:"策略参数、信号研究、回测验证",trace:"新参数、新假设、新研究方向"}
    ];

    const nodeRelationByName = Object.fromEntries(nodeRelations.map(node => [node.name, node]));

    const layerDetails = {
      data_layer: {
        intro:"这一层只负责数据，不负责策略，不负责下单。",
        boundary:"数据层不判断买卖，只提供可信数据。",
        rows:[
          ["历史数据","接入历史 K 线、成交、盘口、资金费率等数据","原始数据集"],
          ["数据质检","检查缺失、重复、异常价格、时间错位","数据版本"],
          ["特征生成","生成动量、波动率、成交量、资金费率等特征","特征版本"],
          ["实时行情数据","接入实时价格、盘口、成交、账户状态","实时行情事件"]
        ]
      },
      research_validation_layer: {
        intro:"这一层只负责研究策略是否有效，不负责实盘交易。",
        boundary:"研究验证层只能产生“可上线候选策略”，不能直接影响实盘账户。",
        rows:[
          ["信号研究","判断信号是否有预测能力","信号定义"],
          ["策略参数","配置入场、出场、仓位、止损、调仓周期","参数版本"],
          ["回测验证","验证历史收益、回撤、胜率、手续费、滑点","回测报告"],
          ["模拟交易","用实时行情模拟策略运行，不真实下单","模拟交易报告"]
        ]
      },
      deployment_governance_layer: {
        intro:"这一层负责把研究策略变成可以实盘运行的生产配置。",
        boundary:"上线配置是研究环境和实盘环境之间的隔离层。没有上线配置，实盘信号层不能启动。",
        rows:[
          ["上线审批","投资、风控、技术确认是否允许上线","审批记录"],
          ["上线配置","配置账户、标的、资金上限、风控限额、执行方式","上线配置快照"]
        ]
      },
      live_signal_layer: {
        intro:"这一层只负责生成实盘信号，不负责决定最终买多少。",
        boundary:"实盘信号只是“交易观点”，不是订单。正确流向是：实盘信号 -> 组合决策。",
        rows:[
          ["实盘信号","根据实时行情和上线策略生成买入、卖出、空仓等信号","实盘信号事件"]
        ]
      },
      portfolio_decision_layer: {
        intro:"这一层负责把信号变成目标组合。",
        boundary:"组合决策层不直接下单，只输出“应该调什么仓”。",
        rows:[
          ["组合决策","结合信号、当前持仓、现金、风险限额，判断是否调仓","组合决策结果"],
          ["目标组合","定义希望最终持有什么仓位","目标组合"],
          ["调仓计划","比较当前持仓和目标持仓，计算需要交易什么","调仓计划"]
        ]
      },
      order_intent_layer: {
        intro:"这一层负责把调仓计划转换为交易意图，并做交易前风控。",
        boundary:"订单意图还不是 Hummingbot 任务，也不是交易所订单。",
        rows:[
          ["订单意图","表达想交易什么、交易多少、什么时间完成","订单意图"],
          ["交易前风控检查","检查余额、杠杆、限额、持仓、交易规则","已批准订单意图"]
        ]
      },
      execution_planning_layer: {
        intro:"这一层负责决定订单怎么执行。",
        boundary:"执行计划层不直接操作交易所。它只生成执行引擎可以使用的配置。",
        rows:[
          ["执行计划","决定市价、限价、分批、做 maker、做 taker 等执行方式","执行计划"],
          ["Hummingbot 适配器","把平台执行计划转换成 Hummingbot 能理解的任务配置","Hummingbot 任务配置"]
        ]
      },
      hummingbot_execution_layer: {
        intro:"这一层只负责执行，不负责组合决策，不负责策略复盘。",
        boundary:"Hummingbot 是执行引擎，不是完整投资系统。它负责接收任务、创建订单、撤单、追踪订单并回传状态和成交事件。",
        rows:[
          ["Hummingbot 执行任务","启动 Bot，连接交易所，创建订单，撤单，追踪订单","Hummingbot 执行状态"],
          ["执行中风控监控","在订单执行过程中监控撤单、超时、滑点、异常和退出条件","执行中风险状态"],
          ["交易所订单","交易所真实接收的订单","交易所订单"]
        ]
      },
      trading_event_layer: {
        intro:"这一层负责接收订单状态和成交事件。",
        boundary:"交易事件层只记录事实，不直接修改策略参数。它需要维护订单意图编号、执行计划编号、Hummingbot 订单编号、交易所订单编号和成交编号之间的映射。",
        rows:[
          ["订单事件流","记录订单创建、提交、部分成交、完全成交、撤单、拒单、失败","订单事件"],
          ["成交事件流","记录真实成交价格、数量、手续费、成交时间","成交事件"],
          ["成交幂等处理","根据成交编号、订单编号和交易所成交记录去重，避免重复入账","幂等成交记录"]
        ]
      },
      ledger_risk_layer: {
        intro:"这一层负责把成交事件转成持仓、现金、费用、盈亏和风险。",
        boundary:"账本风控层只根据成交和行情计算结果，不直接创建订单。",
        rows:[
          ["持仓账本","根据成交更新持仓数量、平均成本、可用持仓","持仓快照"],
          ["现金账本","根据成交更新现金余额、冻结资金、保证金","现金快照"],
          ["费用账本","记录手续费、资金费率、借贷费用、返佣","费用明细"],
          ["盈亏计算","计算已实现盈亏、未实现盈亏、当日盈亏","盈亏结果"],
          ["风险计算","计算杠杆、敞口、回撤、保证金率、亏损限额","风险快照"],
          ["交易所对账","对比平台账本和交易所账户是否一致","对账结果"]
        ]
      },
      review_iteration_layer: {
        intro:"这一层负责把实盘结果反馈给研究和参数。",
        boundary:"复盘迭代层不能直接修改正在运行的生产参数。它只能生成新的参数版本，再重新进入回测、模拟交易、上线审批。",
        rows:[
          ["业绩归因","分析收益来自信号、仓位、执行、手续费、资金费率还是市场波动","归因报告"],
          ["策略复盘","判断策略是否有效、执行是否偏离、风控是否合理","复盘结论"],
          ["参数迭代","根据复盘结果调整策略参数","新参数版本"]
        ]
      }
    };

    const els = {
      stageList: document.getElementById("stageList"),
      detailTitle: document.getElementById("detailTitle"),
      detailIntro: document.getElementById("detailIntro"),
      detailObjects: document.getElementById("detailObjects"),
      detailBoundary: document.getElementById("detailBoundary")
    };

    let selectedStage = "";

    function renderStages(){
      els.stageList.innerHTML = stages.map(s => `<button class="stage-card ${s.id===selectedStage?"active":""}" data-stage="${s.id}">
        <div class="stage-name">${escapeHtml(s.index)} ${escapeHtml(s.name)}</div>
        <div class="stage-layer">${escapeHtml(s.layer)}</div>
      </button>`).join("");
      document.querySelectorAll("[data-stage]").forEach(btn => btn.addEventListener("click", () => selectStage(btn.dataset.stage)));
    }

    function selectStage(id){
      selectedStage = id;
      render();
    }

    function currentStageDef(){
      return stages.find(s => s.id === selectedStage);
    }

    function renderDetail(){
      const s = currentStageDef();
      const detail = s ? layerDetails[s.id] : null;
      els.detailTitle.textContent = s ? `${s.index} ${s.name}` : "主线全览";
      els.detailIntro.textContent = detail ? detail.intro : "每一层只负责一类事情，层与层之间用标准对象传递。";
      els.detailObjects.innerHTML = renderBusinessChain(s);
      els.detailBoundary.textContent = detail ? detail.boundary : "系统大脑和 Hummingbot 执行层解耦；信号不直接下单，Hummingbot 不承担组合、风控、账本和复盘职责。";
    }

    function renderBusinessChain(stage){
      const rows = stage ? stage.nodes.map(node => nodeRelationByName[node.name]).filter(Boolean) : nodeRelations;
      return `<table class="flow-table">
          <thead><tr><th>业务节点</th><th>直接上游</th><th>直接下游</th><th>作用</th><th>输出对象</th></tr></thead>
          <tbody>${rows.map(row => `<tr>
            <td>${escapeHtml(row.name)}</td>
            <td>${escapeHtml(row.upstream)}</td>
            <td>${escapeHtml(row.downstream)}</td>
            <td>${escapeHtml(nodeDetail(row.name, 1))}</td>
            <td>${escapeHtml(nodeDetail(row.name, 2))}</td>
          </tr>`).join("")}</tbody>
        </table>`;
    }

    function nodeDetail(name, index){
      const row = Object.values(layerDetails).flatMap(detail => detail.rows).find(item => item[0] === name);
      return row ? row[index] : "-";
    }

    function render(){
      renderStages();
      renderDetail();
    }

    function escapeHtml(v){
      return String(v).replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;");
    }

    render();
  </script>
</body>
</html>
