<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>量化交易系统业务闭环</title>
  <style>
    :root{--bg:#f6f7f8;--panel:#fff;--line:#d9dde3;--text:#1f2933;--muted:#697386;--primary:#1f6feb;--ok:#137333;--warn:#8a5a00;--danger:#c53030}
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,"Microsoft YaHei",sans-serif;font-size:14px;line-height:1.5}
    header{padding:18px 24px;border-bottom:1px solid var(--line);background:var(--panel)}
    h1,h2,h3{margin:0;font-weight:600}
    h1{font-size:22px}
    h2{font-size:17px;margin-bottom:12px}
    h3{font-size:15px;margin-bottom:8px}
    main{max-width:1280px;margin:0 auto;padding:18px}
    a{color:var(--primary);text-decoration:none;font-weight:600}
    a:hover{text-decoration:underline}
    button{min-height:34px;padding:7px 12px;border:1px solid #b6c2d1;border-radius:4px;background:#fff;color:var(--text);cursor:pointer;font:inherit}
    button.primary{border-color:var(--primary);background:var(--primary);color:#fff}
    input,select{width:100%;min-height:34px;padding:7px 9px;border:1px solid #c9d1dc;border-radius:4px;background:#fff;color:var(--text);font:inherit}
    table{width:100%;border-collapse:collapse;background:#fff}
    th,td{padding:9px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
    th{background:#f8fafc;color:#344054;font-size:13px;font-weight:600}
    .panel{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:14px;margin-bottom:14px}
    .layout{display:grid;grid-template-columns:320px 1fr;gap:14px}
    .stage-list{display:grid;gap:8px}
    .stage-card{width:100%;padding:10px;border:1px solid var(--line);border-radius:6px;background:#fff;text-align:left}
    .stage-card.active{border-color:var(--primary);box-shadow:inset 3px 0 0 var(--primary)}
    .stage-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
    .stage-name{font-weight:600}
    .stage-count{color:var(--muted);font-size:12px}
    .stage-layer{margin-top:4px;color:var(--muted);font-size:12px}
    .object-chain{display:flex;flex-wrap:wrap;gap:8px}
    .object{display:inline-flex;align-items:center;min-height:30px;padding:5px 8px;border:1px solid var(--line);border-radius:999px;background:#fbfcfd;color:#344054;font-size:12px}
    .two-col{display:grid;grid-template-columns:1fr 1fr;gap:14px}
    .field-table td:first-child{width:110px;color:var(--muted)}
    .task-chips{display:flex;flex-wrap:wrap;gap:6px}
    .task-chip{display:inline-block;padding:4px 8px;border:1px solid var(--line);border-radius:999px;background:#fbfcfd;color:var(--primary);font-size:12px;font-weight:600}
    .status-ok{color:var(--ok)}
    .status-warn{color:var(--warn)}
    .muted{color:var(--muted)}
    @media(max-width:1100px){.layout,.two-col{grid-template-columns:1fr}main{padding:12px}}
  </style>
</head>
<body>
  <header><h1>量化交易系统业务闭环</h1></header>
  <main>
    <section class="layout">
      <aside class="panel">
        <h2>主线导航</h2>
        <div class="stage-list" id="stageList"></div>
      </aside>

      <div>
        <section class="panel">
          <h2 id="detailTitle">主线全览</h2>
          <table class="field-table">
            <tbody>
              <tr><td>输入</td><td id="detailInput">-</td></tr>
              <tr><td>输出</td><td id="detailOutput">-</td></tr>
              <tr><td>关键动作</td><td id="detailAction">-</td></tr>
              <tr><td>业务链路</td><td id="detailObjects">-</td></tr>
            </tbody>
          </table>
        </section>

        <section class="panel">
          <h2>任务入口</h2>
          <table>
            <thead><tr><th>产品节点</th><th>编号</th><th>任务</th><th>业务对象</th></tr></thead>
            <tbody id="taskRows"></tbody>
          </table>
        </section>
      </div>
    </section>

  </main>

  <script>
    const stages = [

        {name:"历史数据", taskIds:["S-D-01"]},

        {name:"信号研究", taskIds:["S-A-01","S-A-04","S-A-05"]},

        {name:"上线审批", taskIds:["S-C-07"]},
        {name:"上线配置", taskIds:["H-A-01-01","H-A-01","H-A-02"]}

        {name:"实时行情数据", taskIds:["H-A-05","H-A-06"]},
        {name:"实盘信号", taskIds:["S-A-02","S-A-03","S-A-06","S-A-07"]}
      ]},
      {id:"portfolio_decision_layer", index:"05", name:"组合决策层", layer:"系统大脑", chain:"组合决策 -> 目标组合 -> 调仓计划", input:"实盘信号 / 资金规则 / 当前仓位", output:"目标组合 / 调仓计划", objects:"组合约束 -> 目标仓位 -> 调仓计划", action:"决定组合层面应该持有什么、持多少、如何调仓", boundary:"系统大脑", nodes:[
        {name:"组合决策", taskIds:["S-B-01","S-B-02","S-B-03","S-B-05"]},

      {id:"hummingbot_execution_layer", index:"08", name:"Hummingbot 执行层", layer:"执行和交易所连接层", chain:"Hummingbot 执行任务 -> 交易所订单", input:"Hummingbot 请求 / 连接器 / 交易规则", output:"交易所订单 / 执行器状态", objects:"执行任务 -> 交易所订单", action:"执行普通订单、时间加权分批、持仓执行器、网格、定投", boundary:"执行和交易所连接层", nodes:[

      {id:"trading_event_layer", index:"09", name:"交易事件层", layer:"执行和交易所连接层 -> 系统大脑", chain:"订单事件流 -> 成交事件流", input:"交易所订单 / Hummingbot 事件", output:"订单事件 / 成交事件 / 回传消息", objects:"订单事件 -> 成交事件 -> 状态回传", action:"跟踪订单生命周期，把成交和状态回传系统", boundary:"执行和交易所连接层 + 系统大脑", nodes:[

        {name:"持仓账本", taskIds:["H-A-04"]},
        {name:"现金账本", taskIds:["H-A-03"]},
        {name:"费用账本", taskIds:[]},
        {name:"盈亏计算", taskIds:["S-E-03"]},
        {name:"风险计算", taskIds:["S-E-05","S-E-06","S-E-07"]},

      ]},
      {id:"review_iteration_layer", index:"11", name:"复盘迭代层", layer:"系统大脑", chain:"业绩归因 -> 策略复盘 -> 参数迭代", input:"盈亏结果 / 风险事件 / 交易日志 / 回测参数", output:"复盘报告 / 新参数版本", objects:"交易结果 -> 策略复盘 -> 参数迭代", action:"复盘实盘表现，并把结果反馈到研究验证层", boundary:"系统大脑", nodes:[
        {name:"业绩归因", taskIds:[]},

    const taskMap = {
      "S-A-01":["设计策略逻辑","development_pages/S-A-01_design_strategy_logic.html","策略逻辑"],
      "S-A-02":["计算交易信号","development_pages/S-A-02_calculate_trading_signal.html","实盘信号"],

      "S-C-02":["设置单周最大亏损限制","development_pages/S-C-02_set_weekly_loss_limit.html","周亏损限制"],
      "S-C-03":["设置单策略最大亏损限制","development_pages/S-C-03_set_strategy_loss_limit.html","策略亏损限制"],

      "S-C-08":["决定是否允许订单意图发送给 Hummingbot","development_pages/S-C-08_allow_order_intent_to_hummingbot.html","风控放行结果"],
      "S-D-01":["下载历史行情数据","development_pages/S-D-01_download_historical_market_data.html","历史行情数据"],

      "H-A-01":["配置交易所接口密钥","hummingbot_pages/H-A-01_config_exchange_api_key.html","交易所凭据"],

      "H-C-02":["处理订单成交","hummingbot_pages/H-C-02_handle_order_fills.html","成交事件"],
      "H-C-03":["处理部分成交","hummingbot_pages/H-C-03_handle_partial_fills.html","部分成交事件"],
      "H-C-04":["处理订单失败","hummingbot_pages/H-C-04_handle_order_failure.html","失败事件"],
      "H-C-05":["自动撤单","hummingbot_pages/H-C-05_auto_cancel_orders.html","撤单事件"],
      "H-C-06":["订单超时处理","hummingbot_pages/H-C-06_order_timeout_handling.html","超时事件"],
      "H-C-07":["止损、止盈、时间退出执行","hummingbot_pages/H-C-07_stop_loss_take_profit_time_exit.html","退出执行事件"],
      "H-C-08":["将订单和成交状态返回给你的系统","hummingbot_pages/H-C-08_return_order_fill_status.html","状态回传"]
    };

    const tasks = stages.flatMap(stage => stage.nodes.flatMap(node => node.taskIds.map(id => {
      const [name, href, object] = taskMap[id];
      return {...stage, nodeName:node.name, taskId:id, taskName:name, href, taskObject:object};
    })));

    const els = {
      stageList: document.getElementById("stageList"),
      rows: document.getElementById("taskRows"),
      detailTitle: document.getElementById("detailTitle"),
      detailInput: document.getElementById("detailInput"),
      detailOutput: document.getElementById("detailOutput"),
      detailObjects: document.getElementById("detailObjects"),
      detailAction: document.getElementById("detailAction")
    };

    let selectedStage = "";

    function renderStages(){
      els.stageList.innerHTML = stages.map(s => `<button class="stage-card ${s.id===selectedStage?"active":""}" data-stage="${s.id}">
        <div class="stage-top"><span class="stage-name">${escapeHtml(s.index)} ${escapeHtml(s.name)}</span><span class="stage-count">${s.taskIds.length}</span></div>
        <div class="stage-layer">${escapeHtml(s.layer)}</div>
      </button>`).join("");
      document.querySelectorAll("[data-stage]").forEach(btn => btn.addEventListener("click", () => selectStage(btn.dataset.stage)));
    }

    function selectStage(id){
      selectedStage = id;
      render();
    }

    function currentStageDef(){
      return stages.find(s => s.id === selectedStage);
    }

    function renderDetail(){
      const s = currentStageDef();
      els.detailTitle.textContent = s ? `${s.index} ${s.name}` : "主线全览";
      els.detailInput.textContent = s ? s.input : "历史数据 -> 信号研究 -> 策略参数 -> 回测验证 -> 上线配置 -> 实盘信号";
      els.detailOutput.textContent = s ? s.output : "目标组合 -> 订单意图 -> 执行任务 -> 订单事件 -> 成交事件 -> 账本风控 -> 复盘迭代";
      els.detailObjects.textContent = s ? s.chain : "历史数据 -> 数据质检 -> 特征生成 -> 信号研究 -> 策略参数 -> 回测验证 -> 上线配置 -> 实盘信号 -> 组合决策 -> 订单意图 -> 执行计划 -> 执行任务 -> 交易事件 -> 账本风控 -> 复盘迭代";
      els.detailAction.textContent = s ? s.action : "按交易生命周期查看全部原型入口";
    }

    function renderTasks(){
      const rows = selectedStage ? tasks.filter(t => t.id === selectedStage) : tasks;
      els.rows.innerHTML = rows.length ? rows.map(t => `<tr>
        <td>${escapeHtml(t.index)} ${escapeHtml(t.name)} / ${escapeHtml(t.nodeName)}</td>
        <td><a href="${t.href}" target="_blank" rel="noopener">${escapeHtml(t.taskId)}</a></td>
        <td>${escapeHtml(t.taskName)}</td>
        <td>${escapeHtml(t.taskObject)}</td>
      </tr>`).join("") : `<tr><td colspan="4" class="muted">无匹配任务。</td></tr>`;
    }

    function render(){
      renderStages();
      renderDetail();
      renderTasks();
    }

    function escapeHtml(v){
      return String(v).replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;");
    }

    render();
  </script>
</body>
</html>
