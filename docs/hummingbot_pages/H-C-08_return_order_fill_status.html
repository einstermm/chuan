<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>H-C-08 返回订单成交状态</title>
<style>:root{--bg:#f6f7f8;--panel:#fff;--line:#d9dde3;--text:#1f2933;--muted:#697386;--primary:#1f6feb;--danger:#c53030;--ok:#137333}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,"Microsoft YaHei",sans-serif;font-size:14px;line-height:1.5}header{padding:18px 24px;border-bottom:1px solid var(--line);background:#fff}h1,h2{margin:0;font-weight:600}h1{font-size:22px}h2{font-size:17px;margin-bottom:12px}main{max-width:1180px;margin:0 auto;padding:18px}.panel{background:#fff;border:1px solid var(--line);border-radius:6px;padding:14px;margin-bottom:14px}.form{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;align-items:end}label{display:block;margin-bottom:5px;color:#344054;font-size:13px}input,select{width:100%;min-height:34px;padding:7px 9px;border:1px solid #c9d1dc;border-radius:4px;font:inherit}button{min-height:34px;padding:7px 12px;border:1px solid var(--primary);border-radius:4px;background:var(--primary);color:#fff;cursor:pointer}button.secondary{border-color:#b6c2d1;background:#fff;color:var(--text)}pre{padding:10px;border:1px solid var(--line);border-radius:6px;background:#fbfcfd;overflow:auto;min-height:150px}.message{min-height:24px;margin-top:10px;color:var(--muted)}.ok{color:var(--ok)}.fail{color:var(--danger)}@media(max-width:900px){.form{grid-template-columns:1fr}}</style></head>
<body><header><h1>H-C-08 返回订单成交状态</h1></header><main>
<section class="panel"><h2>回传源</h2><div class="form"><div><label>账户</label><input id="account" value="master_account"></div><div><label>Connector</label><input id="connector" value="binance_perpetual"></div><div><label>交易对</label><input id="pair" value="BTC-USDT"></div><div><label>事件</label><select id="eventType"><option value="orders">订单状态</option><option value="trades">成交状态</option></select></div><div><button id="loadBtn">生成状态</button></div></div></section>
<section class="panel"><h2>回调</h2><div class="form"><div style="grid-column:span 4"><label>Callback URL</label><input id="callbackUrl" value="http://127.0.0.1:8000/order-status-callback"></div><div><button id="sendBtn">发送回调</button></div></div><div id="message" class="message"></div></section>
<section class="panel"><h2>Payload</h2><pre id="payloadView">-</pre></section>
<section class="panel"><h2>结果</h2><pre id="resultView">-</pre></section>
<script>
const e=Object.fromEntries(["account","connector","pair","eventType","callbackUrl","message","payloadView","resultView"].map(id=>[id,document.getElementById(id)]));const api=cfg();let payload={};function cfg(){const d={baseUrl:"http://127.0.0.1:8000",username:"admin",password:"admin",mode:"auto"};try{return{...d,...JSON.parse(localStorage.getItem("chuanBackendConfig")||"{}")}}catch(_){return d}}function headers(){return{"Authorization":`Basic ${btoa(`${api.username}:${api.password}`)}`,"Content-Type":"application/json"}}async function apiFetch(p,o={}){const r=await fetch(`${api.baseUrl.replace(/\/$/,"")}${p}`,{...o,headers:{...headers(),...(o.headers||{})}});if(!r.ok){let d=r.statusText;try{const b=await r.json();d=b.detail||b.message||JSON.stringify(b)}catch(_){}throw new Error(d)}return r.json()}function list(v){return String(v||"").split(",").map(x=>x.trim()).filter(Boolean)}function filterBody(){return{account_names:list(e.account.value),connector_names:list(e.connector.value),trading_pairs:list(e.pair.value.toUpperCase()),limit:50}}async function load(){if(api.mode==="demo"){payload={event:e.eventType.value,source:"hummingbot-api",items:[{id:"demo-001",status:"FILLED",trading_pair:e.pair.value,filled_amount:"0.01"}],generated_at:new Date().toISOString()};render();return}try{const path=e.eventType.value==="orders"?"/trading/orders/search":"/trading/trades";const res=await apiFetch(path,{method:"POST",body:JSON.stringify(filterBody())});payload={event:e.eventType.value,source:"hummingbot-api",items:res.data||[],pagination:res.pagination||{},generated_at:new Date().toISOString()};render();e.message.textContent="已生成。";e.message.className="message ok"}catch(err){e.message.textContent=`生成失败：${err.message}`;e.message.className="message fail"}}async function send(){try{const r=await fetch(e.callbackUrl.value,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload)});let data=await r.text();try{data=JSON.parse(data)}catch(_){}e.resultView.textContent=JSON.stringify({status:r.status,response:data},null,2);e.message.textContent="已发送。";e.message.className="message ok"}catch(err){e.message.textContent=`发送失败：${err.message}`;e.message.className="message fail"}}function render(){e.payloadView.textContent=JSON.stringify(payload,null,2)}document.getElementById("loadBtn").addEventListener("click",load);document.getElementById("sendBtn").addEventListener("click",send);load();
</script></main></body></html>
