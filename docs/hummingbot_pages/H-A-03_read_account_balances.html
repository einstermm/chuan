<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>H-A-03 读取账户余额</title>
  <style>
    :root {
      --bg: #f6f7f8;
      --panel: #ffffff;
      --line: #d9dde3;
      --text: #1f2933;
      --muted: #697386;
      --primary: #1f6feb;
      --danger: #c53030;
      --ok: #137333;
      --warn: #8a5a00;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, "Microsoft YaHei", sans-serif;
      font-size: 14px;
      line-height: 1.5;
    }

    header {
      padding: 18px 24px;
      border-bottom: 1px solid var(--line);
      background: var(--panel);
    }

    h1, h2 {
      margin: 0;
      font-weight: 600;
    }

    h1 { font-size: 22px; }

    h2 {
      margin-bottom: 12px;
      font-size: 17px;
    }

    main {
      max-width: 1180px;
      margin: 0 auto;
      padding: 18px 18px 40px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(12, 1fr);
      gap: 14px;
      margin-bottom: 14px;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 14px;
    }

    .span-12 { grid-column: span 12; }

    .summary {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }

    .metric {
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 10px;
      background: #fbfcfd;
    }

    .metric-label {
      color: var(--muted);
      font-size: 12px;
    }

    .metric-value {
      margin-top: 4px;
      font-size: 18px;
      font-weight: 600;
    }

    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
    }

    .section-header h2 { margin-bottom: 0; }

    .toolbar {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr auto;
      gap: 10px;
      align-items: end;
      margin-bottom: 12px;
    }

    label {
      display: block;
      margin-bottom: 5px;
      color: #344054;
      font-size: 13px;
    }

    input, select {
      width: 100%;
      min-height: 34px;
      padding: 7px 9px;
      border: 1px solid #c9d1dc;
      border-radius: 4px;
      background: #fff;
      color: var(--text);
      font: inherit;
    }

    .check-row {
      display: flex;
      align-items: center;
      gap: 6px;
      min-height: 34px;
    }

    .check-row input {
      width: auto;
      min-height: auto;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    button {
      min-height: 34px;
      padding: 7px 12px;
      border: 1px solid #b6c2d1;
      border-radius: 4px;
      background: #fff;
      color: var(--text);
      cursor: pointer;
      font: inherit;
    }

    button.primary {
      border-color: var(--primary);
      background: var(--primary);
      color: #fff;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: #fff;
    }

    th, td {
      padding: 9px 8px;
      border-bottom: 1px solid var(--line);
      text-align: left;
      vertical-align: top;
    }

    th {
      background: #f8fafc;
      color: #344054;
      font-weight: 600;
      font-size: 13px;
    }

    .muted { color: var(--muted); }

    .message {
      min-height: 24px;
      margin-top: 10px;
      color: var(--muted);
    }

    .message.ok { color: var(--ok); }
    .message.fail { color: var(--danger); }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 18px;
      background: rgba(17, 24, 39, 0.42);
    }

    .modal-backdrop.open { display: flex; }

    .modal {
      width: min(820px, 100%);
      max-height: calc(100vh - 36px);
      overflow: auto;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 14px;
      box-shadow: 0 18px 44px rgba(15, 23, 42, 0.22);
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
    }

    .modal-header h2 { margin-bottom: 0; }

    .modal-close {
      min-width: 34px;
      padding: 4px 9px;
    }

    @media (max-width: 900px) {
      .summary, .toolbar {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>H-A-03 读取账户余额</h1>
  </header>

  <main>
    <section class="grid">
      <div class="panel span-12">
        <h2>余额概览</h2>
        <div class="summary">
          <div class="metric">
            <div class="metric-label">总价值</div>
            <div class="metric-value" id="totalValue">0.00</div>
          </div>
          <div class="metric">
            <div class="metric-label">账户数</div>
            <div class="metric-value" id="accountCount">0</div>
          </div>
          <div class="metric">
            <div class="metric-label">Connector 数</div>
            <div class="metric-value" id="connectorCount">0</div>
          </div>
          <div class="metric">
            <div class="metric-label">Token 数</div>
            <div class="metric-value" id="tokenCount">0</div>
          </div>
        </div>
      </div>
    </section>

    <section class="grid">
      <div class="panel span-12">
        <div class="section-header">
          <h2>余额明细</h2>
          <div class="actions">
            <button id="accountDistributionBtn">账户分布</button>
            <button id="tokenDistributionBtn">Token 分布</button>
          </div>
        </div>

        <div class="toolbar">
          <div>
            <label for="accountFilter">账户</label>
            <select id="accountFilter"></select>
          </div>
          <div>
            <label for="connectorFilter">Connector</label>
            <select id="connectorFilter"></select>
          </div>
          <div>
            <label for="tokenSearch">Token</label>
            <input id="tokenSearch" placeholder="USDT / BTC / ETH">
          </div>
          <div class="check-row">
            <input id="refreshCheckbox" type="checkbox">
            <label for="refreshCheckbox" style="margin:0;">刷新余额</label>
          </div>
        </div>

        <table>
          <thead>
            <tr>
              <th>账户</th>
              <th>Connector</th>
              <th>Token</th>
              <th>总数量</th>
              <th>可用数量</th>
              <th>价格</th>
              <th>价值</th>
            </tr>
          </thead>
          <tbody id="balancesTable">
            <tr><td colspan="7" class="muted">等待加载。</td></tr>
          </tbody>
        </table>
        <div id="message" class="message"></div>
      </div>
    </section>
  </main>

  <div class="modal-backdrop" id="distributionModal">
    <div class="modal">
      <div class="modal-header">
        <h2 id="distributionTitle">分布</h2>
        <button class="modal-close" data-close-modal="distributionModal">×</button>
      </div>
      <table>
        <thead id="distributionHead"></thead>
        <tbody id="distributionBody"></tbody>
      </table>
      <div id="distributionMessage" class="message"></div>
    </div>
  </div>

  <script>
    const demoState = {
      master_account: {
        binance_perpetual: [
          { token: "USDT", units: 1200, available_units: 1180, price: 1, value: 1200 },
          { token: "BTC", units: 0.025, available_units: 0.02, price: 65000, value: 1625 }
        ]
      },
      paper_account: {
        binance: [
          { token: "ETH", units: 1.5, available_units: 1.5, price: 3200, value: 4800 },
          { token: "USDT", units: 500, available_units: 500, price: 1, value: 500 }
        ],
        okx: [
          { token: "SOL", units: 30, available_units: 30, price: 145, value: 4350 }
        ]
      }
    };

    const state = {
      portfolioState: {},
      accounts: [],
      connectors: [],
      rows: [],
      apiAvailable: false,
      apiConfig: loadApiConfig()
    };

    const els = {
      totalValue: document.getElementById("totalValue"),
      accountCount: document.getElementById("accountCount"),
      connectorCount: document.getElementById("connectorCount"),
      tokenCount: document.getElementById("tokenCount"),
      accountFilter: document.getElementById("accountFilter"),
      connectorFilter: document.getElementById("connectorFilter"),
      tokenSearch: document.getElementById("tokenSearch"),
      refreshCheckbox: document.getElementById("refreshCheckbox"),
      balancesTable: document.getElementById("balancesTable"),
      message: document.getElementById("message"),
      distributionTitle: document.getElementById("distributionTitle"),
      distributionHead: document.getElementById("distributionHead"),
      distributionBody: document.getElementById("distributionBody"),
      distributionMessage: document.getElementById("distributionMessage")
    };

    function loadApiConfig() {
      const defaults = {
        baseUrl: "http://127.0.0.1:8000",
        username: "admin",
        password: "admin",
        mode: "auto"
      };
      try {
        return { ...defaults, ...JSON.parse(localStorage.getItem("chuanBackendConfig") || "{}") };
      } catch (_) {
        return defaults;
      }
    }

    function authHeaders() {
      return {
        "Authorization": `Basic ${btoa(`${state.apiConfig.username}:${state.apiConfig.password}`)}`,
        "Content-Type": "application/json"
      };
    }

    async function apiFetch(path, options = {}) {
      const base = state.apiConfig.baseUrl.replace(/\/$/, "");
      const response = await fetch(`${base}${path}`, {
        ...options,
        headers: { ...authHeaders(), ...(options.headers || {}) }
      });
      if (!response.ok) {
        let detail = response.statusText;
        try {
          const body = await response.json();
          detail = body.detail || body.message || JSON.stringify(body);
        } catch (_) {}
        throw new Error(detail);
      }
      return response.json();
    }

    function setMessage(element, text, type = "") {
      element.className = `message ${type}`;
      element.textContent = text;
    }

    async function loadInitialOptions() {
      state.apiConfig = loadApiConfig();
      if (state.apiConfig.mode === "demo") {
        state.portfolioState = demoState;
        state.apiAvailable = false;
        syncOptionsFromState();
        render();
        return;
      }

      try {
        const accounts = await apiFetch("/accounts/");
        const credentialEntries = await Promise.all(
          accounts.map(async account => {
            const credentials = await apiFetch(`/accounts/${encodeURIComponent(account)}/credentials`);
            return [account, credentials];
          })
        );
        state.accounts = sortAccounts(accounts);
        state.connectors = [...new Set(Object.values(Object.fromEntries(credentialEntries)).flat())].sort();
        state.apiAvailable = true;
        fillSelects();
        await loadBalances(false);
      } catch (error) {
        if (state.apiConfig.mode === "api") {
          setMessage(els.message, `读取失败：${error.message}`, "fail");
          fillSelects();
        } else {
          state.portfolioState = demoState;
          state.apiAvailable = false;
          syncOptionsFromState();
          render();
        }
      }
    }

    async function loadBalances(skipGateway = false) {
      if (!state.apiAvailable) {
        state.portfolioState = demoState;
        syncOptionsFromState();
        render();
        return;
      }

      const account = els.accountFilter.value;
      const connector = els.connectorFilter.value;
      const payload = {
        account_names: account ? [account] : null,
        connector_names: connector ? [connector] : null,
        skip_gateway: skipGateway,
        refresh: els.refreshCheckbox.checked
      };

      try {
        setMessage(els.message, "读取中...");
        state.portfolioState = await apiFetch("/portfolio/state", {
          method: "POST",
          body: JSON.stringify(payload)
        });
        syncOptionsFromState();
        render();
        setMessage(els.message, "已读取。", "ok");
      } catch (error) {
        setMessage(els.message, `读取失败：${error.message}`, "fail");
      }
    }

    function sortAccounts(accounts) {
      const copy = [...accounts];
      copy.sort((a, b) => {
        if (a === "master_account") return -1;
        if (b === "master_account") return 1;
        return a.localeCompare(b);
      });
      return copy;
    }

    function syncOptionsFromState() {
      state.accounts = sortAccounts(Object.keys(state.portfolioState));
      const connectors = new Set();
      state.accounts.forEach(account => {
        Object.keys(state.portfolioState[account] || {}).forEach(connector => connectors.add(connector));
      });
      state.connectors = [...connectors].sort();
      fillSelects();
    }

    function fillSelects() {
      fillSelect(els.accountFilter, state.accounts);
      fillSelect(els.connectorFilter, state.connectors);
    }

    function fillSelect(select, values) {
      const current = select.value;
      select.innerHTML = `<option value="">全部</option>` + values.map(value => `<option value="${escapeHtml(value)}">${escapeHtml(value)}</option>`).join("");
      if (values.includes(current)) select.value = current;
    }

    function flattenState() {
      const rows = [];
      Object.entries(state.portfolioState || {}).forEach(([account, connectors]) => {
        Object.entries(connectors || {}).forEach(([connector, tokens]) => {
          (tokens || []).forEach(tokenInfo => {
            rows.push({
              account,
              connector,
              token: tokenInfo.token || "",
              units: Number(tokenInfo.units || 0),
              available_units: Number(tokenInfo.available_units || 0),
              price: Number(tokenInfo.price || 0),
              value: Number(tokenInfo.value || 0)
            });
          });
        });
      });
      return rows;
    }

    function filteredRows() {
      const account = els.accountFilter.value;
      const connector = els.connectorFilter.value;
      const token = els.tokenSearch.value.trim().toLowerCase();
      return state.rows.filter(row => {
        if (account && row.account !== account) return false;
        if (connector && row.connector !== connector) return false;
        if (token && !row.token.toLowerCase().includes(token)) return false;
        return true;
      });
    }

    function render() {
      state.rows = flattenState();
      renderSummary();
      renderTable();
    }

    function renderSummary() {
      const rows = filteredRows();
      const accounts = new Set(rows.map(row => row.account));
      const connectors = new Set(rows.map(row => row.connector));
      const tokens = new Set(rows.map(row => row.token));
      const total = rows.reduce((sum, row) => sum + row.value, 0);
      els.totalValue.textContent = formatNumber(total);
      els.accountCount.textContent = accounts.size;
      els.connectorCount.textContent = connectors.size;
      els.tokenCount.textContent = tokens.size;
    }

    function renderTable() {
      const rows = filteredRows().sort((a, b) => b.value - a.value);
      if (!rows.length) {
        els.balancesTable.innerHTML = `<tr><td colspan="7" class="muted">暂无余额。</td></tr>`;
        return;
      }

      els.balancesTable.innerHTML = rows.map(row => `
        <tr>
          <td>${escapeHtml(row.account)}</td>
          <td>${escapeHtml(row.connector)}</td>
          <td><strong>${escapeHtml(row.token)}</strong></td>
          <td>${formatNumber(row.units)}</td>
          <td>${formatNumber(row.available_units)}</td>
          <td>${formatNumber(row.price)}</td>
          <td>${formatNumber(row.value)}</td>
        </tr>
      `).join("");
    }

    async function showAccountDistribution() {
      if (state.apiAvailable) {
        try {
          const data = await apiFetch("/portfolio/accounts-distribution");
          renderAccountDistribution(data.distribution || []);
          openModal("distributionModal");
          return;
        } catch (error) {
          setMessage(els.distributionMessage, `读取失败：${error.message}`, "fail");
        }
      }

      const grouped = {};
      state.rows.forEach(row => {
        if (!grouped[row.account]) grouped[row.account] = 0;
        grouped[row.account] += row.value;
      });
      const total = Object.values(grouped).reduce((sum, value) => sum + value, 0);
      renderAccountDistribution(Object.entries(grouped).map(([account, value]) => ({
        account,
        total_value: value,
        percentage: total > 0 ? value / total * 100 : 0
      })));
      openModal("distributionModal");
    }

    async function showTokenDistribution() {
      const account = els.accountFilter.value;
      const connector = els.connectorFilter.value;
      if (state.apiAvailable) {
        try {
          const data = await apiFetch("/portfolio/distribution", {
            method: "POST",
            body: JSON.stringify({
              account_names: account ? [account] : null,
              connector_names: connector ? [connector] : null
            })
          });
          renderTokenDistribution(data.distribution || []);
          openModal("distributionModal");
          return;
        } catch (error) {
          setMessage(els.distributionMessage, `读取失败：${error.message}`, "fail");
        }
      }

      const grouped = {};
      filteredRows().forEach(row => {
        if (!grouped[row.token]) grouped[row.token] = { value: 0, units: 0 };
        grouped[row.token].value += row.value;
        grouped[row.token].units += row.units;
      });
      const total = Object.values(grouped).reduce((sum, item) => sum + item.value, 0);
      renderTokenDistribution(Object.entries(grouped).map(([token, item]) => ({
        token,
        total_value: item.value,
        total_units: item.units,
        percentage: total > 0 ? item.value / total * 100 : 0
      })));
      openModal("distributionModal");
    }

    function renderAccountDistribution(rows) {
      els.distributionTitle.textContent = "账户分布";
      els.distributionHead.innerHTML = `<tr><th>账户</th><th>价值</th><th>占比</th></tr>`;
      els.distributionBody.innerHTML = rows.length
        ? rows.map(row => `<tr><td>${escapeHtml(row.account)}</td><td>${formatNumber(row.total_value)}</td><td>${formatPercent(row.percentage)}</td></tr>`).join("")
        : `<tr><td colspan="3" class="muted">暂无数据。</td></tr>`;
      setMessage(els.distributionMessage, "");
    }

    function renderTokenDistribution(rows) {
      els.distributionTitle.textContent = "Token 分布";
      els.distributionHead.innerHTML = `<tr><th>Token</th><th>数量</th><th>价值</th><th>占比</th></tr>`;
      els.distributionBody.innerHTML = rows.length
        ? rows.map(row => `<tr><td>${escapeHtml(row.token)}</td><td>${formatNumber(row.total_units)}</td><td>${formatNumber(row.total_value)}</td><td>${formatPercent(row.percentage)}</td></tr>`).join("")
        : `<tr><td colspan="4" class="muted">暂无数据。</td></tr>`;
      setMessage(els.distributionMessage, "");
    }

    function openModal(id) {
      const modal = document.getElementById(id);
      if (modal) modal.classList.add("open");
    }

    function closeModal(id) {
      const modal = document.getElementById(id);
      if (modal) modal.classList.remove("open");
    }

    function formatNumber(value) {
      return Number(value || 0).toLocaleString("en-US", { maximumFractionDigits: 8 });
    }

    function formatPercent(value) {
      return `${Number(value || 0).toFixed(2)}%`;
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    document.getElementById("accountDistributionBtn").addEventListener("click", showAccountDistribution);
    document.getElementById("tokenDistributionBtn").addEventListener("click", showTokenDistribution);
    els.accountFilter.addEventListener("change", render);
    els.connectorFilter.addEventListener("change", render);
    els.tokenSearch.addEventListener("input", render);

    document.querySelectorAll("[data-close-modal]").forEach(button => {
      button.addEventListener("click", () => closeModal(button.dataset.closeModal));
    });

    document.querySelectorAll(".modal-backdrop").forEach(backdrop => {
      backdrop.addEventListener("click", event => {
        if (event.target === backdrop) closeModal(backdrop.id);
      });
    });

    loadInitialOptions();
  </script>
</body>
</html>
