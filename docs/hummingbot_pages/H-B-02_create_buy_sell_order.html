<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>H-B-02 创建买入/卖出订单</title>
  <style>:root{--bg:#f6f7f8;--panel:#fff;--line:#d9dde3;--text:#1f2933;--muted:#697386;--primary:#1f6feb;--danger:#c53030;--ok:#137333;}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,"Microsoft YaHei",sans-serif;font-size:14px}header{padding:18px 24px;border-bottom:1px solid var(--line);background:var(--panel)}h1,h2{margin:0;font-weight:600}h1{font-size:22px}h2{font-size:17px;margin-bottom:12px}main{max-width:1000px;margin:0 auto;padding:18px}.panel{background:#fff;border:1px solid var(--line);border-radius:6px;padding:14px;margin-bottom:14px}.form{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}label{display:block;margin-bottom:5px;color:#344054;font-size:13px}input,select{width:100%;min-height:34px;padding:7px 9px;border:1px solid #c9d1dc;border-radius:4px;font:inherit}.actions{display:flex;gap:8px;margin-top:12px}button{min-height:34px;padding:7px 12px;border:1px solid #b6c2d1;border-radius:4px;background:#fff;cursor:pointer;font:inherit}button.primary{border-color:var(--primary);background:var(--primary);color:#fff}.message{min-height:24px;margin-top:10px;color:var(--muted)}.ok{color:var(--ok)}.fail{color:var(--danger)}pre{padding:10px;border:1px solid var(--line);border-radius:6px;background:#fbfcfd;overflow:auto}@media(max-width:900px){.form{grid-template-columns:1fr}}</style>
</head>
<body><header><h1>H-B-02 创建买入/卖出订单</h1></header><main>
  <div class="panel"><h2>订单表单</h2><div class="form">
    <div><label>账户</label><select id="account"></select></div><div><label>Connector</label><select id="connector"></select></div><div><label>交易对</label><input id="pair" value="BTC-USDT"></div>
    <div><label>方向</label><select id="side"><option>BUY</option><option>SELL</option></select></div><div><label>订单类型</label><select id="orderType"><option>LIMIT</option><option>MARKET</option><option>LIMIT_MAKER</option></select></div><div><label>数量</label><input id="amount" value="0.01"></div>
    <div><label>价格</label><input id="price" value="65000"></div><div><label>Position Action</label><select id="positionAction"><option>OPEN</option><option>CLOSE</option></select></div><div><label>提交模式</label><select id="submitMode"><option value="dry">dry_run</option><option value="live">live</option></select></div>
  </div><div class="actions"><button class="primary" id="submitBtn">提交订单</button><button id="previewBtn">预览</button></div><div id="message" class="message"></div></div>
  <div class="panel"><h2>请求 / 响应</h2><pre id="view">-</pre></div>
  <script>
    const ids=["account","connector","pair","side","orderType","amount","price","positionAction","submitMode","message","view"];const e=Object.fromEntries(ids.map(id=>[id,document.getElementById(id)]));let api=loadApiConfig(),available=false;
    function loadApiConfig(){const d={baseUrl:"http://127.0.0.1:8000",username:"admin",password:"admin",mode:"auto"};try{return{...d,...JSON.parse(localStorage.getItem("chuanBackendConfig")||"{}")};}catch(_){return d;}}
    function headers(){return{"Authorization":`Basic ${btoa(`${api.username}:${api.password}`)}`,"Content-Type":"application/json"};} async function apiFetch(p,o={}){const r=await fetch(`${api.baseUrl.replace(/\/$/,"")}${p}`,{...o,headers:{...headers(),...(o.headers||{})}});if(!r.ok){let d=r.statusText;try{const b=await r.json();d=b.detail||b.message||JSON.stringify(b)}catch(_){}throw new Error(d)}return r.json()}
    function msg(t,c=""){e.message.className=`message ${c}`;e.message.textContent=t} function payload(){return{account_name:e.account.value,connector_name:e.connector.value,trading_pair:e.pair.value.trim().toUpperCase(),trade_type:e.side.value,amount:e.amount.value,order_type:e.orderType.value,price:e.orderType.value==="MARKET"?null:e.price.value,position_action:e.positionAction.value};}
    async function init(){try{const accounts=await apiFetch("/accounts/");e.account.innerHTML=accounts.map(x=>`<option>${x}</option>`).join("");const creds=await apiFetch(`/accounts/${e.account.value}/credentials`);e.connector.innerHTML=creds.map(x=>`<option>${x}</option>`).join("");available=true;}catch(_){e.account.innerHTML="<option>master_account</option>";e.connector.innerHTML="<option>binance_perpetual</option>";available=false;}preview();}
    async function reloadCreds(){if(!available)return;const creds=await apiFetch(`/accounts/${e.account.value}/credentials`);e.connector.innerHTML=creds.map(x=>`<option>${x}</option>`).join("");}
    function preview(){e.view.textContent=JSON.stringify(payload(),null,2);msg("已预览。","ok");}
    async function submit(){const body=payload();if(e.submitMode.value==="dry"||!available){e.view.textContent=JSON.stringify({dry_run:true,request:body},null,2);msg("dry_run 完成。","ok");return;}try{const r=await apiFetch("/trading/orders",{method:"POST",body:JSON.stringify(body)});e.view.textContent=JSON.stringify(r,null,2);msg("订单已提交。","ok");}catch(err){msg(`提交失败：${err.message}`,"fail");}}
    e.account.addEventListener("change",reloadCreds);document.getElementById("previewBtn").addEventListener("click",preview);document.getElementById("submitBtn").addEventListener("click",submit);init();
  </script>
</main></body></html>
