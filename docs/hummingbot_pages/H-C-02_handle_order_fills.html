<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>H-C-02 处理订单成交</title>
<style>:root{--bg:#f6f7f8;--panel:#fff;--line:#d9dde3;--text:#1f2933;--muted:#697386;--primary:#1f6feb;--danger:#c53030;--ok:#137333}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,"Microsoft YaHei",sans-serif;font-size:14px;line-height:1.5}header{padding:18px 24px;border-bottom:1px solid var(--line);background:#fff}h1,h2{margin:0;font-weight:600}h1{font-size:22px}h2{font-size:17px;margin-bottom:12px}main{max-width:1180px;margin:0 auto;padding:18px}.panel{background:#fff;border:1px solid var(--line);border-radius:6px;padding:14px;margin-bottom:14px}.form{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;align-items:end}label{display:block;margin-bottom:5px;color:#344054;font-size:13px}input,select{width:100%;min-height:34px;padding:7px 9px;border:1px solid #c9d1dc;border-radius:4px;font:inherit}button{min-height:34px;padding:7px 12px;border:1px solid var(--primary);border-radius:4px;background:var(--primary);color:#fff;cursor:pointer}table{width:100%;border-collapse:collapse}th,td{padding:8px;border-bottom:1px solid var(--line);text-align:left}th{background:#f8fafc;color:#344054;font-size:13px}.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.metric{border:1px solid var(--line);border-radius:6px;padding:10px;background:#fbfcfd}.metric-label{font-size:12px;color:var(--muted)}.metric-value{font-size:18px;font-weight:600}.message{min-height:24px;margin-top:10px;color:var(--muted)}.ok{color:var(--ok)}.fail{color:var(--danger)}@media(max-width:900px){.form,.summary{grid-template-columns:1fr}}</style></head>
<body><header><h1>H-C-02 处理订单成交</h1></header><main>
<section class="panel"><h2>成交汇总</h2><div class="summary"><div class="metric"><div class="metric-label">成交笔数</div><div class="metric-value" id="fillCount">0</div></div><div class="metric"><div class="metric-label">买入数量</div><div class="metric-value" id="buyAmount">0</div></div><div class="metric"><div class="metric-label">卖出数量</div><div class="metric-value" id="sellAmount">0</div></div><div class="metric"><div class="metric-label">手续费</div><div class="metric-value" id="fees">0</div></div></div></section>
<section class="panel"><h2>查询</h2><div class="form"><div><label>账户</label><input id="account" value="master_account"></div><div><label>Connector</label><input id="connector" value="binance_perpetual"></div><div><label>交易对</label><input id="pair" value="BTC-USDT"></div><div><label>方向</label><select id="side"><option value="">全部</option><option>BUY</option><option>SELL</option></select></div><div><label>Limit</label><input id="limit" value="100"></div><div><button id="loadBtn">查询成交</button></div></div><div id="message" class="message"></div></section>
<section class="panel"><h2>成交</h2><table><thead><tr><th>Trade ID</th><th>Order ID</th><th>交易对</th><th>方向</th><th>数量</th><th>价格</th><th>手续费</th><th>时间</th></tr></thead><tbody id="rows"><tr><td colspan="8">-</td></tr></tbody></table></section>
<script>
const e=Object.fromEntries(["account","connector","pair","side","limit","message","rows","fillCount","buyAmount","sellAmount","fees"].map(id=>[id,document.getElementById(id)]));const api=cfg();function cfg(){const d={baseUrl:"http://127.0.0.1:8000",username:"admin",password:"admin",mode:"auto"};try{return{...d,...JSON.parse(localStorage.getItem("chuanBackendConfig")||"{}")}}catch(_){return d}}function headers(){return{"Authorization":`Basic ${btoa(`${api.username}:${api.password}`)}`,"Content-Type":"application/json"}}async function apiFetch(p,o={}){const r=await fetch(`${api.baseUrl.replace(/\/$/,"")}${p}`,{...o,headers:{...headers(),...(o.headers||{})}});if(!r.ok){let d=r.statusText;try{const b=await r.json();d=b.detail||b.message||JSON.stringify(b)}catch(_){}throw new Error(d)}return r.json()}function list(v){return String(v||"").split(",").map(x=>x.trim()).filter(Boolean)}function body(){const b={account_names:list(e.account.value),connector_names:list(e.connector.value),trading_pairs:list(e.pair.value.toUpperCase()),limit:Number(e.limit.value)||100};if(e.side.value)b.trade_types=[e.side.value];return b}async function load(){if(api.mode==="demo"){render([{trade_id:"demo-fill",order_id:"demo-001",trading_pair:"BTC-USDT",trade_type:"BUY",amount:"0.01",price:"65000",fee:"0.02",timestamp:"-"}]);return}try{const res=await apiFetch("/trading/trades",{method:"POST",body:JSON.stringify(body())});render(res.data||[]);e.message.textContent="已查询。";e.message.className="message ok"}catch(err){e.message.textContent=`查询失败：${err.message}`;e.message.className="message fail"}}function render(rows){let buy=0,sell=0,fees=0;rows.forEach(r=>{const a=Number(r.amount||0);if((r.trade_type||"").toUpperCase()==="BUY")buy+=a;if((r.trade_type||"").toUpperCase()==="SELL")sell+=a;fees+=Number(r.fee||r.fee_paid||0)});e.fillCount.textContent=rows.length;e.buyAmount.textContent=fmt(buy);e.sellAmount.textContent=fmt(sell);e.fees.textContent=fmt(fees);e.rows.innerHTML=rows.length?rows.map(r=>`<tr><td>${h(r.trade_id)}</td><td>${h(r.order_id)}</td><td>${h(r.trading_pair)}</td><td>${h(r.trade_type)}</td><td>${h(r.amount)}</td><td>${h(r.price)}</td><td>${h(r.fee||r.fee_paid||0)}</td><td>${h(r.timestamp)}</td></tr>`).join(""):`<tr><td colspan="8">暂无成交。</td></tr>`}function fmt(n){return Number.isFinite(n)?Number(n.toFixed(8)).toString():"0"}function h(v){return String(v??"-").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;")}document.getElementById("loadBtn").addEventListener("click",load);load();
</script></main></body></html>
