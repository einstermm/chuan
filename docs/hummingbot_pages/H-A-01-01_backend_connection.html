<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>H-A-01-01 后端连接</title>
  <style>
    :root {
      --bg: #f6f7f8;
      --panel: #ffffff;
      --line: #d9dde3;
      --text: #1f2933;
      --muted: #697386;
      --primary: #1f6feb;
      --danger: #c53030;
      --ok: #137333;
      --warn: #8a5a00;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, "Microsoft YaHei", sans-serif;
      font-size: 14px;
      line-height: 1.5;
    }

    header {
      padding: 18px 24px;
      border-bottom: 1px solid var(--line);
      background: var(--panel);
    }

    h1, h2 {
      margin: 0;
      font-weight: 600;
    }

    h1 {
      font-size: 22px;
    }

    h2 {
      margin-bottom: 12px;
      font-size: 17px;
    }

    main {
      max-width: 920px;
      margin: 0 auto;
      padding: 18px 18px 40px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(12, 1fr);
      gap: 14px;
      margin-bottom: 14px;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 14px;
    }

    .span-12 { grid-column: span 12; }
    .span-6 { grid-column: span 6; }

    .summary {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }

    .metric {
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 10px;
      background: #fbfcfd;
    }

    .metric-label {
      color: var(--muted);
      font-size: 12px;
    }

    .metric-value {
      margin-top: 4px;
      font-size: 18px;
      font-weight: 600;
    }

    label {
      display: block;
      margin-bottom: 5px;
      color: #344054;
      font-size: 13px;
    }

    input, select {
      width: 100%;
      min-height: 34px;
      padding: 7px 9px;
      border: 1px solid #c9d1dc;
      border-radius: 4px;
      background: #fff;
      color: var(--text);
      font: inherit;
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 10px;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 10px;
    }

    button {
      min-height: 34px;
      padding: 7px 12px;
      border: 1px solid #b6c2d1;
      border-radius: 4px;
      background: #fff;
      color: var(--text);
      cursor: pointer;
      font: inherit;
    }

    button.primary {
      border-color: var(--primary);
      background: var(--primary);
      color: #fff;
    }

    .message {
      min-height: 24px;
      margin-top: 10px;
      color: var(--muted);
    }

    .message.ok {
      color: var(--ok);
    }

    .message.fail {
      color: var(--danger);
    }

    @media (max-width: 760px) {
      .span-6 {
        grid-column: span 12;
      }

      .summary, .form-row {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>H-A-01-01 后端连接</h1>
  </header>

  <main>
    <section class="grid">
      <div class="panel span-12">
        <h2>连接配置</h2>
        <div class="form-row">
          <div>
            <label for="apiBase">Hummingbot API 地址</label>
            <input id="apiBase" autocomplete="off">
          </div>
          <div>
            <label for="modeSelect">数据模式</label>
            <select id="modeSelect">
              <option value="auto">自动</option>
              <option value="api">真实 API</option>
              <option value="demo">示例数据</option>
            </select>
          </div>
        </div>
        <div class="form-row">
          <div>
            <label for="apiUser">Basic Auth 用户名</label>
            <input id="apiUser" autocomplete="username">
          </div>
          <div>
            <label for="apiPassword">Basic Auth 密码</label>
            <input id="apiPassword" type="password" autocomplete="current-password">
          </div>
        </div>
        <div class="actions">
          <button class="primary" id="saveBtn">保存</button>
          <button id="testBtn">测试连接</button>
          <button id="resetBtn">重置</button>
        </div>
        <div id="message" class="message"></div>
      </div>
    </section>

    <section class="grid">
      <div class="panel span-12">
        <h2>连接状态</h2>
        <div class="summary">
          <div class="metric">
            <div class="metric-label">状态</div>
            <div class="metric-value" id="statusValue">未知</div>
          </div>
          <div class="metric">
            <div class="metric-label">账户数</div>
            <div class="metric-value" id="accountCount">-</div>
          </div>
          <div class="metric">
            <div class="metric-label">Connector 数</div>
            <div class="metric-value" id="connectorCount">-</div>
          </div>
          <div class="metric">
            <div class="metric-label">最近测试</div>
            <div class="metric-value" id="lastTest">-</div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <script>
    const storageKey = "chuanBackendConfig";
    const defaults = {
      baseUrl: "http://127.0.0.1:8000",
      username: "admin",
      password: "admin",
      mode: "auto"
    };

    const els = {
      apiBase: document.getElementById("apiBase"),
      apiUser: document.getElementById("apiUser"),
      apiPassword: document.getElementById("apiPassword"),
      modeSelect: document.getElementById("modeSelect"),
      message: document.getElementById("message"),
      statusValue: document.getElementById("statusValue"),
      accountCount: document.getElementById("accountCount"),
      connectorCount: document.getElementById("connectorCount"),
      lastTest: document.getElementById("lastTest")
    };

    function loadConfig() {
      try {
        return { ...defaults, ...JSON.parse(localStorage.getItem(storageKey) || "{}") };
      } catch (_) {
        return { ...defaults };
      }
    }

    function readForm() {
      return {
        baseUrl: els.apiBase.value.trim() || defaults.baseUrl,
        username: els.apiUser.value.trim() || defaults.username,
        password: els.apiPassword.value,
        mode: els.modeSelect.value
      };
    }

    function writeForm(config) {
      els.apiBase.value = config.baseUrl;
      els.apiUser.value = config.username;
      els.apiPassword.value = config.password;
      els.modeSelect.value = config.mode;
    }

    function saveConfig() {
      const config = readForm();
      localStorage.setItem(storageKey, JSON.stringify(config));
      setMessage("已保存。", "ok");
    }

    function authHeaders(config) {
      return {
        "Authorization": `Basic ${btoa(`${config.username}:${config.password}`)}`,
        "Content-Type": "application/json"
      };
    }

    async function apiFetch(config, path) {
      const base = config.baseUrl.replace(/\/$/, "");
      const response = await fetch(`${base}${path}`, { headers: authHeaders(config) });
      if (!response.ok) {
        let detail = response.statusText;
        try {
          const body = await response.json();
          detail = body.detail || body.message || JSON.stringify(body);
        } catch (_) {}
        throw new Error(detail);
      }
      return response.json();
    }

    async function testConnection() {
      const config = readForm();
      saveConfig();

      if (config.mode === "demo") {
        els.statusValue.textContent = "示例";
        els.accountCount.textContent = "3";
        els.connectorCount.textContent = "4";
        els.lastTest.textContent = new Date().toLocaleTimeString();
        setMessage("示例数据。", "ok");
        return;
      }

      setMessage("测试中...");
      try {
        const [accounts, connectors] = await Promise.all([
          apiFetch(config, "/accounts/"),
          apiFetch(config, "/connectors/")
        ]);
        els.statusValue.textContent = "已连接";
        els.accountCount.textContent = accounts.length;
        els.connectorCount.textContent = connectors.length;
        els.lastTest.textContent = new Date().toLocaleTimeString();
        setMessage("连接成功。", "ok");
      } catch (error) {
        els.statusValue.textContent = "失败";
        els.accountCount.textContent = "-";
        els.connectorCount.textContent = "-";
        els.lastTest.textContent = new Date().toLocaleTimeString();
        setMessage(`连接失败：${error.message}`, "fail");
      }
    }

    function resetConfig() {
      writeForm(defaults);
      localStorage.setItem(storageKey, JSON.stringify(defaults));
      els.statusValue.textContent = "未知";
      els.accountCount.textContent = "-";
      els.connectorCount.textContent = "-";
      els.lastTest.textContent = "-";
      setMessage("已重置。", "ok");
    }

    function setMessage(text, type = "") {
      els.message.className = `message ${type}`;
      els.message.textContent = text;
    }

    document.getElementById("saveBtn").addEventListener("click", saveConfig);
    document.getElementById("testBtn").addEventListener("click", testConnection);
    document.getElementById("resetBtn").addEventListener("click", resetConfig);

    writeForm(loadConfig());
  </script>
</body>
</html>
