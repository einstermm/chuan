<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>H-C-05 自动撤单</title>
<style>:root{--bg:#f6f7f8;--panel:#fff;--line:#d9dde3;--text:#1f2933;--muted:#697386;--primary:#1f6feb;--danger:#c53030;--ok:#137333}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,"Microsoft YaHei",sans-serif;font-size:14px;line-height:1.5}header{padding:18px 24px;border-bottom:1px solid var(--line);background:#fff}h1,h2{margin:0;font-weight:600}h1{font-size:22px}h2{font-size:17px;margin-bottom:12px}main{max-width:1180px;margin:0 auto;padding:18px}.panel{background:#fff;border:1px solid var(--line);border-radius:6px;padding:14px;margin-bottom:14px}.form{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;align-items:end}label{display:block;margin-bottom:5px;color:#344054;font-size:13px}input{width:100%;min-height:34px;padding:7px 9px;border:1px solid #c9d1dc;border-radius:4px;font:inherit}button{min-height:34px;padding:7px 12px;border:1px solid var(--primary);border-radius:4px;background:var(--primary);color:#fff;cursor:pointer}button.secondary{border-color:#b6c2d1;background:#fff;color:var(--text)}button.danger{border-color:var(--danger);background:var(--danger);color:#fff}table{width:100%;border-collapse:collapse}th,td{padding:8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}th{background:#f8fafc;color:#344054;font-size:13px}.message{min-height:24px;margin-top:10px;color:var(--muted)}.ok{color:var(--ok)}.fail{color:var(--danger)}.modal{position:fixed;inset:0;background:rgba(15,23,42,.35);display:none;align-items:center;justify-content:center;padding:16px}.modal.open{display:flex}.dialog{width:min(420px,100%);background:#fff;border:1px solid var(--line);border-radius:6px;padding:14px}.dialog-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}@media(max-width:900px){.form{grid-template-columns:1fr}}</style></head>
<body><header><h1>H-C-05 自动撤单</h1></header><main>
<section class="panel"><h2>规则</h2><div class="form"><div><label>账户</label><input id="account" value="master_account"></div><div><label>Connector</label><input id="connector" value="binance_perpetual"></div><div><label>交易对</label><input id="pair" value="BTC-USDT"></div><div><label>超过秒数</label><input id="olderThan" value="300"></div><div><label>Limit</label><input id="limit" value="100"></div><div><button id="loadBtn">扫描订单</button></div></div><div id="message" class="message"></div></section>
<section class="panel"><h2>可撤订单</h2><table><thead><tr><th>订单ID</th><th>交易对</th><th>方向</th><th>数量</th><th>价格</th><th>状态</th><th>时间</th><th>操作</th></tr></thead><tbody id="rows"><tr><td colspan="8">-</td></tr></tbody></table></section>
<section class="panel"><h2>结果</h2><pre id="resultView">-</pre></section>
<div class="modal" id="confirmModal"><div class="dialog"><h2>确认撤单</h2><div id="confirmText" class="message"></div><div class="dialog-actions"><button class="secondary" id="cancelConfirm">取消</button><button class="danger" id="okConfirm">确认</button></div></div></div>
<script>
const e=Object.fromEntries(["account","connector","pair","olderThan","limit","message","rows","resultView","confirmModal","confirmText","cancelConfirm","okConfirm"].map(id=>[id,document.getElementById(id)]));const api=cfg();let current=[],pending=null;function cfg(){const d={baseUrl:"http://127.0.0.1:8000",username:"admin",password:"admin",mode:"auto"};try{return{...d,...JSON.parse(localStorage.getItem("chuanBackendConfig")||"{}")}}catch(_){return d}}function headers(){return{"Authorization":`Basic ${btoa(`${api.username}:${api.password}`)}`,"Content-Type":"application/json"}}async function apiFetch(p,o={}){const r=await fetch(`${api.baseUrl.replace(/\/$/,"")}${p}`,{...o,headers:{...headers(),...(o.headers||{})}});if(!r.ok){let d=r.statusText;try{const b=await r.json();d=b.detail||b.message||JSON.stringify(b)}catch(_){}throw new Error(d)}return r.json()}function list(v){return String(v||"").split(",").map(x=>x.trim()).filter(Boolean)}function body(){return{account_names:list(e.account.value),connector_names:list(e.connector.value),trading_pairs:list(e.pair.value.toUpperCase()),limit:Number(e.limit.value)||100}}async function load(){if(api.mode==="demo"){current=[{client_order_id:"demo-cancel",account_name:e.account.value,connector_name:e.connector.value,trading_pair:e.pair.value,trade_type:"BUY",amount:"0.01",price:"65000",status:"OPEN",creation_timestamp:new Date(Date.now()-600000).toISOString()}];render(current);return}try{const res=await apiFetch("/trading/orders/active",{method:"POST",body:JSON.stringify(body())});current=res.data||[];render(current);e.message.textContent="已扫描。";e.message.className="message ok"}catch(err){e.message.textContent=`扫描失败：${err.message}`;e.message.className="message fail"}}function openConfirm(i){pending=current[i];e.confirmText.textContent=pending.client_order_id||pending.order_id||"-";e.confirmModal.classList.add("open")}async function cancelNow(){const r=pending;if(!r)return;e.confirmModal.classList.remove("open");const account=r.account_name||e.account.value,connector=r.connector_name||e.connector.value,id=r.client_order_id||r.order_id;if(api.mode==="demo"){e.resultView.textContent=JSON.stringify({dry_run:true,client_order_id:id},null,2);return}try{const res=await apiFetch(`/trading/${encodeURIComponent(account)}/${encodeURIComponent(connector)}/orders/${encodeURIComponent(id)}/cancel`,{method:"POST"});e.resultView.textContent=JSON.stringify(res,null,2);e.message.textContent="已提交撤单。";e.message.className="message ok";await load()}catch(err){e.message.textContent=`撤单失败：${err.message}`;e.message.className="message fail"}}function render(rows){const limit=Number(e.olderThan.value)||0;const now=Date.now();const candidates=rows.filter(r=>ageSeconds(r,now)>=limit);e.rows.innerHTML=candidates.length?candidates.map((r,i)=>`<tr><td>${h(r.client_order_id||r.order_id)}</td><td>${h(r.trading_pair)}</td><td>${h(r.trade_type||r.side)}</td><td>${h(r.amount)}</td><td>${h(r.price)}</td><td>${h(r.status||r.current_state)}</td><td>${h(r.creation_timestamp||r.timestamp||"-")}</td><td><button class="danger" onclick="openConfirm(${rows.indexOf(r)})">撤单</button></td></tr>`).join(""):`<tr><td colspan="8">暂无可撤订单。</td></tr>`}function ageSeconds(r,now){const t=Date.parse(r.creation_timestamp||r.timestamp||0);return t?Math.floor((now-t)/1000):0}function h(v){return String(v??"-").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;")}document.getElementById("loadBtn").addEventListener("click",load);e.cancelConfirm.addEventListener("click",()=>e.confirmModal.classList.remove("open"));e.okConfirm.addEventListener("click",cancelNow);load();
</script></main></body></html>
