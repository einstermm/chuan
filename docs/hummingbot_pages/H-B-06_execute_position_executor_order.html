<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>H-B-06 执行 PositionExecutor 订单</title>
  <style>
    :root{--bg:#f6f7f8;--panel:#fff;--line:#d9dde3;--text:#1f2933;--muted:#697386;--primary:#1f6feb;--danger:#c53030;--ok:#137333}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,"Microsoft YaHei",sans-serif;font-size:14px;line-height:1.5}header{padding:18px 24px;border-bottom:1px solid var(--line);background:#fff}h1,h2{margin:0;font-weight:600}h1{font-size:22px}h2{font-size:17px;margin-bottom:12px}main{max-width:980px;margin:0 auto;padding:18px}.panel{background:#fff;border:1px solid var(--line);border-radius:6px;padding:14px;margin-bottom:14px}.form{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}label{display:block;margin-bottom:5px;color:#344054;font-size:13px}input,select{width:100%;min-height:34px;padding:7px 9px;border:1px solid #c9d1dc;border-radius:4px;font:inherit}button{min-height:34px;padding:7px 12px;border:1px solid var(--primary);border-radius:4px;background:var(--primary);color:#fff;cursor:pointer;margin-top:12px}.message{min-height:24px;margin-top:10px;color:var(--muted)}.ok{color:var(--ok)}.fail{color:var(--danger)}pre{padding:10px;border:1px solid var(--line);border-radius:6px;background:#fbfcfd;overflow:auto;min-height:150px}@media(max-width:900px){.form{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <header><h1>H-B-06 执行 PositionExecutor 订单</h1></header>
  <main>
    <section class="panel">
      <h2>PositionExecutor</h2>
      <div class="form">
        <div><label>账户</label><input id="account" value="master_account"></div>
        <div><label>Controller ID</label><input id="controller" value="main"></div>
        <div><label>Connector</label><input id="connector" value="binance_perpetual"></div>
        <div><label>交易对</label><input id="pair" value="BTC-USDT"></div>
        <div><label>方向</label><select id="side"><option>BUY</option><option>SELL</option></select></div>
        <div><label>数量 Base</label><input id="amount" value="0.01"></div>
        <div><label>入场价</label><input id="entryPrice" value=""></div>
        <div><label>杠杆</label><input id="leverage" value="10"></div>
        <div><label>开仓订单类型</label><select id="openOrderType"><option>LIMIT</option><option>MARKET</option><option>LIMIT_MAKER</option></select></div>
        <div><label>止损</label><input id="stopLoss" value="0.02"></div>
        <div><label>止盈</label><input id="takeProfit" value="0.04"></div>
        <div><label>时间退出 秒</label><input id="timeLimit" value="3600"></div>
      </div>
      <button id="submitBtn">创建 PositionExecutor</button>
      <div id="message" class="message"></div>
    </section>
    <section class="panel"><h2>请求</h2><pre id="requestView">-</pre></section>
    <section class="panel"><h2>结果</h2><pre id="resultView">-</pre></section>
  </main>
  <script>
    const ids=["account","controller","connector","pair","side","amount","entryPrice","leverage","openOrderType","stopLoss","takeProfit","timeLimit","message","requestView","resultView"];
    const e=Object.fromEntries(ids.map(id=>[id,document.getElementById(id)]));
    const api=loadApiConfig();
    function loadApiConfig(){const d={baseUrl:"http://127.0.0.1:8000",username:"admin",password:"admin",mode:"auto"};try{return{...d,...JSON.parse(localStorage.getItem("chuanBackendConfig")||"{}")};}catch(_){return d;}}
    function headers(){return{"Authorization":`Basic ${btoa(`${api.username}:${api.password}`)}`,"Content-Type":"application/json"};}
    async function apiFetch(path,opts={}){const r=await fetch(`${api.baseUrl.replace(/\/$/,"")}${path}`,{...opts,headers:{...headers(),...(opts.headers||{})}});if(!r.ok){let d=r.statusText;try{const b=await r.json();d=b.detail||b.message||JSON.stringify(b)}catch(_){}throw new Error(d)}return r.json();}
    function maybe(v){return String(v||"").trim()?String(v).trim():null;}
    function payload(){const barrier={open_order_type:e.openOrderType.value,take_profit_order_type:"MARKET",stop_loss_order_type:"MARKET",time_limit_order_type:"MARKET"};if(maybe(e.stopLoss.value))barrier.stop_loss=e.stopLoss.value;if(maybe(e.takeProfit.value))barrier.take_profit=e.takeProfit.value;if(maybe(e.timeLimit.value))barrier.time_limit=Number(e.timeLimit.value);const cfg={type:"position_executor",connector_name:e.connector.value.trim(),trading_pair:e.pair.value.trim().toUpperCase(),side:e.side.value,amount:e.amount.value,leverage:Number(e.leverage.value),triple_barrier_config:barrier};if(maybe(e.entryPrice.value))cfg.entry_price=e.entryPrice.value;return{account_name:e.account.value.trim(),controller_id:e.controller.value.trim()||"main",executor_config:cfg};}
    function refresh(){e.requestView.textContent=JSON.stringify(payload(),null,2);}
    async function submit(){const body=payload();e.requestView.textContent=JSON.stringify(body,null,2);if(api.mode==="demo"){e.resultView.textContent=JSON.stringify({dry_run:true,request:body},null,2);return;}try{e.resultView.textContent=JSON.stringify(await apiFetch("/executors/",{method:"POST",body:JSON.stringify(body)}),null,2);e.message.textContent="已创建。";e.message.className="message ok";}catch(err){e.message.textContent=`创建失败：${err.message}`;e.message.className="message fail";}}
    ids.slice(0,12).forEach(id=>e[id].addEventListener("input",refresh));document.getElementById("submitBtn").addEventListener("click",submit);refresh();
  </script>
</body>
</html>
