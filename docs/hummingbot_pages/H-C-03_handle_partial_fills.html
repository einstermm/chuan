<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>H-C-03 处理部分成交</title>
<style>:root{--bg:#f6f7f8;--panel:#fff;--line:#d9dde3;--text:#1f2933;--muted:#697386;--primary:#1f6feb;--danger:#c53030;--ok:#137333}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,"Microsoft YaHei",sans-serif;font-size:14px;line-height:1.5}header{padding:18px 24px;border-bottom:1px solid var(--line);background:#fff}h1,h2{margin:0;font-weight:600}h1{font-size:22px}h2{font-size:17px;margin-bottom:12px}main{max-width:1180px;margin:0 auto;padding:18px}.panel{background:#fff;border:1px solid var(--line);border-radius:6px;padding:14px;margin-bottom:14px}.form{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;align-items:end}label{display:block;margin-bottom:5px;color:#344054;font-size:13px}input{width:100%;min-height:34px;padding:7px 9px;border:1px solid #c9d1dc;border-radius:4px;font:inherit}button{min-height:34px;padding:7px 12px;border:1px solid var(--primary);border-radius:4px;background:var(--primary);color:#fff;cursor:pointer}table{width:100%;border-collapse:collapse}th,td{padding:8px;border-bottom:1px solid var(--line);text-align:left}th{background:#f8fafc;color:#344054;font-size:13px}.bar{height:8px;background:#edf2f7;border-radius:999px;overflow:hidden}.bar span{display:block;height:100%;background:var(--primary)}.message{min-height:24px;margin-top:10px;color:var(--muted)}.ok{color:var(--ok)}.fail{color:var(--danger)}@media(max-width:900px){.form{grid-template-columns:1fr}}</style></head>
<body><header><h1>H-C-03 处理部分成交</h1></header><main>
<section class="panel"><h2>查询</h2><div class="form"><div><label>账户</label><input id="account" value="master_account"></div><div><label>Connector</label><input id="connector" value="binance_perpetual"></div><div><label>交易对</label><input id="pair" value="BTC-USDT"></div><div><label>Limit</label><input id="limit" value="100"></div><div><button id="loadBtn">查询部分成交</button></div></div><div id="message" class="message"></div></section>
<section class="panel"><h2>部分成交</h2><table><thead><tr><th>订单ID</th><th>方向</th><th>数量</th><th>已成交</th><th>剩余</th><th>进度</th><th>状态</th></tr></thead><tbody id="rows"><tr><td colspan="7">-</td></tr></tbody></table></section>
<script>
const e=Object.fromEntries(["account","connector","pair","limit","message","rows"].map(id=>[id,document.getElementById(id)]));const api=cfg();function cfg(){const d={baseUrl:"http://127.0.0.1:8000",username:"admin",password:"admin",mode:"auto"};try{return{...d,...JSON.parse(localStorage.getItem("chuanBackendConfig")||"{}")}}catch(_){return d}}function headers(){return{"Authorization":`Basic ${btoa(`${api.username}:${api.password}`)}`,"Content-Type":"application/json"}}async function apiFetch(p,o={}){const r=await fetch(`${api.baseUrl.replace(/\/$/,"")}${p}`,{...o,headers:{...headers(),...(o.headers||{})}});if(!r.ok){let d=r.statusText;try{const b=await r.json();d=b.detail||b.message||JSON.stringify(b)}catch(_){}throw new Error(d)}return r.json()}function list(v){return String(v||"").split(",").map(x=>x.trim()).filter(Boolean)}function body(){return{account_names:list(e.account.value),connector_names:list(e.connector.value),trading_pairs:list(e.pair.value.toUpperCase()),limit:Number(e.limit.value)||100}}async function load(){if(api.mode==="demo"){render([{client_order_id:"demo-partial",trade_type:"BUY",amount:"1",filled_amount:"0.35",status:"OPEN"}]);return}try{const res=await apiFetch("/trading/orders/active",{method:"POST",body:JSON.stringify(body())});render((res.data||[]).filter(isPartial));e.message.textContent="已查询。";e.message.className="message ok"}catch(err){e.message.textContent=`查询失败：${err.message}`;e.message.className="message fail"}}function isPartial(r){const amount=Number(r.amount||0);const filled=Number(r.filled_amount||r.executed_amount_base||0);return amount>0&&filled>0&&filled<amount}function render(rows){e.rows.innerHTML=rows.length?rows.map(r=>{const amount=Number(r.amount||0),filled=Number(r.filled_amount||r.executed_amount_base||0),p=amount?Math.min(100,filled/amount*100):0;return`<tr><td>${h(r.client_order_id||r.order_id)}</td><td>${h(r.trade_type||r.side)}</td><td>${h(r.amount)}</td><td>${h(filled)}</td><td>${h(Math.max(0,amount-filled).toFixed(8))}</td><td><div class="bar"><span style="width:${p}%"></span></div>${p.toFixed(2)}%</td><td>${h(r.status||r.current_state)}</td></tr>`}).join(""):`<tr><td colspan="7">暂无部分成交。</td></tr>`}function h(v){return String(v??"-").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;")}document.getElementById("loadBtn").addEventListener("click",load);load();
</script></main></body></html>
