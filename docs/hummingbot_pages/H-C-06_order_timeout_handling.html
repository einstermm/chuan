<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>H-C-06 订单超时处理</title>
<style>:root{--bg:#f6f7f8;--panel:#fff;--line:#d9dde3;--text:#1f2933;--muted:#697386;--primary:#1f6feb;--danger:#c53030;--ok:#137333}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,"Microsoft YaHei",sans-serif;font-size:14px;line-height:1.5}header{padding:18px 24px;border-bottom:1px solid var(--line);background:#fff}h1,h2{margin:0;font-weight:600}h1{font-size:22px}h2{font-size:17px;margin-bottom:12px}main{max-width:1180px;margin:0 auto;padding:18px}.panel{background:#fff;border:1px solid var(--line);border-radius:6px;padding:14px;margin-bottom:14px}.form{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;align-items:end}label{display:block;margin-bottom:5px;color:#344054;font-size:13px}input,select{width:100%;min-height:34px;padding:7px 9px;border:1px solid #c9d1dc;border-radius:4px;font:inherit}button{min-height:34px;padding:7px 12px;border:1px solid var(--primary);border-radius:4px;background:var(--primary);color:#fff;cursor:pointer}button.secondary{border-color:#b6c2d1;background:#fff;color:var(--text)}table{width:100%;border-collapse:collapse}th,td{padding:8px;border-bottom:1px solid var(--line);text-align:left}th{background:#f8fafc;color:#344054;font-size:13px}.message{min-height:24px;margin-top:10px;color:var(--muted)}.ok{color:var(--ok)}.fail{color:var(--danger)}@media(max-width:900px){.form{grid-template-columns:1fr}}</style></head>
<body><header><h1>H-C-06 订单超时处理</h1></header><main>
<section class="panel"><h2>超时规则</h2><div class="form"><div><label>规则名</label><input id="ruleName" value="limit_timeout"></div><div><label>Connector</label><input id="ruleConnector" value="binance_perpetual"></div><div><label>交易对</label><input id="rulePair" value="BTC-USDT"></div><div><label>超时秒数</label><input id="ruleSeconds" value="300"></div><div><button id="saveRuleBtn">保存规则</button></div></div></section>
<section class="panel"><h2>扫描</h2><div class="form"><div><label>账户</label><input id="account" value="master_account"></div><div><label>Connector</label><input id="connector" value="binance_perpetual"></div><div><label>交易对</label><input id="pair" value="BTC-USDT"></div><div><label>Limit</label><input id="limit" value="100"></div><div><button id="scanBtn">扫描超时</button></div></div><div id="message" class="message"></div></section>
<section class="panel"><h2>命中订单</h2><table><thead><tr><th>订单ID</th><th>规则</th><th>交易对</th><th>已等待秒数</th><th>状态</th></tr></thead><tbody id="rows"><tr><td colspan="5">-</td></tr></tbody></table></section>
<section class="panel"><h2>规则列表</h2><table><thead><tr><th>规则名</th><th>Connector</th><th>交易对</th><th>秒数</th></tr></thead><tbody id="rulesRows"></tbody></table></section>
<script>
const e=Object.fromEntries(["ruleName","ruleConnector","rulePair","ruleSeconds","account","connector","pair","limit","message","rows","rulesRows"].map(id=>[id,document.getElementById(id)]));const api=cfg();let rules=JSON.parse(localStorage.getItem("chuanTimeoutRules")||"[]");function cfg(){const d={baseUrl:"http://127.0.0.1:8000",username:"admin",password:"admin",mode:"auto"};try{return{...d,...JSON.parse(localStorage.getItem("chuanBackendConfig")||"{}")}}catch(_){return d}}function headers(){return{"Authorization":`Basic ${btoa(`${api.username}:${api.password}`)}`,"Content-Type":"application/json"}}async function apiFetch(p,o={}){const r=await fetch(`${api.baseUrl.replace(/\/$/,"")}${p}`,{...o,headers:{...headers(),...(o.headers||{})}});if(!r.ok){let d=r.statusText;try{const b=await r.json();d=b.detail||b.message||JSON.stringify(b)}catch(_){}throw new Error(d)}return r.json()}function list(v){return String(v||"").split(",").map(x=>x.trim()).filter(Boolean)}function saveRule(){const r={name:e.ruleName.value,connector:e.ruleConnector.value,trading_pair:e.rulePair.value.toUpperCase(),seconds:Number(e.ruleSeconds.value)||0};rules=rules.filter(x=>x.name!==r.name);rules.push(r);localStorage.setItem("chuanTimeoutRules",JSON.stringify(rules));renderRules()}async function scan(){let orders=[];if(api.mode==="demo"){orders=[{client_order_id:"demo-timeout",connector_name:e.connector.value,trading_pair:e.pair.value,status:"OPEN",creation_timestamp:new Date(Date.now()-600000).toISOString()}]}else{try{const res=await apiFetch("/trading/orders/active",{method:"POST",body:JSON.stringify({account_names:list(e.account.value),connector_names:list(e.connector.value),trading_pairs:list(e.pair.value.toUpperCase()),limit:Number(e.limit.value)||100})});orders=res.data||[]}catch(err){e.message.textContent=`扫描失败：${err.message}`;e.message.className="message fail";return}}const now=Date.now();const hits=[];orders.forEach(o=>rules.forEach(r=>{if((o.connector_name||e.connector.value)===r.connector&&o.trading_pair===r.trading_pair&&age(o,now)>=r.seconds)hits.push({order:o,rule:r,age:age(o,now)})}));renderHits(hits);e.message.textContent="已扫描。";e.message.className="message ok"}function age(r,now){const t=Date.parse(r.creation_timestamp||r.timestamp||0);return t?Math.floor((now-t)/1000):0}function renderHits(hits){e.rows.innerHTML=hits.length?hits.map(x=>`<tr><td>${h(x.order.client_order_id||x.order.order_id)}</td><td>${h(x.rule.name)}</td><td>${h(x.order.trading_pair)}</td><td>${h(x.age)}</td><td>${h(x.order.status||x.order.current_state)}</td></tr>`).join(""):`<tr><td colspan="5">暂无超时订单。</td></tr>`}function renderRules(){e.rulesRows.innerHTML=rules.length?rules.map(r=>`<tr><td>${h(r.name)}</td><td>${h(r.connector)}</td><td>${h(r.trading_pair)}</td><td>${h(r.seconds)}</td></tr>`).join(""):`<tr><td colspan="4">暂无规则。</td></tr>`}function h(v){return String(v??"-").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;")}document.getElementById("saveRuleBtn").addEventListener("click",saveRule);document.getElementById("scanBtn").addEventListener("click",scan);renderRules();
</script></main></body></html>
