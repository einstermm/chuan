<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>H-A-02 接入交易所 Connector</title>
  <style>
    :root {
      --bg: #f6f7f8;
      --panel: #ffffff;
      --line: #d9dde3;
      --text: #1f2933;
      --muted: #697386;
      --primary: #1f6feb;
      --danger: #c53030;
      --ok: #137333;
      --warn: #8a5a00;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, "Microsoft YaHei", sans-serif;
      font-size: 14px;
      line-height: 1.5;
    }

    header {
      padding: 18px 24px;
      border-bottom: 1px solid var(--line);
      background: var(--panel);
    }

    h1, h2 {
      margin: 0;
      font-weight: 600;
    }

    h1 { font-size: 22px; }

    h2 {
      margin-bottom: 12px;
      font-size: 17px;
    }

    main {
      max-width: 1180px;
      margin: 0 auto;
      padding: 18px 18px 40px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(12, 1fr);
      gap: 14px;
      margin-bottom: 14px;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 14px;
    }

    .span-12 { grid-column: span 12; }

    .summary {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }

    .metric {
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 10px;
      background: #fbfcfd;
    }

    .metric-label {
      color: var(--muted);
      font-size: 12px;
    }

    .metric-value {
      margin-top: 4px;
      font-size: 18px;
      font-weight: 600;
    }

    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
    }

    .section-header h2 { margin-bottom: 0; }

    .toolbar {
      display: grid;
      grid-template-columns: 1.5fr 1fr 1fr;
      gap: 10px;
      margin-bottom: 12px;
    }

    label {
      display: block;
      margin-bottom: 5px;
      color: #344054;
      font-size: 13px;
    }

    input, select, textarea {
      width: 100%;
      min-height: 34px;
      padding: 7px 9px;
      border: 1px solid #c9d1dc;
      border-radius: 4px;
      background: #fff;
      color: var(--text);
      font: inherit;
    }

    textarea {
      min-height: 90px;
      resize: vertical;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    button {
      min-height: 34px;
      padding: 7px 12px;
      border: 1px solid #b6c2d1;
      border-radius: 4px;
      background: #fff;
      color: var(--text);
      cursor: pointer;
      font: inherit;
    }

    button.primary {
      border-color: var(--primary);
      background: var(--primary);
      color: #fff;
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.55;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: #fff;
    }

    th, td {
      padding: 9px 8px;
      border-bottom: 1px solid var(--line);
      text-align: left;
      vertical-align: top;
    }

    th {
      background: #f8fafc;
      color: #344054;
      font-weight: 600;
      font-size: 13px;
    }

    .status {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 12px;
      white-space: nowrap;
    }

    .status.ok {
      background: #e7f3eb;
      color: var(--ok);
    }

    .status.warn {
      background: #fff5d6;
      color: var(--warn);
    }

    .status.fail {
      background: #fde8e8;
      color: var(--danger);
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .chip {
      display: inline-block;
      padding: 2px 7px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: #fbfcfd;
      font-size: 12px;
    }

    .muted { color: var(--muted); }

    .message {
      min-height: 24px;
      margin-top: 10px;
      color: var(--muted);
    }

    .message.ok { color: var(--ok); }
    .message.fail { color: var(--danger); }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 18px;
      background: rgba(17, 24, 39, 0.42);
    }

    .modal-backdrop.open { display: flex; }

    .modal {
      width: min(820px, 100%);
      max-height: calc(100vh - 36px);
      overflow: auto;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 14px;
      box-shadow: 0 18px 44px rgba(15, 23, 42, 0.22);
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
    }

    .modal-header h2 { margin-bottom: 0; }

    .modal-close {
      min-width: 34px;
      padding: 4px 9px;
    }

    pre {
      margin: 0;
      padding: 10px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #fbfcfd;
      overflow: auto;
      font-size: 12px;
    }

    @media (max-width: 900px) {
      .summary, .toolbar {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>H-A-02 接入交易所 Connector</h1>
  </header>

  <main>
    <section class="grid">
      <div class="panel span-12">
        <h2>Connector 概览</h2>
        <div class="summary">
          <div class="metric">
            <div class="metric-label">可用 Connector</div>
            <div class="metric-value" id="connectorCount">0</div>
          </div>
          <div class="metric">
            <div class="metric-label">已接入</div>
            <div class="metric-value" id="connectedCount">0</div>
          </div>
          <div class="metric">
            <div class="metric-label">现货</div>
            <div class="metric-value" id="spotCount">0</div>
          </div>
          <div class="metric">
            <div class="metric-label">永续</div>
            <div class="metric-value" id="perpCount">0</div>
          </div>
        </div>
      </div>
    </section>

    <section class="grid">
      <div class="panel span-12">
        <div class="section-header">
          <h2>Connector 列表</h2>
        </div>
        <div class="toolbar">
          <div>
            <label for="searchInput">搜索</label>
            <input id="searchInput" placeholder="binance / okx / perpetual">
          </div>
          <div>
            <label for="typeFilter">类型</label>
            <select id="typeFilter">
              <option value="all">全部</option>
              <option value="spot">现货</option>
              <option value="perpetual">永续</option>
            </select>
          </div>
          <div>
            <label for="statusFilter">状态</label>
            <select id="statusFilter">
              <option value="all">全部</option>
              <option value="connected">已接入</option>
              <option value="not_connected">未接入</option>
            </select>
          </div>
        </div>
        <table>
          <thead>
            <tr>
              <th>Connector</th>
              <th>类型</th>
              <th>接入账户</th>
              <th>状态</th>
              <th>操作</th>
            </tr>
          </thead>
          <tbody id="connectorsTable">
            <tr><td colspan="5" class="muted">等待加载。</td></tr>
          </tbody>
        </table>
      </div>
    </section>
  </main>

  <div class="modal-backdrop" id="detailModal">
    <div class="modal">
      <div class="modal-header">
        <h2 id="detailTitle">Connector</h2>
        <button class="modal-close" data-close-modal="detailModal">×</button>
      </div>
      <div class="summary" style="margin-bottom:12px;">
        <div class="metric">
          <div class="metric-label">类型</div>
          <div class="metric-value" id="detailType">-</div>
        </div>
        <div class="metric">
          <div class="metric-label">状态</div>
          <div class="metric-value" id="detailStatus">-</div>
        </div>
        <div class="metric">
          <div class="metric-label">账户</div>
          <div class="metric-value" id="detailAccounts">-</div>
        </div>
        <div class="metric">
          <div class="metric-label">字段数</div>
          <div class="metric-value" id="detailFieldCount">-</div>
        </div>
      </div>
      <h2>配置字段</h2>
      <pre id="configMapView">-</pre>
      <div class="message" id="detailMessage"></div>
    </div>
  </div>

  <div class="modal-backdrop" id="rulesModal">
    <div class="modal">
      <div class="modal-header">
        <h2 id="rulesTitle">交易规则</h2>
        <button class="modal-close" data-close-modal="rulesModal">×</button>
      </div>
      <label for="tradingPairsInput">交易对</label>
      <input id="tradingPairsInput" placeholder="BTC-USDT,ETH-USDT">
      <div class="actions" style="margin-top:10px;">
        <button class="primary" id="loadRulesBtn">读取交易规则</button>
        <button id="loadOrderTypesBtn">读取订单类型</button>
      </div>
      <div class="message" id="rulesMessage"></div>
      <pre id="rulesView">-</pre>
    </div>
  </div>

  <script>
    const demoConnectors = [
      "binance",
      "binance_perpetual",
      "okx",
      "okx_perpetual",
      "kucoin",
      "bybit_perpetual"
    ];

    const demoCredentials = {
      master_account: ["binance_perpetual"],
      paper_account: ["binance", "okx"]
    };

    const demoConfigMaps = {
      binance: { binance_api_key: { type: "SecretStr", required: true }, binance_api_secret: { type: "SecretStr", required: true } },
      binance_perpetual: { binance_perpetual_api_key: { type: "SecretStr", required: true }, binance_perpetual_api_secret: { type: "SecretStr", required: true } },
      okx: { okx_api_key: { type: "SecretStr", required: true }, okx_secret_key: { type: "SecretStr", required: true }, okx_passphrase: { type: "SecretStr", required: true } },
      okx_perpetual: { okx_perpetual_api_key: { type: "SecretStr", required: true }, okx_perpetual_secret_key: { type: "SecretStr", required: true }, okx_perpetual_passphrase: { type: "SecretStr", required: true } }
    };

    const state = {
      connectors: [],
      credentialsByAccount: {},
      configMaps: {},
      selectedConnector: "",
      apiAvailable: false,
      apiConfig: loadApiConfig()
    };

    const els = {
      connectorCount: document.getElementById("connectorCount"),
      connectedCount: document.getElementById("connectedCount"),
      spotCount: document.getElementById("spotCount"),
      perpCount: document.getElementById("perpCount"),
      searchInput: document.getElementById("searchInput"),
      typeFilter: document.getElementById("typeFilter"),
      statusFilter: document.getElementById("statusFilter"),
      connectorsTable: document.getElementById("connectorsTable"),
      detailTitle: document.getElementById("detailTitle"),
      detailType: document.getElementById("detailType"),
      detailStatus: document.getElementById("detailStatus"),
      detailAccounts: document.getElementById("detailAccounts"),
      detailFieldCount: document.getElementById("detailFieldCount"),
      configMapView: document.getElementById("configMapView"),
      detailMessage: document.getElementById("detailMessage"),
      rulesTitle: document.getElementById("rulesTitle"),
      tradingPairsInput: document.getElementById("tradingPairsInput"),
      rulesMessage: document.getElementById("rulesMessage"),
      rulesView: document.getElementById("rulesView")
    };

    function loadApiConfig() {
      const defaults = {
        baseUrl: "http://127.0.0.1:8000",
        username: "admin",
        password: "admin",
        mode: "auto"
      };
      try {
        return { ...defaults, ...JSON.parse(localStorage.getItem("chuanBackendConfig") || "{}") };
      } catch (_) {
        return defaults;
      }
    }

    function authHeaders() {
      return {
        "Authorization": `Basic ${btoa(`${state.apiConfig.username}:${state.apiConfig.password}`)}`,
        "Content-Type": "application/json"
      };
    }

    async function apiFetch(path, options = {}) {
      const base = state.apiConfig.baseUrl.replace(/\/$/, "");
      const response = await fetch(`${base}${path}`, {
        ...options,
        headers: { ...authHeaders(), ...(options.headers || {}) }
      });
      if (!response.ok) {
        let detail = response.statusText;
        try {
          const body = await response.json();
          detail = body.detail || body.message || JSON.stringify(body);
        } catch (_) {}
        throw new Error(detail);
      }
      return response.json();
    }

    function setMessage(element, text, type = "") {
      element.className = `message ${type}`;
      element.textContent = text;
    }

    function useDemoData() {
      state.connectors = demoConnectors;
      state.credentialsByAccount = demoCredentials;
      state.configMaps = { ...demoConfigMaps };
      state.apiAvailable = false;
      render();
    }

    async function loadData() {
      state.apiConfig = loadApiConfig();
      if (state.apiConfig.mode === "demo") {
        useDemoData();
        return;
      }

      try {
        const accounts = await apiFetch("/accounts/");
        const connectors = await apiFetch("/connectors/");
        const credentialEntries = await Promise.all(
          accounts.map(async account => {
            const credentials = await apiFetch(`/accounts/${encodeURIComponent(account)}/credentials`);
            return [account, credentials];
          })
        );
        state.connectors = prioritizeConnectors(connectors);
        state.credentialsByAccount = Object.fromEntries(credentialEntries);
        state.configMaps = {};
        state.apiAvailable = true;
        render();
      } catch (error) {
        if (state.apiConfig.mode === "api") {
          state.connectors = [];
          state.credentialsByAccount = {};
          state.apiAvailable = false;
          render();
        } else {
          useDemoData();
        }
      }
    }

    function prioritizeConnectors(connectors) {
      const preferred = ["binance_perpetual", "binance", "okx_perpetual", "okx", "kucoin", "bybit_perpetual"];
      const set = new Set(connectors);
      return [
        ...preferred.filter(name => set.has(name)),
        ...connectors.filter(name => !preferred.includes(name)).sort()
      ];
    }

    function getConnectorType(connector) {
      return connector.includes("perpetual") ? "永续" : "现货";
    }

    function connectedAccounts(connector) {
      return Object.entries(state.credentialsByAccount)
        .filter(([, credentials]) => credentials.includes(connector))
        .map(([account]) => account);
    }

    function connectorRows() {
      const search = els.searchInput.value.trim().toLowerCase();
      const type = els.typeFilter.value;
      const status = els.statusFilter.value;
      return state.connectors.filter(connector => {
        const accounts = connectedAccounts(connector);
        const connectorType = getConnectorType(connector);
        if (search && !connector.toLowerCase().includes(search)) return false;
        if (type === "spot" && connectorType !== "现货") return false;
        if (type === "perpetual" && connectorType !== "永续") return false;
        if (status === "connected" && !accounts.length) return false;
        if (status === "not_connected" && accounts.length) return false;
        return true;
      });
    }

    function render() {
      renderSummary();
      renderTable();
    }

    function renderSummary() {
      const connected = new Set();
      Object.values(state.credentialsByAccount).forEach(credentials => {
        credentials.forEach(connector => connected.add(connector));
      });
      els.connectorCount.textContent = state.connectors.length;
      els.connectedCount.textContent = connected.size;
      els.spotCount.textContent = state.connectors.filter(connector => getConnectorType(connector) === "现货").length;
      els.perpCount.textContent = state.connectors.filter(connector => getConnectorType(connector) === "永续").length;
    }

    function renderTable() {
      const rows = connectorRows();
      if (!rows.length) {
        els.connectorsTable.innerHTML = `<tr><td colspan="5" class="muted">暂无 Connector。</td></tr>`;
        return;
      }

      els.connectorsTable.innerHTML = rows.map(connector => {
        const accounts = connectedAccounts(connector);
        const status = accounts.length
          ? `<span class="status ok">已接入</span>`
          : `<span class="status warn">未接入</span>`;
        const accountChips = accounts.length
          ? `<div class="chips">${accounts.map(account => `<span class="chip">${escapeHtml(account)}</span>`).join("")}</div>`
          : `<span class="muted">无</span>`;
        return `
          <tr>
            <td><strong>${escapeHtml(connector)}</strong></td>
            <td>${getConnectorType(connector)}</td>
            <td>${accountChips}</td>
            <td>${status}</td>
            <td>
              <button data-action="detail" data-connector="${escapeHtml(connector)}">查看</button>
              <button data-action="rules" data-connector="${escapeHtml(connector)}">规则</button>
            </td>
          </tr>
        `;
      }).join("");
    }

    async function loadConfigMap(connector) {
      if (state.configMaps[connector]) return state.configMaps[connector];
      if (!state.apiAvailable) {
        state.configMaps[connector] = demoConfigMaps[connector] || {};
        return state.configMaps[connector];
      }
      state.configMaps[connector] = await apiFetch(`/connectors/${encodeURIComponent(connector)}/config-map`);
      return state.configMaps[connector];
    }

    async function openDetail(connector) {
      state.selectedConnector = connector;
      const accounts = connectedAccounts(connector);
      els.detailTitle.textContent = connector;
      els.detailType.textContent = getConnectorType(connector);
      els.detailStatus.textContent = accounts.length ? "已接入" : "未接入";
      els.detailAccounts.textContent = accounts.length ? accounts.join(", ") : "-";
      els.detailFieldCount.textContent = "-";
      els.configMapView.textContent = "-";
      setMessage(els.detailMessage, "");
      openModal("detailModal");

      try {
        const configMap = await loadConfigMap(connector);
        els.detailFieldCount.textContent = Object.keys(configMap).length;
        els.configMapView.textContent = JSON.stringify(configMap, null, 2);
      } catch (error) {
        setMessage(els.detailMessage, `读取失败：${error.message}`, "fail");
      }
    }

    function openRules(connector) {
      state.selectedConnector = connector;
      els.rulesTitle.textContent = connector;
      els.tradingPairsInput.value = "";
      els.rulesView.textContent = "-";
      setMessage(els.rulesMessage, "");
      openModal("rulesModal");
    }

    async function loadTradingRules() {
      const connector = state.selectedConnector;
      if (!connector) return;
      const rawPairs = els.tradingPairsInput.value.trim();
      const params = rawPairs
        ? "?" + rawPairs.split(",").map(pair => `trading_pairs=${encodeURIComponent(pair.trim())}`).join("&")
        : "";

      if (!state.apiAvailable) {
        els.rulesView.textContent = JSON.stringify({
          "BTC-USDT": { min_order_size: "0.00001", min_price_increment: "0.01", min_base_amount_increment: "0.00001" }
        }, null, 2);
        setMessage(els.rulesMessage, "已读取。", "ok");
        return;
      }

      try {
        setMessage(els.rulesMessage, "读取中...");
        const rules = await apiFetch(`/connectors/${encodeURIComponent(connector)}/trading-rules${params}`);
        els.rulesView.textContent = JSON.stringify(rules, null, 2);
        setMessage(els.rulesMessage, "已读取。", "ok");
      } catch (error) {
        setMessage(els.rulesMessage, `读取失败：${error.message}`, "fail");
      }
    }

    async function loadOrderTypes() {
      const connector = state.selectedConnector;
      if (!connector) return;

      if (!state.apiAvailable) {
        els.rulesView.textContent = JSON.stringify({ connector, supported_order_types: ["LIMIT", "MARKET", "LIMIT_MAKER"] }, null, 2);
        setMessage(els.rulesMessage, "已读取。", "ok");
        return;
      }

      try {
        setMessage(els.rulesMessage, "读取中...");
        const orderTypes = await apiFetch(`/connectors/${encodeURIComponent(connector)}/order-types`);
        els.rulesView.textContent = JSON.stringify(orderTypes, null, 2);
        setMessage(els.rulesMessage, "已读取。", "ok");
      } catch (error) {
        setMessage(els.rulesMessage, `读取失败：${error.message}`, "fail");
      }
    }

    function openModal(id) {
      const modal = document.getElementById(id);
      if (modal) modal.classList.add("open");
    }

    function closeModal(id) {
      const modal = document.getElementById(id);
      if (modal) modal.classList.remove("open");
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    document.getElementById("loadRulesBtn").addEventListener("click", loadTradingRules);
    document.getElementById("loadOrderTypesBtn").addEventListener("click", loadOrderTypes);
    els.searchInput.addEventListener("input", renderTable);
    els.typeFilter.addEventListener("change", renderTable);
    els.statusFilter.addEventListener("change", renderTable);

    els.connectorsTable.addEventListener("click", event => {
      const button = event.target.closest("button");
      if (!button) return;
      const connector = button.dataset.connector;
      if (button.dataset.action === "detail") openDetail(connector);
      if (button.dataset.action === "rules") openRules(connector);
    });

    document.querySelectorAll("[data-close-modal]").forEach(button => {
      button.addEventListener("click", () => closeModal(button.dataset.closeModal));
    });

    document.querySelectorAll(".modal-backdrop").forEach(backdrop => {
      backdrop.addEventListener("click", event => {
        if (event.target === backdrop) closeModal(backdrop.id);
      });
    });

    loadData();
  </script>
</body>
</html>
