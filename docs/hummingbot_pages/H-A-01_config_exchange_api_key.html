<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>H-A-01 配置交易所 API Key</title>
  <style>
    :root {
      --bg: #f6f7f8;
      --panel: #ffffff;
      --line: #d9dde3;
      --text: #1f2933;
      --muted: #697386;
      --primary: #1f6feb;
      --danger: #c53030;
      --ok: #137333;
      --warn: #8a5a00;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, "Microsoft YaHei", sans-serif;
      font-size: 14px;
      line-height: 1.5;
    }

    header {
      padding: 18px 24px;
      border-bottom: 1px solid var(--line);
      background: var(--panel);
    }

    h1, h2, h3 {
      margin: 0;
      font-weight: 600;
    }

    h1 {
      font-size: 22px;
    }

    h2 {
      margin-bottom: 12px;
      font-size: 17px;
    }

    h3 {
      margin-bottom: 8px;
      font-size: 15px;
    }

    main {
      max-width: 1180px;
      margin: 0 auto;
      padding: 18px 18px 40px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(12, 1fr);
      gap: 14px;
      margin-bottom: 14px;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 14px;
    }

    .span-12 { grid-column: span 12; }
    .span-8 { grid-column: span 8; }
    .span-6 { grid-column: span 6; }
    .span-4 { grid-column: span 4; }

    .summary {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    .metric {
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 10px;
      background: #fbfcfd;
    }

    .metric-label {
      color: var(--muted);
      font-size: 12px;
    }

    .metric-value {
      margin-top: 4px;
      font-size: 18px;
      font-weight: 600;
    }

    label {
      display: block;
      margin-bottom: 5px;
      color: #344054;
      font-size: 13px;
    }

    input, select, textarea {
      width: 100%;
      min-height: 34px;
      padding: 7px 9px;
      border: 1px solid #c9d1dc;
      border-radius: 4px;
      background: #fff;
      color: var(--text);
      font: inherit;
    }

    textarea {
      min-height: 72px;
      resize: vertical;
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 10px;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 10px;
    }

    button {
      min-height: 34px;
      padding: 7px 12px;
      border: 1px solid #b6c2d1;
      border-radius: 4px;
      background: #fff;
      color: var(--text);
      cursor: pointer;
      font: inherit;
    }

    button.primary {
      border-color: var(--primary);
      background: var(--primary);
      color: #fff;
    }

    button.danger {
      border-color: var(--danger);
      color: var(--danger);
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.55;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: #fff;
    }

    th, td {
      padding: 9px 8px;
      border-bottom: 1px solid var(--line);
      text-align: left;
      vertical-align: top;
    }

    th {
      background: #f8fafc;
      color: #344054;
      font-weight: 600;
      font-size: 13px;
    }

    .status {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 12px;
      white-space: nowrap;
    }

    .status.ok {
      background: #e7f3eb;
      color: var(--ok);
    }

    .status.warn {
      background: #fff5d6;
      color: var(--warn);
    }

    .status.fail {
      background: #fde8e8;
      color: var(--danger);
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .chip {
      display: inline-block;
      padding: 2px 7px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: #fbfcfd;
      font-size: 12px;
    }

    .muted {
      color: var(--muted);
    }

    .message {
      min-height: 24px;
      margin-top: 10px;
      color: var(--muted);
    }

    .message.ok {
      color: var(--ok);
    }

    .message.fail {
      color: var(--danger);
    }

    .field-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 18px;
      background: rgba(17, 24, 39, 0.42);
    }

    .modal-backdrop.open {
      display: flex;
    }

    .modal {
      width: min(760px, 100%);
      max-height: calc(100vh - 36px);
      overflow: auto;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 14px;
      box-shadow: 0 18px 44px rgba(15, 23, 42, 0.22);
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
    }

    .modal-close {
      min-width: 34px;
      padding: 4px 9px;
    }

    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
    }

    .section-header h2 {
      margin-bottom: 0;
    }

    code {
      padding: 1px 4px;
      border-radius: 3px;
      background: #eef2f7;
      font-family: Menlo, Consolas, monospace;
      font-size: 12px;
    }

    @media (max-width: 900px) {
      .span-8, .span-6, .span-4 {
        grid-column: span 12;
      }

      .summary, .form-row, .field-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>H-A-01 配置交易所 API Key</h1>
  </header>

  <main>
    <section class="grid">
      <div class="panel span-12">
        <h2>配置概览</h2>
        <div class="summary">
          <div class="metric">
            <div class="metric-label">账户数</div>
            <div class="metric-value" id="accountCount">0</div>
          </div>
          <div class="metric">
            <div class="metric-label">已配置 Connector</div>
            <div class="metric-value" id="credentialCount">0</div>
          </div>
          <div class="metric">
            <div class="metric-label">默认账户</div>
            <div class="metric-value" id="defaultAccount">-</div>
          </div>
        </div>
      </div>
    </section>

    <section class="grid">
      <div class="panel span-12">
        <div class="section-header">
          <h2>账户与凭据总览</h2>
          <button class="primary" id="openCreateAccountBtn">创建账户</button>
        </div>
        <table>
          <thead>
            <tr>
              <th>账户名称</th>
              <th>已配置交易所</th>
              <th>状态</th>
              <th>操作</th>
            </tr>
          </thead>
          <tbody id="accountsTable">
            <tr><td colspan="4" class="muted">等待加载。</td></tr>
          </tbody>
        </table>
      </div>
    </section>
  </main>

  <div class="modal-backdrop" id="createAccountModal">
    <div class="modal">
      <div class="modal-header">
        <h2>创建账户</h2>
        <button class="modal-close" data-close-modal="createAccountModal">×</button>
      </div>
        <label for="newAccountName">账户名称</label>
        <input id="newAccountName" placeholder="例如 paper_account">

        <div class="actions">
          <button class="primary" id="createAccountBtn">创建账户</button>
          <button id="resetAccountBtn">重置</button>
        </div>
        <div id="accountMessage" class="message"></div>
    </div>
  </div>

  <div class="modal-backdrop" id="credentialModal">
    <div class="modal">
      <div class="modal-header">
        <h2>添加或更新交易所凭据</h2>
        <button class="modal-close" data-close-modal="credentialModal">×</button>
      </div>
        <div class="form-row">
          <div>
            <label for="credentialAccount">账户</label>
            <select id="credentialAccount"></select>
          </div>
          <div>
            <label for="connectorSelect">Connector</label>
            <select id="connectorSelect"></select>
          </div>
        </div>
        <div id="credentialFields" class="field-grid" style="margin-top:12px;"></div>
        <div class="actions">
          <button class="primary" id="saveCredentialBtn">保存并验证</button>
          <button id="clearCredentialBtn">清空表单</button>
        </div>
        <div id="credentialMessage" class="message"></div>
    </div>
  </div>

  <div class="modal-backdrop" id="deleteCredentialModal">
    <div class="modal">
      <div class="modal-header">
        <h2>删除凭据</h2>
        <button class="modal-close" data-close-modal="deleteCredentialModal">×</button>
      </div>
        <label for="deleteCredentialAccount">账户</label>
        <select id="deleteCredentialAccount"></select>
        <label for="deleteConnectorSelect" style="margin-top:10px;">Connector</label>
        <select id="deleteConnectorSelect"></select>
        <div class="actions">
          <button class="danger" id="prepareDeleteCredentialBtn">删除凭据</button>
        </div>
        <div id="deleteCredentialConfirm" style="display:none;">
          <div class="message fail">确认删除该凭据？</div>
          <div class="actions">
            <button class="danger" id="deleteCredentialBtn">确认删除</button>
            <button id="cancelDeleteCredentialBtn">取消</button>
          </div>
        </div>
        <div id="deleteMessage" class="message"></div>
    </div>
  </div>

  <div class="modal-backdrop" id="deleteAccountModal">
    <div class="modal">
      <div class="modal-header">
        <h2>删除账户</h2>
        <button class="modal-close" data-close-modal="deleteAccountModal">×</button>
      </div>
        <label for="deleteAccountSelect">账户</label>
        <select id="deleteAccountSelect"></select>
        <div class="actions">
          <button class="danger" id="prepareDeleteAccountBtn">删除账户</button>
        </div>
        <div id="deleteAccountConfirm" style="display:none;">
          <div class="message fail">确认删除该账户？</div>
          <div class="actions">
            <button class="danger" id="deleteAccountBtn">确认删除</button>
            <button id="cancelDeleteAccountBtn">取消</button>
          </div>
        </div>
        <div id="deleteAccountMessage" class="message"></div>
    </div>
  </div>

  <script>
    const demoConfigMaps = {
      binance_perpetual: {
        binance_perpetual_api_key: { type: "SecretStr", required: true },
        binance_perpetual_api_secret: { type: "SecretStr", required: true }
      },
      binance: {
        binance_api_key: { type: "SecretStr", required: true },
        binance_api_secret: { type: "SecretStr", required: true }
      },
      okx: {
        okx_api_key: { type: "SecretStr", required: true },
        okx_secret_key: { type: "SecretStr", required: true },
        okx_passphrase: { type: "SecretStr", required: true }
      },
      kucoin: {
        kucoin_api_key: { type: "SecretStr", required: true },
        kucoin_secret_key: { type: "SecretStr", required: true },
        kucoin_passphrase: { type: "SecretStr", required: true }
      }
    };

    const state = {
      accounts: [],
      credentialsByAccount: {},
      connectors: [],
      configMaps: {},
      apiAvailable: false,
      apiConfig: loadApiConfig(),
      selectedAccount: "",
      selectedConnector: ""
    };

    const els = {
      accountCount: document.getElementById("accountCount"),
      credentialCount: document.getElementById("credentialCount"),
      defaultAccount: document.getElementById("defaultAccount"),
      accountsTable: document.getElementById("accountsTable"),
      credentialAccount: document.getElementById("credentialAccount"),
      connectorSelect: document.getElementById("connectorSelect"),
      credentialFields: document.getElementById("credentialFields"),
      credentialMessage: document.getElementById("credentialMessage"),
      deleteCredentialAccount: document.getElementById("deleteCredentialAccount"),
      deleteConnectorSelect: document.getElementById("deleteConnectorSelect"),
      deleteAccountSelect: document.getElementById("deleteAccountSelect"),
      accountMessage: document.getElementById("accountMessage"),
      deleteMessage: document.getElementById("deleteMessage"),
      deleteAccountMessage: document.getElementById("deleteAccountMessage"),
      deleteCredentialConfirm: document.getElementById("deleteCredentialConfirm"),
      deleteAccountConfirm: document.getElementById("deleteAccountConfirm")
    };

    function loadApiConfig() {
      const defaults = {
        baseUrl: "http://127.0.0.1:8000",
        username: "admin",
        password: "admin",
        mode: "auto"
      };
      try {
        return { ...defaults, ...JSON.parse(localStorage.getItem("chuanBackendConfig") || "{}") };
      } catch (_) {
        return defaults;
      }
    }

    function authHeaders() {
      const token = btoa(`${state.apiConfig.username}:${state.apiConfig.password}`);
      return {
        "Authorization": `Basic ${token}`,
        "Content-Type": "application/json"
      };
    }

    async function apiFetch(path, options = {}) {
      const base = state.apiConfig.baseUrl.replace(/\/$/, "");
      const response = await fetch(`${base}${path}`, {
        ...options,
        headers: { ...authHeaders(), ...(options.headers || {}) }
      });
      if (!response.ok) {
        let detail = response.statusText;
        try {
          const body = await response.json();
          detail = body.detail || body.message || JSON.stringify(body);
        } catch (_) {}
        throw new Error(detail);
      }
      return response.json();
    }

    function setMessage(element, text, type = "") {
      if (!element) return;
      element.className = `message ${type}`;
      element.textContent = text;
    }

    function openModal(id) {
      const modal = document.getElementById(id);
      if (modal) modal.classList.add("open");
    }

    function closeModal(id) {
      const modal = document.getElementById(id);
      if (modal) modal.classList.remove("open");
    }

    function resetDeleteConfirms() {
      els.deleteCredentialConfirm.style.display = "none";
      els.deleteAccountConfirm.style.display = "none";
    }

    function normalizeAccountName(value) {
      return value.trim().toLowerCase().replace(/\s+/g, "_").replace(/[^a-z0-9_]/g, "");
    }

    function useDemoData(message) {
      state.accounts = ["master_account", "paper_account", "binance_live_01"];
      state.credentialsByAccount = {
        master_account: ["binance_perpetual"],
        paper_account: ["binance", "okx"],
        binance_live_01: []
      };
      state.connectors = Object.keys(demoConfigMaps);
      state.configMaps = { ...demoConfigMaps };
      state.apiAvailable = false;
      render();
    }

    async function loadData() {
      state.apiConfig = loadApiConfig();
      const mode = state.apiConfig.mode;
      if (mode === "demo") {
        useDemoData("当前使用示例数据。");
        return;
      }

      try {
        const accounts = await apiFetch("/accounts/");
        const connectors = await apiFetch("/connectors/");
        const credentialsEntries = await Promise.all(
          accounts.map(async account => {
            const credentials = await apiFetch(`/accounts/${encodeURIComponent(account)}/credentials`);
            return [account, credentials];
          })
        );

        state.accounts = sortAccounts(accounts);
        state.credentialsByAccount = Object.fromEntries(credentialsEntries);
        state.connectors = prioritizeConnectors(connectors);
        state.configMaps = {};
        state.apiAvailable = true;

        await loadConfigMapForSelectedConnector();
        render();
      } catch (error) {
        state.apiAvailable = false;
        if (mode === "api") {
          console.error(error);
          render();
        } else {
          useDemoData(`已切换示例数据：${error.message}`);
        }
      }
    }

    function sortAccounts(accounts) {
      const copy = [...accounts];
      copy.sort((a, b) => {
        if (a === "master_account") return -1;
        if (b === "master_account") return 1;
        return a.localeCompare(b);
      });
      return copy;
    }

    function prioritizeConnectors(connectors) {
      const preferred = ["binance_perpetual", "binance", "okx", "kucoin", "bybit"];
      const set = new Set(connectors);
      return [
        ...preferred.filter(name => set.has(name)),
        ...connectors.filter(name => !preferred.includes(name)).sort()
      ];
    }

    async function loadConfigMapForSelectedConnector() {
      const connector = els.connectorSelect.value || state.selectedConnector || state.connectors[0];
      if (!connector || state.configMaps[connector]) return;

      try {
        state.configMaps[connector] = await apiFetch(`/connectors/${encodeURIComponent(connector)}/config-map`);
      } catch (error) {
        setMessage(els.credentialMessage, `读取 connector 字段失败：${error.message}`, "fail");
        state.configMaps[connector] = {};
      }
    }

    function render() {
      state.selectedAccount = state.selectedAccount || state.accounts[0] || "";
      state.selectedConnector = state.selectedConnector || state.connectors[0] || "";
      renderSummary();
      renderAccountsTable();
      renderSelects();
      renderCredentialFields();
    }

    function renderSummary() {
      const credentialCount = Object.values(state.credentialsByAccount).reduce((sum, items) => sum + items.length, 0);
      els.accountCount.textContent = state.accounts.length;
      els.credentialCount.textContent = credentialCount;
      els.defaultAccount.textContent = state.accounts.includes("master_account") ? "master_account" : "-";
    }

    function renderAccountsTable() {
      if (!state.accounts.length) {
        els.accountsTable.innerHTML = `<tr><td colspan="4" class="muted">暂无账户。</td></tr>`;
        return;
      }

      els.accountsTable.innerHTML = state.accounts.map(account => {
        const credentials = state.credentialsByAccount[account] || [];
        const status = credentials.length ? `<span class="status ok">已配置</span>` : `<span class="status warn">未配置</span>`;
        const chips = credentials.length
          ? `<div class="chips">${credentials.map(item => `<span class="chip">${escapeHtml(item)}</span>`).join("")}</div>`
          : `<span class="muted">无</span>`;
        const deleteDisabled = account === "master_account" ? "disabled" : "";
        const deleteCredentialDisabled = credentials.length ? "" : "disabled";
        return `
          <tr>
            <td><strong>${escapeHtml(account)}</strong></td>
            <td>${chips}</td>
            <td>${status}</td>
            <td>
              <button data-action="select-account" data-account="${escapeHtml(account)}">添加凭据</button>
              <button class="danger" data-action="delete-credential" data-account="${escapeHtml(account)}" ${deleteCredentialDisabled}>删除凭据</button>
              <button class="danger" data-action="delete-account" data-account="${escapeHtml(account)}" ${deleteDisabled}>删除账户</button>
            </td>
          </tr>
        `;
      }).join("");
    }

    function renderSelects() {
      fillSelect(els.credentialAccount, state.accounts, state.selectedAccount);
      fillSelect(els.deleteCredentialAccount, state.accounts, state.selectedAccount);
      fillSelect(els.deleteAccountSelect, state.accounts, state.selectedAccount);
      fillSelect(els.connectorSelect, state.connectors, state.selectedConnector);

      const deleteAccount = els.deleteCredentialAccount.value || state.accounts[0] || "";
      const deleteConnectors = state.credentialsByAccount[deleteAccount] || [];
      fillSelect(els.deleteConnectorSelect, deleteConnectors, deleteConnectors[0] || "");
    }

    function fillSelect(select, values, selected) {
      select.innerHTML = values.length
        ? values.map(value => `<option value="${escapeHtml(value)}">${escapeHtml(value)}</option>`).join("")
        : `<option value="">无可选项</option>`;
      if (selected && values.includes(selected)) {
        select.value = selected;
      }
    }

    function renderCredentialFields() {
      const connector = els.connectorSelect.value || state.selectedConnector;
      const configMap = state.configMaps[connector] || {};
      const fields = Array.isArray(configMap)
        ? Object.fromEntries(configMap.map(name => [name, { type: "SecretStr", required: true }]))
        : configMap;

      if (!connector) {
        els.credentialFields.innerHTML = `<div class="muted">请先选择 connector。</div>`;
        return;
      }

      if (!Object.keys(fields).length) {
        els.credentialFields.innerHTML = `<div class="muted">暂无字段配置。连接真实 API 后会从 config-map 读取。</div>`;
        return;
      }

      els.credentialFields.innerHTML = Object.entries(fields).map(([field, meta]) => {
        const required = meta.required ? "必填" : "可选";
        const type = meta.type || "";
        const isSecret = /secret|key|token|passphrase/i.test(`${field} ${type}`);
        const allowedValues = meta.allowed_values || meta.allowedValues || [];
        if (allowedValues.length) {
          return `
            <div>
              <label for="field_${escapeHtml(field)}">${escapeHtml(field)} <span class="muted">(${required})</span></label>
              <select id="field_${escapeHtml(field)}" data-credential-field="${escapeHtml(field)}">
                ${allowedValues.map(value => `<option value="${escapeHtml(value)}">${escapeHtml(value)}</option>`).join("")}
              </select>
            </div>
          `;
        }
        return `
          <div>
            <label for="field_${escapeHtml(field)}">${escapeHtml(field)} <span class="muted">(${required})</span></label>
            <input id="field_${escapeHtml(field)}" data-credential-field="${escapeHtml(field)}" type="${isSecret ? "password" : "text"}" autocomplete="off">
          </div>
        `;
      }).join("");
    }

    function collectCredentialPayload() {
      const payload = {};
      document.querySelectorAll("[data-credential-field]").forEach(input => {
        payload[input.dataset.credentialField] = input.value;
      });
      return payload;
    }

    async function createAccount() {
      const account = normalizeAccountName(document.getElementById("newAccountName").value);
      if (!account) {
        setMessage(els.accountMessage, "请输入有效账户名。", "fail");
        return;
      }
      if (state.accounts.includes(account)) {
        setMessage(els.accountMessage, "账户已存在。", "fail");
        return;
      }

      if (!state.apiAvailable) {
        state.accounts = sortAccounts([...state.accounts, account]);
        state.credentialsByAccount[account] = [];
        setMessage(els.accountMessage, "账户创建成功。", "ok");
        render();
        closeModal("createAccountModal");
        return;
      }

      try {
        await apiFetch(`/accounts/add-account?account_name=${encodeURIComponent(account)}`, { method: "POST" });
        setMessage(els.accountMessage, "账户创建成功。", "ok");
        await loadData();
        closeModal("createAccountModal");
      } catch (error) {
        setMessage(els.accountMessage, `账户创建失败：${error.message}`, "fail");
      }
    }

    async function saveCredential() {
      const account = els.credentialAccount.value;
      const connector = els.connectorSelect.value;
      const payload = collectCredentialPayload();

      if (!account || !connector) {
        setMessage(els.credentialMessage, "请选择账户和 connector。", "fail");
        return;
      }

      const emptyFields = Object.entries(payload).filter(([, value]) => !String(value).trim()).map(([field]) => field);
      if (emptyFields.length) {
        setMessage(els.credentialMessage, `请填写必填字段：${emptyFields.join(", ")}`, "fail");
        return;
      }

      if (!state.apiAvailable) {
        const existing = new Set(state.credentialsByAccount[account] || []);
        existing.add(connector);
        state.credentialsByAccount[account] = [...existing].sort();
        setMessage(els.credentialMessage, "已保存。", "ok");
        render();
        closeModal("credentialModal");
        return;
      }

      try {
        setMessage(els.credentialMessage, "正在保存并验证...");
        await apiFetch(`/accounts/add-credential/${encodeURIComponent(account)}/${encodeURIComponent(connector)}`, {
          method: "POST",
          body: JSON.stringify(payload)
        });
        setMessage(els.credentialMessage, "已保存并验证。", "ok");
        clearCredentialForm();
        await loadData();
        closeModal("credentialModal");
      } catch (error) {
        setMessage(els.credentialMessage, `保存失败，凭据不可用：${error.message}`, "fail");
      }
    }

    function clearCredentialForm() {
      document.querySelectorAll("[data-credential-field]").forEach(input => {
        input.value = "";
      });
    }

    async function deleteCredential() {
      const account = els.deleteCredentialAccount.value;
      const connector = els.deleteConnectorSelect.value;
      if (!account || !connector) {
        setMessage(els.deleteMessage, "请选择要删除的凭据。", "fail");
        return;
      }

      if (!state.apiAvailable) {
        state.credentialsByAccount[account] = (state.credentialsByAccount[account] || []).filter(item => item !== connector);
        setMessage(els.deleteMessage, "凭据删除成功。", "ok");
        render();
        resetDeleteConfirms();
        closeModal("deleteCredentialModal");
        return;
      }

      try {
        await apiFetch(`/accounts/delete-credential/${encodeURIComponent(account)}/${encodeURIComponent(connector)}`, { method: "POST" });
        setMessage(els.deleteMessage, "凭据删除成功。", "ok");
        await loadData();
        resetDeleteConfirms();
        closeModal("deleteCredentialModal");
      } catch (error) {
        setMessage(els.deleteMessage, `删除失败：${error.message}`, "fail");
      }
    }

    async function deleteAccount(account = els.deleteAccountSelect.value) {
      if (!account) return;
      if (account === "master_account") {
        setMessage(els.deleteAccountMessage, "master_account 不允许删除。", "fail");
        return;
      }

      if (!state.apiAvailable) {
        state.accounts = state.accounts.filter(item => item !== account);
        delete state.credentialsByAccount[account];
        state.selectedAccount = state.accounts[0] || "";
        setMessage(els.deleteAccountMessage, "账户删除成功。", "ok");
        render();
        resetDeleteConfirms();
        closeModal("deleteAccountModal");
        return;
      }

      try {
        await apiFetch(`/accounts/delete-account?account_name=${encodeURIComponent(account)}`, { method: "POST" });
        setMessage(els.deleteAccountMessage, "账户删除成功。", "ok");
        await loadData();
        resetDeleteConfirms();
        closeModal("deleteAccountModal");
      } catch (error) {
        setMessage(els.deleteAccountMessage, `账户删除失败：${error.message}`, "fail");
      }
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    document.getElementById("openCreateAccountBtn").addEventListener("click", () => {
      setMessage(els.accountMessage, "");
      openModal("createAccountModal");
    });
    document.getElementById("createAccountBtn").addEventListener("click", createAccount);
    document.getElementById("resetAccountBtn").addEventListener("click", () => {
      document.getElementById("newAccountName").value = "";
      setMessage(els.accountMessage, "");
    });
    document.getElementById("saveCredentialBtn").addEventListener("click", saveCredential);
    document.getElementById("clearCredentialBtn").addEventListener("click", clearCredentialForm);
    document.getElementById("prepareDeleteCredentialBtn").addEventListener("click", () => {
      setMessage(els.deleteMessage, "");
      els.deleteCredentialConfirm.style.display = "block";
    });
    document.getElementById("deleteCredentialBtn").addEventListener("click", deleteCredential);
    document.getElementById("cancelDeleteCredentialBtn").addEventListener("click", () => {
      els.deleteCredentialConfirm.style.display = "none";
    });
    document.getElementById("prepareDeleteAccountBtn").addEventListener("click", () => {
      setMessage(els.deleteAccountMessage, "");
      els.deleteAccountConfirm.style.display = "block";
    });
    document.getElementById("deleteAccountBtn").addEventListener("click", () => deleteAccount());
    document.getElementById("cancelDeleteAccountBtn").addEventListener("click", () => {
      els.deleteAccountConfirm.style.display = "none";
    });

    document.querySelectorAll("[data-close-modal]").forEach(button => {
      button.addEventListener("click", () => closeModal(button.dataset.closeModal));
    });

    document.querySelectorAll(".modal-backdrop").forEach(backdrop => {
      backdrop.addEventListener("click", event => {
        if (event.target === backdrop) closeModal(backdrop.id);
      });
    });

    els.connectorSelect.addEventListener("change", async () => {
      state.selectedConnector = els.connectorSelect.value;
      await loadConfigMapForSelectedConnector();
      renderCredentialFields();
    });

    els.credentialAccount.addEventListener("change", () => {
      state.selectedAccount = els.credentialAccount.value;
      renderSelects();
    });

    els.deleteCredentialAccount.addEventListener("change", () => {
      state.selectedAccount = els.deleteCredentialAccount.value;
      renderSelects();
      resetDeleteConfirms();
    });

    els.accountsTable.addEventListener("click", event => {
      const button = event.target.closest("button");
      if (!button) return;
      const account = button.dataset.account;
      if (button.dataset.action === "select-account") {
        state.selectedAccount = account;
        renderSelects();
        renderCredentialFields();
        setMessage(els.credentialMessage, "");
        openModal("credentialModal");
      }
      if (button.dataset.action === "delete-credential") {
        state.selectedAccount = account;
        renderSelects();
        els.deleteCredentialAccount.value = account;
        renderSelects();
        resetDeleteConfirms();
        setMessage(els.deleteMessage, "");
        openModal("deleteCredentialModal");
      }
      if (button.dataset.action === "delete-account") {
        state.selectedAccount = account;
        renderSelects();
        els.deleteAccountSelect.value = account;
        resetDeleteConfirms();
        setMessage(els.deleteAccountMessage, "");
        openModal("deleteAccountModal");
      }
    });

    loadData();
  </script>
</body>
</html>
