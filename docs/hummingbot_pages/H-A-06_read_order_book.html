<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>H-A-06 读取订单簿数据</title>
  <style>
    :root { --bg:#f6f7f8; --panel:#fff; --line:#d9dde3; --text:#1f2933; --muted:#697386; --primary:#1f6feb; --danger:#c53030; --ok:#137333; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--bg); color:var(--text); font-family:Arial,"Microsoft YaHei",sans-serif; font-size:14px; line-height:1.5; }
    header { padding:18px 24px; border-bottom:1px solid var(--line); background:var(--panel); }
    h1,h2 { margin:0; font-weight:600; }
    h1 { font-size:22px; }
    h2 { margin-bottom:12px; font-size:17px; }
    main { max-width:1180px; margin:0 auto; padding:18px 18px 40px; }
    .grid { display:grid; grid-template-columns:repeat(12,1fr); gap:14px; margin-bottom:14px; }
    .panel { background:var(--panel); border:1px solid var(--line); border-radius:6px; padding:14px; }
    .span-12 { grid-column:span 12; } .span-6 { grid-column:span 6; }
    .summary { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; }
    .metric { border:1px solid var(--line); border-radius:6px; padding:10px; background:#fbfcfd; }
    .metric-label { color:var(--muted); font-size:12px; }
    .metric-value { margin-top:4px; font-size:18px; font-weight:600; }
    .toolbar { display:grid; grid-template-columns:1fr 1fr 1fr 1fr; gap:10px; margin-bottom:12px; }
    label { display:block; margin-bottom:5px; color:#344054; font-size:13px; }
    input,select { width:100%; min-height:34px; padding:7px 9px; border:1px solid #c9d1dc; border-radius:4px; background:#fff; color:var(--text); font:inherit; }
    .actions { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px; }
    button { min-height:34px; padding:7px 12px; border:1px solid #b6c2d1; border-radius:4px; background:#fff; color:var(--text); cursor:pointer; font:inherit; }
    button.primary { border-color:var(--primary); background:var(--primary); color:#fff; }
    button.danger { border-color:var(--danger); color:var(--danger); }
    table { width:100%; border-collapse:collapse; background:#fff; }
    th,td { padding:9px 8px; border-bottom:1px solid var(--line); text-align:left; vertical-align:top; }
    th { background:#f8fafc; color:#344054; font-weight:600; font-size:13px; }
    .muted { color:var(--muted); } .bid { color:var(--ok); } .ask { color:var(--danger); }
    .message { min-height:24px; margin-top:10px; color:var(--muted); }
    .message.ok { color:var(--ok); } .message.fail { color:var(--danger); }
    pre { margin:0; padding:10px; border:1px solid var(--line); border-radius:6px; background:#fbfcfd; overflow:auto; font-size:12px; }
    @media (max-width:900px){ .span-6{grid-column:span 12;} .summary,.toolbar{grid-template-columns:1fr;} }
  </style>
</head>
<body>
  <header><h1>H-A-06 读取订单簿数据</h1></header>
  <main>
    <section class="grid">
      <div class="panel span-12">
        <h2>订单簿概览</h2>
        <div class="summary">
          <div class="metric"><div class="metric-label">交易对</div><div class="metric-value" id="pairValue">-</div></div>
          <div class="metric"><div class="metric-label">Best Bid</div><div class="metric-value bid" id="bestBid">-</div></div>
          <div class="metric"><div class="metric-label">Best Ask</div><div class="metric-value ask" id="bestAsk">-</div></div>
          <div class="metric"><div class="metric-label">Spread</div><div class="metric-value" id="spreadValue">-</div></div>
        </div>
      </div>
    </section>

    <section class="grid">
      <div class="panel span-12">
        <h2>订单簿查询</h2>
        <div class="toolbar">
          <div><label for="connectorSelect">Connector</label><select id="connectorSelect"></select></div>
          <div><label for="tradingPairInput">交易对</label><input id="tradingPairInput" value="BTC-USDT"></div>
          <div><label for="depthInput">深度</label><input id="depthInput" type="number" min="1" max="1000" value="20"></div>
          <div><label for="accountInput">账户</label><select id="accountInput"></select></div>
        </div>
        <div class="actions">
          <button class="primary" id="loadBookBtn">读取订单簿</button>
          <button id="addPairBtn">添加跟踪</button>
          <button class="danger" id="removePairBtn">移除跟踪</button>
          <button id="diagnosticsBtn">诊断</button>
          <button id="restartBtn">重启 Tracker</button>
        </div>
        <div id="message" class="message"></div>
      </div>
    </section>

    <section class="grid">
      <div class="panel span-6">
        <h2>Bids</h2>
        <table><thead><tr><th>价格</th><th>数量</th><th>累计</th></tr></thead><tbody id="bidsTable"><tr><td colspan="3" class="muted">等待加载。</td></tr></tbody></table>
      </div>
      <div class="panel span-6">
        <h2>Asks</h2>
        <table><thead><tr><th>价格</th><th>数量</th><th>累计</th></tr></thead><tbody id="asksTable"><tr><td colspan="3" class="muted">等待加载。</td></tr></tbody></table>
      </div>
    </section>

    <section class="grid">
      <div class="panel span-12">
        <h2>深度计算</h2>
        <div class="toolbar">
          <div><label for="queryType">查询类型</label><select id="queryType"><option value="vwap-for-volume">VWAP for Volume</option><option value="price-for-volume">Price for Volume</option><option value="volume-for-price">Volume for Price</option><option value="price-for-quote-volume">Price for Quote Volume</option><option value="quote-volume-for-price">Quote Volume for Price</option></select></div>
          <div><label for="querySide">方向</label><select id="querySide"><option value="true">Buy</option><option value="false">Sell</option></select></div>
          <div><label for="queryValue">数值</label><input id="queryValue" type="number" value="1" step="0.0001"></div>
          <div><label>&nbsp;</label><button class="primary" id="runQueryBtn">计算</button></div>
        </div>
        <pre id="queryResult">-</pre>
      </div>
    </section>
  </main>

  <script>
    const state = { connectors: [], accounts: [], apiAvailable:false, apiConfig:loadApiConfig() };
    const els = {
      connectorSelect: document.getElementById("connectorSelect"), tradingPairInput: document.getElementById("tradingPairInput"), depthInput: document.getElementById("depthInput"), accountInput: document.getElementById("accountInput"),
      pairValue: document.getElementById("pairValue"), bestBid: document.getElementById("bestBid"), bestAsk: document.getElementById("bestAsk"), spreadValue: document.getElementById("spreadValue"),
      bidsTable: document.getElementById("bidsTable"), asksTable: document.getElementById("asksTable"), message: document.getElementById("message"),
      queryType: document.getElementById("queryType"), querySide: document.getElementById("querySide"), queryValue: document.getElementById("queryValue"), queryResult: document.getElementById("queryResult")
    };
    function loadApiConfig(){ const d={baseUrl:"http://127.0.0.1:8000",username:"admin",password:"admin",mode:"auto"}; try{return {...d,...JSON.parse(localStorage.getItem("chuanBackendConfig")||"{}")};}catch(_){return d;} }
    function authHeaders(){ return {"Authorization":`Basic ${btoa(`${state.apiConfig.username}:${state.apiConfig.password}`)}`,"Content-Type":"application/json"}; }
    async function apiFetch(path,options={}){ const base=state.apiConfig.baseUrl.replace(/\/$/,""); const r=await fetch(`${base}${path}`,{...options,headers:{...authHeaders(),...(options.headers||{})}}); if(!r.ok){let d=r.statusText; try{const b=await r.json(); d=b.detail||b.message||JSON.stringify(b);}catch(_){} throw new Error(d);} return r.json(); }
    function setMessage(text,type=""){ els.message.className=`message ${type}`; els.message.textContent=text; }
    async function loadInitial(){ state.apiConfig=loadApiConfig(); if(state.apiConfig.mode==="demo"){ useDemo(); return; } try{ const [connectors,accounts]=await Promise.all([apiFetch("/connectors/"),apiFetch("/accounts/")]); state.connectors=connectors; state.accounts=accounts; state.apiAvailable=true; fillSelects(); }catch(e){ if(state.apiConfig.mode==="api"){setMessage(`读取失败：${e.message}`,"fail");} else useDemo(); } }
    function useDemo(){ state.connectors=["binance","binance_perpetual","okx"]; state.accounts=["master_account","paper_account"]; state.apiAvailable=false; fillSelects(); renderBook({trading_pair:"BTC-USDT",timestamp:Date.now()/1000,bids:[[65000,0.5],[64990,1.2],[64980,2]],asks:[[65010,0.4],[65020,1.1],[65030,2.4]]}); }
    function fillSelects(){ fill(els.connectorSelect,state.connectors); fill(els.accountInput,state.accounts,"无"); }
    function fill(select,values,empty="选择"){ select.innerHTML=`<option value="">${empty}</option>`+values.map(v=>`<option value="${escapeHtml(v)}">${escapeHtml(v)}</option>`).join(""); if(values.length && !select.value) select.value=values[0]; }
    function payload(){ return {connector_name:els.connectorSelect.value,trading_pair:els.tradingPairInput.value.trim().toUpperCase(),depth:Number(els.depthInput.value||20)}; }
    async function loadBook(){ if(!state.apiAvailable){useDemo(); return;} try{setMessage("读取中..."); const data=await apiFetch("/market-data/order-book",{method:"POST",body:JSON.stringify(payload())}); renderBook(data); setMessage("已读取。","ok");}catch(e){setMessage(`读取失败：${e.message}`,"fail");} }
    function renderBook(data){ const bids=(data.bids||[]).map(x=>Array.isArray(x)?{price:x[0],amount:x[1]}:x); const asks=(data.asks||[]).map(x=>Array.isArray(x)?{price:x[0],amount:x[1]}:x); els.pairValue.textContent=data.trading_pair||payload().trading_pair; els.bestBid.textContent=bids[0]?fmt(bids[0].price):"-"; els.bestAsk.textContent=asks[0]?fmt(asks[0].price):"-"; els.spreadValue.textContent=(bids[0]&&asks[0])?fmt(Number(asks[0].price)-Number(bids[0].price)):"-"; els.bidsTable.innerHTML=rows(bids,"bid"); els.asksTable.innerHTML=rows(asks,"ask"); }
    function rows(levels,cls){ let cum=0; return levels.length?levels.map(l=>{cum+=Number(l.amount||0); return `<tr><td class="${cls}">${fmt(l.price)}</td><td>${fmt(l.amount)}</td><td>${fmt(cum)}</td></tr>`;}).join(""):`<tr><td colspan="3" class="muted">暂无数据。</td></tr>`; }
    async function addPair(){ await pairAction("/market-data/trading-pair/add",{...payload(),account_name:els.accountInput.value||null,timeout:30}); }
    async function removePair(){ await pairAction("/market-data/trading-pair/remove",{connector_name:payload().connector_name,trading_pair:payload().trading_pair,account_name:els.accountInput.value||null}); }
    async function pairAction(path,body){ if(!state.apiAvailable){setMessage("示例模式。","ok"); return;} try{const r=await apiFetch(path,{method:"POST",body:JSON.stringify(body)}); setMessage(r.message||"完成。","ok");}catch(e){setMessage(`失败：${e.message}`,"fail");} }
    async function diagnostics(){ if(!state.apiAvailable){els.queryResult.textContent=JSON.stringify({status:"running",trading_pairs:[payload().trading_pair]},null,2); return;} try{const q=els.accountInput.value?`?account_name=${encodeURIComponent(els.accountInput.value)}`:""; els.queryResult.textContent=JSON.stringify(await apiFetch(`/market-data/order-book/diagnostics/${encodeURIComponent(payload().connector_name)}${q}`),null,2);}catch(e){els.queryResult.textContent=`失败：${e.message}`;} }
    async function restart(){ if(!state.apiAvailable){setMessage("示例模式。","ok"); return;} try{const q=els.accountInput.value?`?account_name=${encodeURIComponent(els.accountInput.value)}`:""; const r=await apiFetch(`/market-data/order-book/restart/${encodeURIComponent(payload().connector_name)}${q}`,{method:"POST"}); setMessage(r.message||"已重启。","ok");}catch(e){setMessage(`重启失败：${e.message}`,"fail");} }
    async function runQuery(){ const type=els.queryType.value; const value=Number(els.queryValue.value); const body={connector_name:payload().connector_name,trading_pair:payload().trading_pair,is_buy:els.querySide.value==="true"}; if(type.includes("price-for-volume")||type==="vwap-for-volume") body.volume=value; else if(type.includes("quote-volume")) body.quote_volume=value; else body.price=value; if(type==="quote-volume-for-price") {delete body.quote_volume; body.price=value;} if(!state.apiAvailable){els.queryResult.textContent=JSON.stringify({...body,average_price:65005,result_price:65010,timestamp:Date.now()/1000},null,2); return;} try{els.queryResult.textContent=JSON.stringify(await apiFetch(`/market-data/order-book/${type}`,{method:"POST",body:JSON.stringify(body)}),null,2);}catch(e){els.queryResult.textContent=`失败：${e.message}`;} }
    function fmt(v){ return Number(v||0).toLocaleString("en-US",{maximumFractionDigits:8}); }
    function escapeHtml(v){ return String(v).replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;"); }
    document.getElementById("loadBookBtn").addEventListener("click",loadBook); document.getElementById("addPairBtn").addEventListener("click",addPair); document.getElementById("removePairBtn").addEventListener("click",removePair); document.getElementById("diagnosticsBtn").addEventListener("click",diagnostics); document.getElementById("restartBtn").addEventListener("click",restart); document.getElementById("runQueryBtn").addEventListener("click",runQuery);
    loadInitial();
  </script>
</body>
</html>
