<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>H-A-05 读取实时行情</title>
  <style>
    :root {
      --bg: #f6f7f8;
      --panel: #ffffff;
      --line: #d9dde3;
      --text: #1f2933;
      --muted: #697386;
      --primary: #1f6feb;
      --danger: #c53030;
      --ok: #137333;
      --warn: #8a5a00;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, "Microsoft YaHei", sans-serif;
      font-size: 14px;
      line-height: 1.5;
    }

    header {
      padding: 18px 24px;
      border-bottom: 1px solid var(--line);
      background: var(--panel);
    }

    h1, h2 {
      margin: 0;
      font-weight: 600;
    }

    h1 { font-size: 22px; }

    h2 {
      margin-bottom: 12px;
      font-size: 17px;
    }

    main {
      max-width: 1180px;
      margin: 0 auto;
      padding: 18px 18px 40px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(12, 1fr);
      gap: 14px;
      margin-bottom: 14px;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 14px;
    }

    .span-12 { grid-column: span 12; }

    .summary {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }

    .metric {
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 10px;
      background: #fbfcfd;
    }

    .metric-label {
      color: var(--muted);
      font-size: 12px;
    }

    .metric-value {
      margin-top: 4px;
      font-size: 18px;
      font-weight: 600;
    }

    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
    }

    .section-header h2 { margin-bottom: 0; }

    .toolbar {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 10px;
      margin-bottom: 12px;
    }

    label {
      display: block;
      margin-bottom: 5px;
      color: #344054;
      font-size: 13px;
    }

    input, select {
      width: 100%;
      min-height: 34px;
      padding: 7px 9px;
      border: 1px solid #c9d1dc;
      border-radius: 4px;
      background: #fff;
      color: var(--text);
      font: inherit;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    button {
      min-height: 34px;
      padding: 7px 12px;
      border: 1px solid #b6c2d1;
      border-radius: 4px;
      background: #fff;
      color: var(--text);
      cursor: pointer;
      font: inherit;
    }

    button.primary {
      border-color: var(--primary);
      background: var(--primary);
      color: #fff;
    }

    button.danger {
      border-color: var(--danger);
      color: var(--danger);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: #fff;
    }

    th, td {
      padding: 9px 8px;
      border-bottom: 1px solid var(--line);
      text-align: left;
      vertical-align: top;
    }

    th {
      background: #f8fafc;
      color: #344054;
      font-weight: 600;
      font-size: 13px;
    }

    .muted { color: var(--muted); }
    .positive { color: var(--ok); }
    .negative { color: var(--danger); }

    .message {
      min-height: 24px;
      margin-top: 10px;
      color: var(--muted);
    }

    .message.ok { color: var(--ok); }
    .message.fail { color: var(--danger); }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 18px;
      background: rgba(17, 24, 39, 0.42);
    }

    .modal-backdrop.open { display: flex; }

    .modal {
      width: min(820px, 100%);
      max-height: calc(100vh - 36px);
      overflow: auto;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 14px;
      box-shadow: 0 18px 44px rgba(15, 23, 42, 0.22);
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
    }

    .modal-header h2 { margin-bottom: 0; }

    .modal-close {
      min-width: 34px;
      padding: 4px 9px;
    }

    pre {
      margin: 0;
      padding: 10px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #fbfcfd;
      overflow: auto;
      font-size: 12px;
    }

    @media (max-width: 900px) {
      .summary, .toolbar {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>H-A-05 读取实时行情</h1>
  </header>

  <main>
    <section class="grid">
      <div class="panel span-12">
        <h2>行情概览</h2>
        <div class="summary">
          <div class="metric">
            <div class="metric-label">观察交易对</div>
            <div class="metric-value" id="watchCount">0</div>
          </div>
          <div class="metric">
            <div class="metric-label">Connector 数</div>
            <div class="metric-value" id="connectorCount">0</div>
          </div>
          <div class="metric">
            <div class="metric-label">已返回价格</div>
            <div class="metric-value" id="pricedCount">0</div>
          </div>
          <div class="metric">
            <div class="metric-label">最近更新</div>
            <div class="metric-value" id="lastUpdate">-</div>
          </div>
        </div>
      </div>
    </section>

    <section class="grid">
      <div class="panel span-12">
        <div class="section-header">
          <h2>行情列表</h2>
          <button class="primary" id="openAddMarketBtn">添加行情</button>
        </div>
        <div class="toolbar">
          <div>
            <label for="connectorFilter">Connector</label>
            <select id="connectorFilter"></select>
          </div>
          <div>
            <label for="pairSearch">交易对</label>
            <input id="pairSearch" placeholder="BTC-USDT">
          </div>
          <div>
            <label for="typeFilter">类型</label>
            <select id="typeFilter">
              <option value="">全部</option>
              <option value="spot">现货</option>
              <option value="perpetual">永续</option>
            </select>
          </div>
        </div>
        <table>
          <thead>
            <tr>
              <th>Connector</th>
              <th>交易对</th>
              <th>类型</th>
              <th>价格</th>
              <th>更新时间</th>
              <th>操作</th>
            </tr>
          </thead>
          <tbody id="marketTable">
            <tr><td colspan="6" class="muted">等待加载。</td></tr>
          </tbody>
        </table>
        <div id="message" class="message"></div>
      </div>
    </section>
  </main>

  <div class="modal-backdrop" id="addMarketModal">
    <div class="modal">
      <div class="modal-header">
        <h2>添加行情</h2>
        <button class="modal-close" data-close-modal="addMarketModal">×</button>
      </div>
      <div class="toolbar" style="grid-template-columns:1fr 1fr 1fr;">
        <div>
          <label for="newConnector">Connector</label>
          <select id="newConnector"></select>
        </div>
        <div>
          <label for="newTradingPair">交易对</label>
          <input id="newTradingPair" placeholder="BTC-USDT">
        </div>
        <div>
          <label for="newInterval">K线周期</label>
          <select id="newInterval">
            <option value="1m">1m</option>
            <option value="5m">5m</option>
            <option value="15m">15m</option>
            <option value="1h">1h</option>
            <option value="4h">4h</option>
            <option value="1d">1d</option>
          </select>
        </div>
      </div>
      <div class="actions">
        <button class="primary" id="addMarketBtn">添加</button>
      </div>
      <div id="addMarketMessage" class="message"></div>
    </div>
  </div>

  <div class="modal-backdrop" id="candlesModal">
    <div class="modal">
      <div class="modal-header">
        <h2 id="candlesTitle">K线</h2>
        <button class="modal-close" data-close-modal="candlesModal">×</button>
      </div>
      <table>
        <thead>
          <tr>
            <th>时间</th>
            <th>Open</th>
            <th>High</th>
            <th>Low</th>
            <th>Close</th>
            <th>Volume</th>
          </tr>
        </thead>
        <tbody id="candlesTable"></tbody>
      </table>
      <div id="candlesMessage" class="message"></div>
    </div>
  </div>

  <div class="modal-backdrop" id="fundingModal">
    <div class="modal">
      <div class="modal-header">
        <h2 id="fundingTitle">资金费率</h2>
        <button class="modal-close" data-close-modal="fundingModal">×</button>
      </div>
      <pre id="fundingView">-</pre>
      <div id="fundingMessage" class="message"></div>
    </div>
  </div>

  <script>
    const defaultWatchlist = [
      { connector: "binance", tradingPair: "BTC-USDT", interval: "1m" },
      { connector: "binance", tradingPair: "ETH-USDT", interval: "1m" },
      { connector: "binance_perpetual", tradingPair: "BTC-USDT", interval: "1m" }
    ];

    const demoPrices = {
      "binance:BTC-USDT": 65000,
      "binance:ETH-USDT": 3200,
      "binance_perpetual:BTC-USDT": 65020
    };

    const state = {
      connectors: [],
      candleConnectors: [],
      watchlist: loadWatchlist(),
      prices: {},
      lastTimestamp: null,
      apiAvailable: false,
      apiConfig: loadApiConfig()
    };

    const els = {
      watchCount: document.getElementById("watchCount"),
      connectorCount: document.getElementById("connectorCount"),
      pricedCount: document.getElementById("pricedCount"),
      lastUpdate: document.getElementById("lastUpdate"),
      connectorFilter: document.getElementById("connectorFilter"),
      pairSearch: document.getElementById("pairSearch"),
      typeFilter: document.getElementById("typeFilter"),
      marketTable: document.getElementById("marketTable"),
      message: document.getElementById("message"),
      newConnector: document.getElementById("newConnector"),
      newTradingPair: document.getElementById("newTradingPair"),
      newInterval: document.getElementById("newInterval"),
      addMarketMessage: document.getElementById("addMarketMessage"),
      candlesTitle: document.getElementById("candlesTitle"),
      candlesTable: document.getElementById("candlesTable"),
      candlesMessage: document.getElementById("candlesMessage"),
      fundingTitle: document.getElementById("fundingTitle"),
      fundingView: document.getElementById("fundingView"),
      fundingMessage: document.getElementById("fundingMessage")
    };

    function loadApiConfig() {
      const defaults = {
        baseUrl: "http://127.0.0.1:8000",
        username: "admin",
        password: "admin",
        mode: "auto"
      };
      try {
        return { ...defaults, ...JSON.parse(localStorage.getItem("chuanBackendConfig") || "{}") };
      } catch (_) {
        return defaults;
      }
    }

    function loadWatchlist() {
      try {
        return JSON.parse(localStorage.getItem("chuanMarketWatchlist") || "null") || defaultWatchlist;
      } catch (_) {
        return defaultWatchlist;
      }
    }

    function saveWatchlist() {
      localStorage.setItem("chuanMarketWatchlist", JSON.stringify(state.watchlist));
    }

    function authHeaders() {
      return {
        "Authorization": `Basic ${btoa(`${state.apiConfig.username}:${state.apiConfig.password}`)}`,
        "Content-Type": "application/json"
      };
    }

    async function apiFetch(path, options = {}) {
      const base = state.apiConfig.baseUrl.replace(/\/$/, "");
      const response = await fetch(`${base}${path}`, {
        ...options,
        headers: { ...authHeaders(), ...(options.headers || {}) }
      });
      if (!response.ok) {
        let detail = response.statusText;
        try {
          const body = await response.json();
          detail = body.detail || body.message || JSON.stringify(body);
        } catch (_) {}
        throw new Error(detail);
      }
      return response.json();
    }

    function setMessage(element, text, type = "") {
      element.className = `message ${type}`;
      element.textContent = text;
    }

    async function loadInitialData() {
      state.apiConfig = loadApiConfig();
      if (state.apiConfig.mode === "demo") {
        useDemoData();
        return;
      }

      try {
        const [connectors, candleConnectors] = await Promise.all([
          apiFetch("/connectors/"),
          apiFetch("/market-data/available-candle-connectors")
        ]);
        state.connectors = prioritizeConnectors(connectors);
        state.candleConnectors = candleConnectors;
        state.apiAvailable = true;
        fillSelects();
        await loadPrices();
      } catch (error) {
        if (state.apiConfig.mode === "api") {
          state.connectors = [];
          state.candleConnectors = [];
          state.prices = {};
          state.apiAvailable = false;
          setMessage(els.message, `读取失败：${error.message}`, "fail");
          fillSelects();
          render();
        } else {
          useDemoData();
        }
      }
    }

    function useDemoData() {
      state.connectors = ["binance", "binance_perpetual", "okx", "okx_perpetual"];
      state.candleConnectors = ["binance", "binance_perpetual", "okx"];
      state.prices = { ...demoPrices };
      state.lastTimestamp = Date.now() / 1000;
      state.apiAvailable = false;
      fillSelects();
      render();
    }

    async function loadPrices() {
      if (!state.apiAvailable) {
        useDemoData();
        return;
      }

      try {
        const grouped = {};
        state.watchlist.forEach(item => {
          if (!grouped[item.connector]) grouped[item.connector] = [];
          grouped[item.connector].push(item.tradingPair);
        });

        const results = await Promise.all(Object.entries(grouped).map(async ([connector, tradingPairs]) => {
          return apiFetch("/market-data/prices", {
            method: "POST",
            body: JSON.stringify({ connector_name: connector, trading_pairs: [...new Set(tradingPairs)] })
          });
        }));

        const prices = {};
        results.forEach(result => {
          Object.entries(result.prices || {}).forEach(([pair, price]) => {
            prices[`${result.connector}:${pair}`] = price;
          });
          state.lastTimestamp = result.timestamp || Date.now() / 1000;
        });
        state.prices = prices;
        render();
        setMessage(els.message, "已读取。", "ok");
      } catch (error) {
        setMessage(els.message, `读取失败：${error.message}`, "fail");
      }
    }

    function prioritizeConnectors(connectors) {
      const preferred = ["binance", "binance_perpetual", "okx", "okx_perpetual", "kucoin", "bybit_perpetual"];
      const set = new Set(connectors);
      return [
        ...preferred.filter(name => set.has(name)),
        ...connectors.filter(name => !preferred.includes(name)).sort()
      ];
    }

    function fillSelects() {
      const connectorValues = [...new Set([...state.connectors, ...state.watchlist.map(item => item.connector)])].sort();
      fillSelect(els.connectorFilter, connectorValues, "全部");
      fillSelect(els.newConnector, connectorValues, "选择");
    }

    function fillSelect(select, values, emptyLabel) {
      const current = select.value;
      select.innerHTML = `<option value="">${emptyLabel}</option>` + values.map(value => `<option value="${escapeHtml(value)}">${escapeHtml(value)}</option>`).join("");
      if (values.includes(current)) select.value = current;
    }

    function filteredWatchlist() {
      const connector = els.connectorFilter.value;
      const pair = els.pairSearch.value.trim().toLowerCase();
      const type = els.typeFilter.value;
      return state.watchlist.filter(item => {
        if (connector && item.connector !== connector) return false;
        if (pair && !item.tradingPair.toLowerCase().includes(pair)) return false;
        if (type === "spot" && item.connector.includes("perpetual")) return false;
        if (type === "perpetual" && !item.connector.includes("perpetual")) return false;
        return true;
      });
    }

    function render() {
      renderSummary();
      renderTable();
    }

    function renderSummary() {
      const rows = filteredWatchlist();
      const connectors = new Set(rows.map(item => item.connector));
      const priced = rows.filter(item => state.prices[priceKey(item)] !== undefined).length;
      els.watchCount.textContent = rows.length;
      els.connectorCount.textContent = connectors.size;
      els.pricedCount.textContent = priced;
      els.lastUpdate.textContent = state.lastTimestamp ? new Date(state.lastTimestamp * 1000).toLocaleTimeString() : "-";
    }

    function renderTable() {
      const rows = filteredWatchlist();
      if (!rows.length) {
        els.marketTable.innerHTML = `<tr><td colspan="6" class="muted">暂无行情。</td></tr>`;
        return;
      }

      els.marketTable.innerHTML = rows.map((item, index) => {
        const price = state.prices[priceKey(item)];
        const isPerp = item.connector.includes("perpetual");
        return `
          <tr>
            <td>${escapeHtml(item.connector)}</td>
            <td><strong>${escapeHtml(item.tradingPair)}</strong></td>
            <td>${isPerp ? "永续" : "现货"}</td>
            <td>${price === undefined ? "-" : formatNumber(price)}</td>
            <td>${state.lastTimestamp ? new Date(state.lastTimestamp * 1000).toLocaleTimeString() : "-"}</td>
            <td>
              <button data-action="candles" data-index="${index}">K线</button>
              <button data-action="funding" data-index="${index}" ${isPerp ? "" : "disabled"}>资金费率</button>
              <button class="danger" data-action="remove" data-index="${index}">删除</button>
            </td>
          </tr>
        `;
      }).join("");
    }

    function addMarket() {
      const connector = els.newConnector.value;
      const tradingPair = els.newTradingPair.value.trim().toUpperCase();
      const interval = els.newInterval.value;
      if (!connector || !tradingPair) {
        setMessage(els.addMarketMessage, "请选择 connector 并输入交易对。", "fail");
        return;
      }
      if (!tradingPair.includes("-")) {
        setMessage(els.addMarketMessage, "交易对格式应为 BASE-QUOTE。", "fail");
        return;
      }
      const exists = state.watchlist.some(item => item.connector === connector && item.tradingPair === tradingPair);
      if (!exists) {
        state.watchlist.push({ connector, tradingPair, interval });
        saveWatchlist();
      }
      setMessage(els.addMarketMessage, "已添加。", "ok");
      closeModal("addMarketModal");
      loadPrices();
    }

    async function openCandles(item) {
      els.candlesTitle.textContent = `${item.connector} ${item.tradingPair}`;
      els.candlesTable.innerHTML = `<tr><td colspan="6" class="muted">读取中。</td></tr>`;
      setMessage(els.candlesMessage, "");
      openModal("candlesModal");

      if (!state.apiAvailable) {
        renderCandles([
          { timestamp: Date.now() / 1000 - 120, open: 64900, high: 65100, low: 64850, close: 65000, volume: 125.2 },
          { timestamp: Date.now() / 1000 - 60, open: 65000, high: 65220, low: 64980, close: 65080, volume: 98.4 },
          { timestamp: Date.now() / 1000, open: 65080, high: 65150, low: 65010, close: 65020, volume: 76.1 }
        ]);
        return;
      }

      try {
        const candles = await apiFetch("/market-data/candles", {
          method: "POST",
          body: JSON.stringify({
            connector_name: item.connector,
            trading_pair: item.tradingPair,
            interval: item.interval || "1m",
            max_records: 20
          })
        });
        renderCandles(candles);
        setMessage(els.candlesMessage, "已读取。", "ok");
      } catch (error) {
        els.candlesTable.innerHTML = `<tr><td colspan="6" class="muted">读取失败。</td></tr>`;
        setMessage(els.candlesMessage, `读取失败：${error.message}`, "fail");
      }
    }

    function renderCandles(candles) {
      const rows = [...candles].slice(-20).reverse();
      els.candlesTable.innerHTML = rows.length
        ? rows.map(candle => `
          <tr>
            <td>${formatTime(candle.timestamp)}</td>
            <td>${formatNumber(candle.open)}</td>
            <td>${formatNumber(candle.high)}</td>
            <td>${formatNumber(candle.low)}</td>
            <td>${formatNumber(candle.close)}</td>
            <td>${formatNumber(candle.volume)}</td>
          </tr>
        `).join("")
        : `<tr><td colspan="6" class="muted">暂无 K线。</td></tr>`;
    }

    async function openFunding(item) {
      els.fundingTitle.textContent = `${item.connector} ${item.tradingPair}`;
      els.fundingView.textContent = "-";
      setMessage(els.fundingMessage, "");
      openModal("fundingModal");

      if (!state.apiAvailable) {
        els.fundingView.textContent = JSON.stringify({
          trading_pair: item.tradingPair,
          funding_rate: 0.0001,
          next_funding_time: Date.now() / 1000 + 3600,
          mark_price: state.prices[priceKey(item)] || 65000,
          index_price: state.prices[priceKey(item)] || 65000
        }, null, 2);
        setMessage(els.fundingMessage, "已读取。", "ok");
        return;
      }

      try {
        const result = await apiFetch("/market-data/funding-info", {
          method: "POST",
          body: JSON.stringify({ connector_name: item.connector, trading_pair: item.tradingPair })
        });
        els.fundingView.textContent = JSON.stringify(result, null, 2);
        setMessage(els.fundingMessage, "已读取。", "ok");
      } catch (error) {
        setMessage(els.fundingMessage, `读取失败：${error.message}`, "fail");
      }
    }

    function removeMarket(item) {
      state.watchlist = state.watchlist.filter(row => !(row.connector === item.connector && row.tradingPair === item.tradingPair));
      saveWatchlist();
      render();
    }

    function priceKey(item) {
      return `${item.connector}:${item.tradingPair}`;
    }

    function openModal(id) {
      const modal = document.getElementById(id);
      if (modal) modal.classList.add("open");
    }

    function closeModal(id) {
      const modal = document.getElementById(id);
      if (modal) modal.classList.remove("open");
    }

    function formatNumber(value) {
      if (value === null || value === undefined || Number.isNaN(Number(value))) return "-";
      return Number(value).toLocaleString("en-US", { maximumFractionDigits: 8 });
    }

    function formatTime(value) {
      if (!value) return "-";
      const time = typeof value === "number" && value < 10000000000 ? value * 1000 : value;
      return new Date(time).toLocaleString();
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    document.getElementById("openAddMarketBtn").addEventListener("click", () => {
      setMessage(els.addMarketMessage, "");
      fillSelects();
      openModal("addMarketModal");
    });
    document.getElementById("addMarketBtn").addEventListener("click", addMarket);

    els.connectorFilter.addEventListener("change", render);
    els.pairSearch.addEventListener("input", render);
    els.typeFilter.addEventListener("change", render);

    els.marketTable.addEventListener("click", event => {
      const button = event.target.closest("button");
      if (!button) return;
      const item = filteredWatchlist()[Number(button.dataset.index)];
      if (!item) return;
      if (button.dataset.action === "candles") openCandles(item);
      if (button.dataset.action === "funding") openFunding(item);
      if (button.dataset.action === "remove") removeMarket(item);
    });

    document.querySelectorAll("[data-close-modal]").forEach(button => {
      button.addEventListener("click", () => closeModal(button.dataset.closeModal));
    });

    document.querySelectorAll(".modal-backdrop").forEach(backdrop => {
      backdrop.addEventListener("click", event => {
        if (event.target === backdrop) closeModal(backdrop.id);
      });
    });

    loadInitialData();
  </script>
</body>
</html>
