<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>H-B-03 执行市价单</title>
<style>:root{--bg:#f6f7f8;--panel:#fff;--line:#d9dde3;--text:#1f2933;--muted:#697386;--primary:#1f6feb;--danger:#c53030;--ok:#137333}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,"Microsoft YaHei",sans-serif;font-size:14px}header{padding:18px 24px;border-bottom:1px solid var(--line);background:#fff}h1,h2{margin:0;font-weight:600}h1{font-size:22px}h2{font-size:17px;margin-bottom:12px}main{max-width:900px;margin:0 auto;padding:18px}.panel{background:#fff;border:1px solid var(--line);border-radius:6px;padding:14px;margin-bottom:14px}.form{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}label{display:block;margin-bottom:5px;color:#344054;font-size:13px}input,select{width:100%;min-height:34px;padding:7px 9px;border:1px solid #c9d1dc;border-radius:4px;font:inherit}button{min-height:34px;padding:7px 12px;border:1px solid var(--primary);border-radius:4px;background:var(--primary);color:#fff;cursor:pointer;margin-top:12px}.message{min-height:24px;margin-top:10px;color:var(--muted)}.ok{color:var(--ok)}.fail{color:var(--danger)}pre{padding:10px;border:1px solid var(--line);border-radius:6px;background:#fbfcfd;overflow:auto}@media(max-width:900px){.form{grid-template-columns:1fr}}</style></head>
<body><header><h1>H-B-03 执行市价单</h1></header><main><div class="panel"><h2>市价单</h2><div class="form"><div><label>账户</label><input id="account" value="master_account"></div><div><label>Connector</label><input id="connector" value="binance_perpetual"></div><div><label>交易对</label><input id="pair" value="BTC-USDT"></div><div><label>方向</label><select id="side"><option>BUY</option><option>SELL</option></select></div><div><label>数量</label><input id="amount" value="0.01"></div><div><label>Position Action</label><select id="positionAction"><option>OPEN</option><option>CLOSE</option></select></div></div><button id="submitBtn">提交市价单</button><div id="message" class="message"></div></div><div class="panel"><h2>结果</h2><pre id="view">-</pre></div><script>
const e=Object.fromEntries(["account","connector","pair","side","amount","positionAction","message","view"].map(id=>[id,document.getElementById(id)]));const api=loadApiConfig();function loadApiConfig(){const d={baseUrl:"http://127.0.0.1:8000",username:"admin",password:"admin",mode:"auto"};try{return{...d,...JSON.parse(localStorage.getItem("chuanBackendConfig")||"{}")};}catch(_){return d;}}function headers(){return{"Authorization":`Basic ${btoa(`${api.username}:${api.password}`)}`,"Content-Type":"application/json"};}async function apiFetch(p,o={}){const r=await fetch(`${api.baseUrl.replace(/\/$/,"")}${p}`,{...o,headers:{...headers(),...(o.headers||{})}});if(!r.ok){let d=r.statusText;try{const b=await r.json();d=b.detail||b.message||JSON.stringify(b)}catch(_){}throw new Error(d)}return r.json()}function body(){return{account_name:e.account.value,connector_name:e.connector.value,trading_pair:e.pair.value.trim().toUpperCase(),trade_type:e.side.value,amount:e.amount.value,order_type:"MARKET",price:null,position_action:e.positionAction.value};}async function submit(){const payload=body();if(api.mode==="demo"){e.view.textContent=JSON.stringify({dry_run:true,request:payload},null,2);return;}try{e.view.textContent=JSON.stringify(await apiFetch("/trading/orders",{method:"POST",body:JSON.stringify(payload)}),null,2);e.message.textContent="订单已提交。";e.message.className="message ok";}catch(err){e.message.textContent=`提交失败：${err.message}`;e.message.className="message fail";}}document.getElementById("submitBtn").addEventListener("click",submit);
</script></main></body></html>
