<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>H-C-07 止损止盈时间退出</title>
<style>:root{--bg:#f6f7f8;--panel:#fff;--line:#d9dde3;--text:#1f2933;--muted:#697386;--primary:#1f6feb;--danger:#c53030;--ok:#137333}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,"Microsoft YaHei",sans-serif;font-size:14px;line-height:1.5}header{padding:18px 24px;border-bottom:1px solid var(--line);background:#fff}h1,h2{margin:0;font-weight:600}h1{font-size:22px}h2{font-size:17px;margin-bottom:12px}main{max-width:1180px;margin:0 auto;padding:18px}.panel{background:#fff;border:1px solid var(--line);border-radius:6px;padding:14px;margin-bottom:14px}.form{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;align-items:end}label{display:block;margin-bottom:5px;color:#344054;font-size:13px}input,select{width:100%;min-height:34px;padding:7px 9px;border:1px solid #c9d1dc;border-radius:4px;font:inherit}button{min-height:34px;padding:7px 12px;border:1px solid var(--primary);border-radius:4px;background:var(--primary);color:#fff;cursor:pointer}button.secondary{border-color:#b6c2d1;background:#fff;color:var(--text)}button.danger{border-color:var(--danger);background:var(--danger);color:#fff}table{width:100%;border-collapse:collapse}th,td{padding:8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}th{background:#f8fafc;color:#344054;font-size:13px}.message{min-height:24px;margin-top:10px;color:var(--muted)}.ok{color:var(--ok)}.fail{color:var(--danger)}pre{padding:10px;border:1px solid var(--line);border-radius:6px;background:#fbfcfd;overflow:auto}@media(max-width:900px){.form{grid-template-columns:1fr}}</style></head>
<body><header><h1>H-C-07 止损止盈时间退出</h1></header><main>
<section class="panel"><h2>Executor 退出</h2><div class="form"><div><label>账户</label><input id="account" value="master_account"></div><div><label>Connector</label><input id="connector" value="binance_perpetual"></div><div><label>交易对</label><input id="pair" value="BTC-USDT"></div><div><label>类型</label><select id="type"><option value="position_executor">position_executor</option><option value="grid_executor">grid_executor</option><option value="dca_executor">dca_executor</option></select></div><div><button id="loadBtn">查询 Executor</button></div></div><div id="message" class="message"></div></section>
<section class="panel"><h2>退出规则预览</h2><div class="form"><div><label>止损</label><input id="stopLoss" value="0.02"></div><div><label>止盈</label><input id="takeProfit" value="0.04"></div><div><label>时间退出 秒</label><input id="timeLimit" value="3600"></div><div><label>停止后保留仓位</label><select id="keepPosition"><option value="false">false</option><option value="true">true</option></select></div><div><button id="previewBtn">生成预览</button></div></div><pre id="preview">-</pre></section>
<section class="panel"><h2>Executor</h2><table><thead><tr><th>ID</th><th>类型</th><th>交易对</th><th>状态</th><th>PnL</th><th>操作</th></tr></thead><tbody id="rows"><tr><td colspan="6">-</td></tr></tbody></table></section>
<section class="panel"><h2>结果</h2><pre id="resultView">-</pre></section>
<script>
const e=Object.fromEntries(["account","connector","pair","type","stopLoss","takeProfit","timeLimit","keepPosition","message","preview","rows","resultView"].map(id=>[id,document.getElementById(id)]));const api=cfg();let current=[];function cfg(){const d={baseUrl:"http://127.0.0.1:8000",username:"admin",password:"admin",mode:"auto"};try{return{...d,...JSON.parse(localStorage.getItem("chuanBackendConfig")||"{}")}}catch(_){return d}}function headers(){return{"Authorization":`Basic ${btoa(`${api.username}:${api.password}`)}`,"Content-Type":"application/json"}}async function apiFetch(p,o={}){const r=await fetch(`${api.baseUrl.replace(/\/$/,"")}${p}`,{...o,headers:{...headers(),...(o.headers||{})}});if(!r.ok){let d=r.statusText;try{const b=await r.json();d=b.detail||b.message||JSON.stringify(b)}catch(_){}throw new Error(d)}return r.json()}function list(v){return String(v||"").split(",").map(x=>x.trim()).filter(Boolean)}function preview(){e.preview.textContent=JSON.stringify({triple_barrier_config:{stop_loss:e.stopLoss.value,take_profit:e.takeProfit.value,time_limit:Number(e.timeLimit.value),open_order_type:"LIMIT",take_profit_order_type:"MARKET",stop_loss_order_type:"MARKET",time_limit_order_type:"MARKET"},stop_request:{keep_position:e.keepPosition.value==="true"}},null,2)}async function load(){if(api.mode==="demo"){current=[{executor_id:"demo-executor",executor_type:e.type.value,trading_pair:e.pair.value,status:"RUNNING",net_pnl_quote:0}];render();return}try{const res=await apiFetch("/executors/search",{method:"POST",body:JSON.stringify({account_names:list(e.account.value),connector_names:list(e.connector.value),trading_pairs:list(e.pair.value.toUpperCase()),executor_types:[e.type.value],limit:100})});current=res.data||[];render();e.message.textContent="已查询。";e.message.className="message ok"}catch(err){e.message.textContent=`查询失败：${err.message}`;e.message.className="message fail"}}async function stopExec(i){const id=current[i].executor_id||current[i].id;if(api.mode==="demo"){e.resultView.textContent=JSON.stringify({dry_run:true,executor_id:id,keep_position:e.keepPosition.value==="true"},null,2);return}try{e.resultView.textContent=JSON.stringify(await apiFetch(`/executors/${encodeURIComponent(id)}/stop`,{method:"POST",body:JSON.stringify({keep_position:e.keepPosition.value==="true"})}),null,2);e.message.textContent="已提交停止。";e.message.className="message ok";await load()}catch(err){e.message.textContent=`停止失败：${err.message}`;e.message.className="message fail"}}function render(){e.rows.innerHTML=current.length?current.map((r,i)=>`<tr><td>${h(r.executor_id||r.id)}</td><td>${h(r.executor_type||r.type)}</td><td>${h(r.trading_pair)}</td><td>${h(r.status)}</td><td>${h(r.net_pnl_quote||r.pnl_quote||0)}</td><td><button class="danger" onclick="stopExec(${i})">停止</button></td></tr>`).join(""):`<tr><td colspan="6">暂无 Executor。</td></tr>`}function h(v){return String(v??"-").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;")}document.getElementById("loadBtn").addEventListener("click",load);document.getElementById("previewBtn").addEventListener("click",preview);preview();load();
</script></main></body></html>
