<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>H-B-01 接收 OrderIntent</title>
  <style>
    :root{--bg:#f6f7f8;--panel:#fff;--line:#d9dde3;--text:#1f2933;--muted:#697386;--primary:#1f6feb;--danger:#c53030;--ok:#137333;}*{box-sizing:border-box;}body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,"Microsoft YaHei",sans-serif;font-size:14px;}header{padding:18px 24px;border-bottom:1px solid var(--line);background:var(--panel);}h1,h2{margin:0;font-weight:600;}h1{font-size:22px;}h2{font-size:17px;margin-bottom:12px;}main{max-width:1180px;margin:0 auto;padding:18px;} .grid{display:grid;grid-template-columns:repeat(12,1fr);gap:14px;margin-bottom:14px}.panel{background:#fff;border:1px solid var(--line);border-radius:6px;padding:14px}.span-12{grid-column:span 12}.span-6{grid-column:span 6}label{display:block;margin-bottom:5px;color:#344054;font-size:13px}input,select,textarea{width:100%;min-height:34px;padding:7px 9px;border:1px solid #c9d1dc;border-radius:4px;background:#fff;color:var(--text);font:inherit}textarea{min-height:260px;font-family:Menlo,Consolas,monospace;font-size:12px}.toolbar{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:10px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}button{min-height:34px;padding:7px 12px;border:1px solid #b6c2d1;border-radius:4px;background:#fff;cursor:pointer;font:inherit}button.primary{border-color:var(--primary);background:var(--primary);color:#fff}.message{min-height:24px;margin-top:10px;color:var(--muted)}.message.ok{color:var(--ok)}.message.fail{color:var(--danger)}pre{margin:0;padding:10px;border:1px solid var(--line);border-radius:6px;background:#fbfcfd;overflow:auto;font-size:12px}@media(max-width:900px){.span-6{grid-column:span 12}.toolbar{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <header><h1>H-B-01 接收 OrderIntent</h1></header>
  <main>
    <section class="grid">
      <div class="panel span-6">
        <h2>OrderIntent 输入</h2>
        <div class="toolbar">
          <div><label for="sourceSelect">来源</label><select id="sourceSelect"><option>strategy_brain</option><option>portfolio_manager</option><option>manual</option></select></div>
          <div><label for="intentId">Intent ID</label><input id="intentId"></div>
          <div><label for="dryRun">模式</label><select id="dryRun"><option value="true">dry_run</option><option value="false">live</option></select></div>
        </div>
        <textarea id="intentInput"></textarea>
        <div class="actions">
          <button class="primary" id="validateBtn">校验</button>
          <button id="sampleBtn">示例</button>
          <button id="saveBtn">保存草稿</button>
        </div>
        <div id="message" class="message"></div>
      </div>
      <div class="panel span-6">
        <h2>标准化结果</h2>
        <pre id="normalizedView">-</pre>
      </div>
    </section>
  </main>
  <script>
    const els={sourceSelect:document.getElementById("sourceSelect"),intentId:document.getElementById("intentId"),dryRun:document.getElementById("dryRun"),intentInput:document.getElementById("intentInput"),normalizedView:document.getElementById("normalizedView"),message:document.getElementById("message")};
    const sample={account_name:"master_account",connector_name:"binance_perpetual",trading_pair:"BTC-USDT",trade_type:"BUY",order_type:"LIMIT",amount:"0.01",price:"65000",position_action:"OPEN",risk_check_id:"S-C-08"};
    function setMessage(t,c=""){els.message.className=`message ${c}`;els.message.textContent=t;}
    function loadSample(){els.intentId.value=`intent_${Date.now()}`;els.intentInput.value=JSON.stringify(sample,null,2);validate();}
    function validate(){try{const raw=JSON.parse(els.intentInput.value);const required=["account_name","connector_name","trading_pair","trade_type","order_type","amount"];const missing=required.filter(k=>!raw[k]);if(missing.length)throw new Error(`缺少字段：${missing.join(", ")}`);const normalized={intent_id:els.intentId.value||`intent_${Date.now()}`,source:els.sourceSelect.value,dry_run:els.dryRun.value==="true",received_at:new Date().toISOString(),order_intent:raw,status:"accepted"};els.normalizedView.textContent=JSON.stringify(normalized,null,2);setMessage("校验通过。","ok");return normalized;}catch(e){setMessage(`校验失败：${e.message}`,"fail");return null;}}
    function saveDraft(){const data=validate();if(!data)return;localStorage.setItem("chuanLastOrderIntent",JSON.stringify(data));setMessage("已保存草稿。","ok");}
    document.getElementById("validateBtn").addEventListener("click",validate);document.getElementById("sampleBtn").addEventListener("click",loadSample);document.getElementById("saveBtn").addEventListener("click",saveDraft);loadSample();
  </script>
</body>
</html>
