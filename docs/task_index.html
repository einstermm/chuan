<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>任务原型总览</title>
  <style>
    :root{--bg:#f6f7f8;--panel:#fff;--line:#d9dde3;--text:#1f2933;--muted:#697386;--primary:#1f6feb}
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,"Microsoft YaHei",sans-serif;font-size:14px;line-height:1.5}
    header{padding:18px 24px;border-bottom:1px solid var(--line);background:var(--panel)}
    h1,h2{margin:0;font-weight:600}
    h1{font-size:22px}
    h2{font-size:17px;margin-bottom:12px}
    main{max-width:1200px;margin:0 auto;padding:18px}
    .panel{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:14px;margin-bottom:14px}
    .toolbar{display:grid;grid-template-columns:1fr 180px 180px;gap:10px;margin-bottom:14px}
    input,select{width:100%;min-height:34px;padding:7px 9px;border:1px solid #c9d1dc;border-radius:4px;background:#fff;color:var(--text);font:inherit}
    table{width:100%;border-collapse:collapse;background:#fff}
    th,td{padding:9px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
    th{background:#f8fafc;color:#344054;font-size:13px;font-weight:600}
    a{color:var(--primary);text-decoration:none;font-weight:600}
    a:hover{text-decoration:underline}
    .muted{color:var(--muted)}
    .chip{display:inline-block;margin:0 6px 6px 0;padding:2px 7px;border:1px solid var(--line);border-radius:999px;background:#fbfcfd;color:var(--muted);font-size:12px}
    .summary{display:flex;gap:10px;flex-wrap:wrap}
    @media(max-width:900px){.toolbar{grid-template-columns:1fr}th:nth-child(4),td:nth-child(4){display:none}}
  </style>
</head>
<body>
  <header><h1>任务原型总览</h1></header>
  <main>
    <section class="panel">
      <div class="summary">
        <span class="chip" id="totalCount">0</span>
        <span class="chip">Hummingbot</span>
        <span class="chip">自己开发</span>
        <a class="chip" href="quant_business_flow.html" target="_blank" rel="noopener">业务闭环</a>
      </div>
    </section>

    <section class="panel">
      <div class="toolbar">
        <input id="searchInput" placeholder="搜索编号或任务">
        <select id="sourceFilter">
          <option value="">全部来源</option>
          <option value="Hummingbot">Hummingbot</option>
          <option value="自己开发">自己开发</option>
        </select>
        <select id="groupFilter">
          <option value="">全部分组</option>
        </select>
      </div>
      <table>
        <thead>
          <tr>
            <th>编号</th>
            <th>任务</th>
            <th>分组</th>
            <th>来源</th>
          </tr>
        </thead>
        <tbody id="taskRows"></tbody>
      </table>
    </section>
  </main>

  <script>
    const tasks = [
      {source:"Hummingbot", group:"A. 连接交易所", id:"H-A-01", name:"配置交易所 API Key", href:"hummingbot_pages/H-A-01_config_exchange_api_key.html"},
      {source:"Hummingbot", group:"A. 连接交易所", id:"H-A-01-01", name:"后端连接", href:"hummingbot_pages/H-A-01-01_backend_connection.html"},
      {source:"Hummingbot", group:"A. 连接交易所", id:"H-A-02", name:"接入交易所 Connector", href:"hummingbot_pages/H-A-02_connect_exchange_connector.html"},
      {source:"Hummingbot", group:"A. 连接交易所", id:"H-A-03", name:"读取账户余额", href:"hummingbot_pages/H-A-03_read_account_balances.html"},
      {source:"Hummingbot", group:"A. 连接交易所", id:"H-A-04", name:"读取持仓信息", href:"hummingbot_pages/H-A-04_read_positions.html"},
      {source:"Hummingbot", group:"A. 连接交易所", id:"H-A-05", name:"读取实时行情", href:"hummingbot_pages/H-A-05_read_realtime_market_data.html"},
      {source:"Hummingbot", group:"A. 连接交易所", id:"H-A-06", name:"读取订单簿数据", href:"hummingbot_pages/H-A-06_read_order_book.html"},
      {source:"Hummingbot", group:"A. 连接交易所", id:"H-A-07", name:"处理交易对精度、最小下单量、手续费规则", href:"hummingbot_pages/H-A-07_trading_rules_precision_fees.html"},
      {source:"Hummingbot", group:"B. 执行订单", id:"H-B-01", name:"接收外部系统传入的 OrderIntent", href:"hummingbot_pages/H-B-01_receive_order_intent.html"},
      {source:"Hummingbot", group:"B. 执行订单", id:"H-B-02", name:"创建买入/卖出订单", href:"hummingbot_pages/H-B-02_create_buy_sell_order.html"},
      {source:"Hummingbot", group:"B. 执行订单", id:"H-B-03", name:"执行市价单", href:"hummingbot_pages/H-B-03_execute_market_order.html"},
      {source:"Hummingbot", group:"B. 执行订单", id:"H-B-04", name:"执行限价单", href:"hummingbot_pages/H-B-04_execute_limit_order.html"},
      {source:"Hummingbot", group:"B. 执行订单", id:"H-B-05", name:"执行 TWAP 分批订单", href:"hummingbot_pages/H-B-05_execute_twap_order.html"},
      {source:"Hummingbot", group:"B. 执行订单", id:"H-B-06", name:"执行 PositionExecutor 订单", href:"hummingbot_pages/H-B-06_execute_position_executor_order.html"},

      {source:"Hummingbot", group:"C. 管理订单生命周期", id:"H-C-04", name:"处理订单失败", href:"hummingbot_pages/H-C-04_handle_order_failure.html"},
      {source:"Hummingbot", group:"C. 管理订单生命周期", id:"H-C-05", name:"自动撤单", href:"hummingbot_pages/H-C-05_auto_cancel_orders.html"},
      {source:"Hummingbot", group:"C. 管理订单生命周期", id:"H-C-06", name:"订单超时处理", href:"hummingbot_pages/H-C-06_order_timeout_handling.html"},
      {source:"Hummingbot", group:"C. 管理订单生命周期", id:"H-C-07", name:"止损、止盈、时间退出执行", href:"hummingbot_pages/H-C-07_stop_loss_take_profit_time_exit.html"},
      {source:"Hummingbot", group:"C. 管理订单生命周期", id:"H-C-08", name:"将订单和成交状态返回给你的系统", href:"hummingbot_pages/H-C-08_return_order_fill_status.html"},

      {source:"自己开发", group:"A. 策略大脑", id:"S-A-01", name:"设计策略逻辑", href:"development_pages/S-A-01_design_strategy_logic.html"},
      {source:"自己开发", group:"A. 策略大脑", id:"S-A-02", name:"计算交易信号", href:"development_pages/S-A-02_calculate_trading_signal.html"},
      {source:"自己开发", group:"A. 策略大脑", id:"S-A-03", name:"判断市场状态", href:"development_pages/S-A-03_judge_market_state.html"},
      {source:"自己开发", group:"A. 策略大脑", id:"S-A-04", name:"设计趋势过滤器", href:"development_pages/S-A-04_design_trend_filter.html"},
      {source:"自己开发", group:"A. 策略大脑", id:"S-A-05", name:"设计波动率过滤器", href:"development_pages/S-A-05_design_volatility_filter.html"},
      {source:"自己开发", group:"A. 策略大脑", id:"S-A-06", name:"判断是否允许开仓", href:"development_pages/S-A-06_allow_open_position.html"},
      {source:"自己开发", group:"A. 策略大脑", id:"S-A-07", name:"判断是否需要平仓", href:"development_pages/S-A-07_need_close_position.html"},
      {source:"自己开发", group:"B. 组合管理", id:"S-B-01", name:"定义账户总资金分配规则", href:"development_pages/S-B-01_define_account_allocation_rules.html"},
      {source:"自己开发", group:"B. 组合管理", id:"S-B-02", name:"定义单策略资金上限", href:"development_pages/S-B-02_define_strategy_capital_limit.html"},
      {source:"自己开发", group:"B. 组合管理", id:"S-B-03", name:"定义单币种仓位上限", href:"development_pages/S-B-03_define_symbol_position_limit.html"},
      {source:"自己开发", group:"B. 组合管理", id:"S-B-04", name:"计算目标仓位", href:"development_pages/S-B-04_calculate_target_position.html"},
      {source:"自己开发", group:"B. 组合管理", id:"S-B-05", name:"处理多个策略之间的资金冲突", href:"development_pages/S-B-05_resolve_strategy_capital_conflict.html"},
      {source:"自己开发", group:"B. 组合管理", id:"S-B-06", name:"生成 PortfolioTarget", href:"development_pages/S-B-06_generate_portfolio_target.html"},
      {source:"自己开发", group:"B. 组合管理", id:"S-B-07", name:"将 PortfolioTarget 转换为 OrderIntent", href:"development_pages/S-B-07_convert_portfolio_target_to_order_intent.html"},
      {source:"自己开发", group:"C. 全局风控", id:"S-C-01", name:"设置单日最大亏损限制", href:"development_pages/S-C-01_set_daily_loss_limit.html"},
      {source:"自己开发", group:"C. 全局风控", id:"S-C-02", name:"设置单周最大亏损限制", href:"development_pages/S-C-02_set_weekly_loss_limit.html"},
      {source:"自己开发", group:"C. 全局风控", id:"S-C-03", name:"设置单策略最大亏损限制", href:"development_pages/S-C-03_set_strategy_loss_limit.html"},
      {source:"自己开发", group:"C. 全局风控", id:"S-C-04", name:"设置单币种最大风险暴露", href:"development_pages/S-C-04_set_symbol_risk_exposure.html"},
      {source:"自己开发", group:"C. 全局风控", id:"S-C-05", name:"设置最大订单金额", href:"development_pages/S-C-05_set_max_order_amount.html"},
      {source:"自己开发", group:"C. 全局风控", id:"S-C-06", name:"设置最大滑点限制", href:"development_pages/S-C-06_set_max_slippage_limit.html"},
      {source:"自己开发", group:"C. 全局风控", id:"S-C-07", name:"设计全局 Kill Switch", href:"development_pages/S-C-07_design_global_kill_switch.html"},
      {source:"自己开发", group:"C. 全局风控", id:"S-C-08", name:"决定是否允许 OrderIntent 发送给 Hummingbot", href:"development_pages/S-C-08_allow_order_intent_to_hummingbot.html"},
      {source:"自己开发", group:"D. 研究回测", id:"S-D-01", name:"下载历史行情数据", href:"development_pages/S-D-01_download_historical_market_data.html"},
      {source:"自己开发", group:"D. 研究回测", id:"S-D-02", name:"清洗和检查数据质量", href:"development_pages/S-D-02_clean_and_check_data_quality.html"},
      {source:"自己开发", group:"D. 研究回测", id:"S-D-03", name:"计算历史信号", href:"development_pages/S-D-03_calculate_historical_signals.html"},
      {source:"自己开发", group:"D. 研究回测", id:"S-D-04", name:"执行策略回测", href:"development_pages/S-D-04_run_strategy_backtest.html"},
      {source:"自己开发", group:"D. 研究回测", id:"S-D-05", name:"加入手续费模型", href:"development_pages/S-D-05_add_fee_model.html"},
      {source:"自己开发", group:"D. 研究回测", id:"S-D-06", name:"加入滑点模型", href:"development_pages/S-D-06_add_slippage_model.html"},
      {source:"自己开发", group:"D. 研究回测", id:"S-D-07", name:"计算收益、回撤、夏普、胜率等指标", href:"development_pages/S-D-07_calculate_backtest_metrics.html"},
      {source:"自己开发", group:"D. 研究回测", id:"S-D-08", name:"保存回测结果和策略参数", href:"development_pages/S-D-08_save_backtest_result_and_params.html"},
      {source:"自己开发", group:"E. 监控复盘", id:"S-E-01", name:"记录交易日志", href:"development_pages/S-E-01_record_trading_logs.html"},
      {source:"自己开发", group:"E. 监控复盘", id:"S-E-02", name:"记录订单和成交数据", href:"development_pages/S-E-02_record_orders_and_fills.html"},
      {source:"自己开发", group:"E. 监控复盘", id:"S-E-03", name:"计算实时 PnL", href:"development_pages/S-E-03_calculate_realtime_pnl.html"},
      {source:"自己开发", group:"E. 监控复盘", id:"S-E-04", name:"检查系统持仓与交易所持仓是否一致", href:"development_pages/S-E-04_check_position_consistency.html"},
      {source:"自己开发", group:"E. 监控复盘", id:"S-E-05", name:"监控 Hummingbot 是否正常运行", href:"development_pages/S-E-05_monitor_hummingbot_health.html"},
      {source:"自己开发", group:"E. 监控复盘", id:"S-E-06", name:"监控 API、行情、订单异常", href:"development_pages/S-E-06_monitor_api_market_order_errors.html"},
      {source:"自己开发", group:"E. 监控复盘", id:"S-E-07", name:"发送 Telegram / Email 告警", href:"development_pages/S-E-07_send_telegram_email_alert.html"},
      {source:"自己开发", group:"E. 监控复盘", id:"S-E-08", name:"生成每日交易复盘报告", href:"development_pages/S-E-08_generate_daily_trading_review.html"}
    ];

    const els = {
      rows: document.getElementById("taskRows"),
      search: document.getElementById("searchInput"),
      source: document.getElementById("sourceFilter"),
      group: document.getElementById("groupFilter"),
      total: document.getElementById("totalCount")
    };

    function initGroups(){
      const groups = [...new Set(tasks.map(t => `${t.source} / ${t.group}`))];
      els.group.innerHTML += groups.map(g => `<option value="${escapeHtml(g)}">${escapeHtml(g)}</option>`).join("");
    }

    function filteredTasks(){
      const q = els.search.value.trim().toLowerCase();
      return tasks.filter(t => {
        const groupValue = `${t.source} / ${t.group}`;
        if (els.source.value && t.source !== els.source.value) return false;
        if (els.group.value && groupValue !== els.group.value) return false;
        if (!q) return true;
        return [t.id,t.name,t.group,t.source].join(" ").toLowerCase().includes(q);
      });
    }

    function render(){
      const rows = filteredTasks();
      els.total.textContent = `${rows.length} / ${tasks.length}`;
      els.rows.innerHTML = rows.length ? rows.map(t => {
        return `<tr>
          <td><a href="${t.href}" target="_blank" rel="noopener">${escapeHtml(t.id)}</a></td>
          <td>${escapeHtml(t.name)}</td>
          <td>${escapeHtml(t.group)}</td>
          <td>${escapeHtml(t.source)}</td>
        </tr>`;
      }).join("") : `<tr><td colspan="4" class="muted">无匹配任务。</td></tr>`;
    }

    function escapeHtml(v){
      return String(v).replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;");
    }

    [els.search, els.source, els.group].forEach(el => el.addEventListener("input", render));
    initGroups();
    render();
  </script>
</body>
</html>
